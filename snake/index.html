<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Snake</title>
<style>
  :root { --bg:#12141c; --panel:#1c2030; --text:#e8ebf5; --dim:#8a92aa; --accent:#6ee7b7; --food:#f87171; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px system-ui,sans-serif; padding:16px;
         display:flex; flex-direction:column; align-items:center; overflow:hidden; overscroll-behavior:none; }
  main { width:100%; max-width:480px; }
  .bar { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
  h1 { font-size:20px; margin:0; }
  .bar a { color:var(--dim); font-size:13px; }
  .score { color:var(--dim); }
  .score b { color:var(--accent); }
  .wrap { position:relative; }
  canvas { width:100%; aspect-ratio:1; display:block; background:var(--panel); border-radius:12px; touch-action:none; }
  #msg { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
         gap:12px; background:rgba(18,20,28,.8); border-radius:12px; text-align:center; }
  #msg button { padding:12px 28px; font-size:18px; font-weight:700; border:0; border-radius:12px; background:var(--accent); color:#0b1a14; }
  .hint { color:var(--dim); font-size:13px; margin-top:10px; text-align:center; }
  .pad { margin-top:14px; display:grid; grid-template-columns:repeat(3,1fr); gap:8px; max-width:240px; margin-inline:auto; }
  .pad button { padding:16px 0; font-size:22px; border:0; border-radius:12px; background:var(--panel); color:var(--text); user-select:none; }
  .pad button:active { background:#2a3050; }
  .pad .up { grid-column:2; } .pad .left { grid-column:1; grid-row:2; } .pad .down { grid-column:2; grid-row:2; } .pad .right { grid-column:3; grid-row:2; }
</style>
</head>
<body>
<main>
  <div class="bar"><h1>Snake</h1><a href="../">&larr; Games</a></div>
  <div class="score">Score <b id="score">0</b> &nbsp; Best <b id="best">0</b></div>
  <div class="wrap">
    <canvas id="board" width="400" height="400"></canvas>
    <div id="msg"><div id="title">Snake</div><button id="start">Play</button></div>
  </div>
  <div class="hint">Swipe on the board or use the buttons</div>
  <div class="pad">
    <button class="up" data-d="0,-1" aria-label="Up">&uarr;</button>
    <button class="left" data-d="-1,0" aria-label="Left">&larr;</button>
    <button class="down" data-d="0,1" aria-label="Down">&darr;</button>
    <button class="right" data-d="1,0" aria-label="Right">&rarr;</button>
  </div>
</main>
<script>
const N = 20, KEY = 'snake-best-v1';
const cv = document.getElementById('board'), ctx = cv.getContext('2d'), cell = cv.width / N;
const msg = document.getElementById('msg');
let snake, dir, queue, food, score, best = 0, timer = null;

try { best = +localStorage.getItem(KEY) || 0; } catch (e) {}
document.getElementById('best').textContent = best;

function placeFood() {
  do { food = { x:Math.floor(Math.random()*N), y:Math.floor(Math.random()*N) }; }
  while (snake.some(s => s.x === food.x && s.y === food.y));
}
function start() {
  snake = [{x:10,y:10},{x:9,y:10},{x:8,y:10}];
  dir = {x:1,y:0}; queue = []; score = 0;
  document.getElementById('score').textContent = 0;
  placeFood(); draw();
  msg.hidden = true;
  clearInterval(timer);
  timer = setInterval(tick, 120);
}
function turn(x, y) {
  const last = queue.length ? queue[queue.length-1] : dir;
  if ((x === -last.x && y === -last.y) || (x === last.x && y === last.y)) return;
  if (queue.length < 2) queue.push({x,y});
}
function tick() {
  if (queue.length) dir = queue.shift();
  const h = { x:snake[0].x + dir.x, y:snake[0].y + dir.y };
  const eat = h.x === food.x && h.y === food.y;
  const body = eat ? snake : snake.slice(0, -1);
  if (h.x < 0 || h.y < 0 || h.x >= N || h.y >= N || body.some(s => s.x === h.x && s.y === h.y)) return over();
  snake.unshift(h);
  if (eat) {
    score++;
    document.getElementById('score').textContent = score;
    placeFood();
    if (navigator.vibrate) navigator.vibrate(15);
  } else snake.pop();
  draw();
}
function over() {
  clearInterval(timer); timer = null;
  if (score > best) { best = score; document.getElementById('best').textContent = best; try { localStorage.setItem(KEY, best); } catch (e) {} }
  document.getElementById('title').textContent = 'Game over — score ' + score;
  document.getElementById('start').textContent = 'Play again';
  msg.hidden = false;
  if (navigator.vibrate) navigator.vibrate(60);
}
function draw() {
  const css = getComputedStyle(document.documentElement);
  ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.fillStyle = css.getPropertyValue('--food');
  ctx.beginPath(); ctx.arc((food.x+.5)*cell, (food.y+.5)*cell, cell*.38, 0, 7); ctx.fill();
  ctx.fillStyle = css.getPropertyValue('--accent');
  snake.forEach((s, i) => {
    ctx.globalAlpha = i ? .8 : 1;
    ctx.fillRect(s.x*cell+1, s.y*cell+1, cell-2, cell-2);
  });
  ctx.globalAlpha = 1;
}

document.getElementById('start').onclick = start;
document.querySelectorAll('.pad button').forEach(b => {
  b.addEventListener('pointerdown', e => { e.preventDefault(); const [x,y] = b.dataset.d.split(',').map(Number); turn(x,y); });
});
addEventListener('keydown', e => {
  const m = { ArrowUp:[0,-1], ArrowDown:[0,1], ArrowLeft:[-1,0], ArrowRight:[1,0], w:[0,-1], s:[0,1], a:[-1,0], d:[1,0] }[e.key];
  if (m) { e.preventDefault(); turn(...m); }
  else if ((e.key === ' ' || e.key === 'Enter') && !timer) start();
});
let t0 = null;
cv.addEventListener('touchstart', e => { t0 = e.touches[0]; }, { passive:true });
cv.addEventListener('touchmove', e => {
  if (!t0) return;
  const t = e.touches[0], dx = t.clientX - t0.clientX, dy = t.clientY - t0.clientY;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
  if (Math.abs(dx) > Math.abs(dy)) turn(Math.sign(dx), 0); else turn(0, Math.sign(dy));
  t0 = t;
}, { passive:true });

snake = [{x:10,y:10},{x:9,y:10},{x:8,y:10}]; food = {x:15,y:10}; draw();
</script>
</body>
</html>
