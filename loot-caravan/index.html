const $=id=>document.getElementById(id), cv=$('cv'),ctx=cv.getContext('2d'); const W=360,H=660, cart={x:180,y:355,w:44,h:66}; let state='menu',t=0,prev=0,spawn=0,player,enemies,loot,fx,shots,cartHP,cargo,kills,stolen,bag,combo,lastKill,stepBonus,boost,toastTime,phase=-1,bossSpawned=false,bossDead=false,attackHeld=false,joy={x:0,y:0,id:null},keys={},upgrades={damage:0,armor:0},earned=0,runGold=0; let seed=0; const rnd=()=>Math.random(), clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y), fmt=s=>`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`; const TYPES={grunt:{hp:34,speed:49,color:'#bf6d50',r:12,damage:6,rate:1.05},archer:{hp:27,speed:34,color:'#d5b36a',r:11,damage:7,rate:2.5},thief:{hp:24,speed:77,color:'#a78bcb',r:10,damage:0,rate:1.3},ram:{hp:80,speed:32,color:'#d98158',r:15,damage:14,rate:2.0},duelist:{hp:47,speed:63,color:'#cf776f',r:12,damage:9,rate:1.15},boss:{hp:480,speed:25,color:'#cf9b58',r:25,damage:17,rate:2.0}};

for(let i=0;i<enemies.length;i++)for(let j=i+1;j<enemies.length;j++){let a=enemies[i],b=enemies[j],dx=a.x-b.x,dy=a.y-b.y,dd=Math.hypot(dx,dy)||.01,min=TYPES[a.type].r+TYPES[b.type].r+2;if(dd<min){let f=(min-dd)*.25;a.x+=dx/dd*f;a.y+=dy/dd*f;b.x-=dx/dd*f;b.y-=dy/dd*f}}

let p=player;circle(p.x+2,p.y+6,15,'#14201c88');ctx.globalAlpha=p.inv>0&&Math.floor(t*20)%2?.5:1;circle(p.x,p.y,13,t<furyUntil?'#ff9548':boost>0?'#e4bf69':'#639bb9');circle(p.x,p.y-5,6,'#e5cfad');ctx.strokeStyle='#dfebea';ctx.lineWidth=4;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(p.x+p.dx*9,p.y+p.dy*9);ctx.lineTo(p.x+p.dx*23,p.y+p.dy*23);ctx.stroke();ctx.globalAlpha=1;

function circle(x,y,r,c){ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill()}
function frame(now){let dt=prev?Math.min(.045,(now-prev)/1000):0;prev=now;if(state==='run')update(dt);draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);
function resetJoy(){joy.x=joy.y=0;joy.id=null;$('knob').style.transform='translate(0,0)'}function moveJoy(e){let r=$('stick').getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2,l=Math.hypot(x,y),m=r.width*.33;joy.x=x/Math.max(m,l);joy.y=y/Math.max(m,l);$('knob').style.transform=`translate(${joy.x*m}px,${joy.y*m}px)`}$('stick').addEventListener('pointerdown',e=>{e.preventDefault();joy.id=e.pointerId;$('stick').setPointerCapture(e.pointerId);moveJoy(e)});$('stick').addEventListener('pointermove',e=>{if(e.pointerId===joy.id)moveJoy(e)});for(let s of ['pointerup','pointercancel','lostpointercapture'])$('stick').addEventListener(s,e=>{if(e.pointerId===joy.id)resetJoy()});$('attack').addEventListener('pointerdown',e=>{e.preventDefault();$('attack').setPointerCapture(e.pointerId);attackHeld=true;if(state==='run')swing()});for(let s of ['pointerup','pointercancel','lostpointercapture'])$('attack').addEventListener(s,()=>attackHeld=false);$('dash').addEventListener('pointerdown',e=>{e.preventDefault();dash()});function pause(){if(state!=='run')return;state='pause';attackHeld=false;resetJoy();panel('<div class="eyebrow">Journey paused</div><h1>Rest stop</h1><button class="wide" id="resume">Resume</button><button class="wide" id="quit">Abandon journey</button>');$('resume').onclick=()=>{state='run';hide()};$('quit').onclick=menu}$('pause').onclick=pause;document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});window.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;keys[e.key]=true;if(e.key==='Shift')dash();if(e.key==='Escape')pause();if([' ','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key))e.preventDefault()});window.addEventListener('keyup',e=>keys[e.key]=false);
let furyUntil=0,furyReady=0,motionEnabled=false,motionSeen=false,lastPulse=-Infinity,pulseCount=0,motionMessage='';
function activateFury(){if(state!=='run'||t<furyReady)return;furyUntil=t+5;furyReady=t+30;burst(player.x,player.y,'#ffad4b',24);say('BATTLE FURY! +50% damage');updateFuryButton();}
function updateFuryButton(){const b=$('fury');const active=t<furyUntil;b.classList.toggle('active',active);b.disabled=t<furyReady;b.textContent=active?'FURY '+Math.ceil(furyUntil-t)+'s':t<furyReady?'FURY '+Math.ceil(furyReady-t)+'s':'FURY';}
$('fury').onclick=activateFury;
function showMotionStatus(){const el=$('motionStatus');if(el)el.textContent=motionMessage||(motionEnabled?(motionSeen?'Motion detected. Gentle shake activates Fury.':'Waiting for motion sensor data; FURY button always works.'):'Gentle shake or tap FURY: +50% attack for 5s, 30s cooldown.');}
async function enableMotion(){if(motionEnabled){motionEnabled=false;window.removeEventListener('devicemotion',onMotion);motionMessage='Shake input off. FURY button still works.';$('motion').textContent='Enable optional shake input';showMotionStatus();return;}try{if(!window.isSecureContext||!window.DeviceMotionEvent)throw Error('Motion sensor unavailable');if(typeof DeviceMotionEvent.requestPermission==='function'&&await DeviceMotionEvent.requestPermission()!=='granted')throw Error('Motion permission denied');motionEnabled=true;motionSeen=false;motionMessage='';pulseCount=0;lastPulse=-Infinity;window.addEventListener('devicemotion',onMotion);if($('motion'))$('motion').textContent='Disable shake input';showMotionStatus();}catch(e){motionMessage=e.message+'. Use the FURY button.';showMotionStatus();}}
function onMotion(e){if(!motionEnabled)return;let a=e.acceleration,mag;if(a&&[a.x,a.y,a.z].every(Number.isFinite)){mag=Math.hypot(a.x,a.y,a.z);}else{a=e.accelerationIncludingGravity;if(!a||![a.x,a.y,a.z].every(Number.isFinite))return;mag=Math.abs(Math.hypot(a.x,a.y,a.z)-9.81);}if(!motionSeen){motionSeen=true;showMotionStatus();}if(state!=='run'||t<furyReady||mag<5.5)return;const now=performance.now();if(now-lastPulse<100)return;pulseCount=now-lastPulse<650?pulseCount+1:1;lastPulse=now;if(pulseCount>=2){pulseCount=0;activateFury();}}
