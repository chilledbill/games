<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Loot Caravan</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#111b1c;color:#f7e9ca;font:system-ui, sans-serif;touch-action:none}body{font-family:system-ui,sans-serif;display:grid;place-items:center}#shell{position:relative;width:min(100vw,480px);height:100dvh;max-height:900px;overflow:hidden;background:#293c32}canvas{width:100%;height:100%;display:block;touch-action:none}#hud{position:absolute;top:0;left:0;right:0;padding:10px 12px;background:linear-gradient(#101918ef,#101918a0,transparent);pointer-events:none;font-size:12px}#hud .line{display:flex;justify-content:space-between;gap:8px;align-items:center}#clock{font-size:23px;font-weight:800;letter-spacing:1px} .bar{height:7px;background:#182322;border-radius:8px;overflow:hidden;margin:4px 0 5px} .bar i{display:block;height:100%;background:#80bf85;width:100%;transition:width .1s}#playerbar i{background:#6faadf}#phase{font-weight:700;color:#f4d18b}#tip{position:absolute;top:110px;left:12px;right:12px;text-align:center;color:#fff2c9;font-size:12px;text-shadow:0 2px 3px #000;pointer-events:none}#controls{position:absolute;bottom:max(15px,env(safe-area-inset-bottom));left:0;right:0;height:124px;pointer-events:none;display:flex;align-items:flex-end;justify-content:space-between;padding:0 15px}#stick{width:120px;height:120px;border-radius:100%;background:#15221c88;border:2px solid #d6dec64d;position:relative;pointer-events:auto;touch-action:none}#knob{position:absolute;top:39px;left:39px;width:38px;height:38px;background:#d7e2b58a;border:2px solid #efedd1;border-radius:50%;pointer-events:none}#right{display:flex;flex-direction:column;align-items:flex-end;gap:8px;pointer-events:auto}button{font:inherit;font-weight:800;border-radius:12px;border:1px solid #c5ab76;background:#785332;color:#fff4da;padding:10px 16px;cursor:pointer;touch-action:none}button:active{filter:brightness(1.25)}#attack{height:74px;width:74px;border-radius:50%;background:#92563c;font-size:13px}#dash{height:44px;min-width:83px;background:#344f55;font-size:12px}#pause{position:absolute;right:12px;top:100px;padding:5px 9px;z-index:2;font-size:12px;background:#233833}#overlay{position:absolute;inset:0;display:grid;place-items:center;background:#101c1be8;z-index:5;padding:22px;overflow:auto;touch-action:pan-y}#overlay.hidden{display:none}.panel{width:100%;max-width:390px;border:1px solid #9b8857;border-radius:18px;background:#21322a;padding:22px;box-shadow:0 10px 40px #0006}.eyebrow{color:#e5c58a;letter-spacing:2px;font-size:11px;text-transform:uppercase}h1{font-size:31px;line-height:1.05;margin:9px 0 12px}p{line-height:1.45;font-size:14px;color:#e1dfc9}label{font-size:13px;display:block;margin:16px 0 6px}input{width:100%;padding:12px;border-radius:8px;background:#17231e;color:#fff;border:1px solid #7b876c;font:inherit;touch-action:auto}small{display:block;color:#b5c5b2;font-size:11px;margin-top:6px;line-height:1.4}.wide{width:100%;margin-top:16px;background:#997043}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stats div{background:#172820;border-radius:8px;padding:10px;font-size:12px}.stats b{display:block;font-size:21px;color:#f5d38f}#toast{position:absolute;top:42%;left:0;right:0;text-align:center;pointer-events:none;font-weight:bold;color:#ffe4a2;text-shadow:0 2px 4px #000;opacity:0;transition:opacity .15s}#toast.on{opacity:1}
#fury{height:39px;min-width:83px;background:#785025;font-size:11px;padding:5px 8px}#fury.active{background:#b16b27;border-color:#ffe19e}#fury:disabled{opacity:.65}#motion{width:100%;margin-top:8px;background:#344f55;font-size:12px}#motionStatus{min-height:22px}#overlay .panel{max-height:100%;overflow:auto;touch-action:pan-y}#overlay{overscroll-behavior:contain}
#right{display:grid;grid-template-columns:74px 74px;gap:7px;align-items:end}#attack,#heavy{width:74px;height:74px;border-radius:50%;padding:5px;font-size:12px}#heavy{background:#a37332;border:2px solid #f2c880}#heavy:disabled{opacity:.62}#dash,#fury{min-width:0;width:74px;height:38px;padding:4px;font-size:11px}#attack{grid-column:2;grid-row:2}#heavy{grid-column:1;grid-row:2}#fury{grid-column:1;grid-row:1}#dash{grid-column:2;grid-row:1}

const $=id=>document.getElementById(id), cv=$('cv'),ctx=cv.getContext('2d'); const W=360,H=660, cart={x:180,y:355,w:44,h:66}; let state='menu',t=0,prev=0,spawn=0,player,enemies,loot,fx,shots,cartHP,cargo,kills,stolen,bag,combo,lastKill,stepBonus,boost,toastTime,phase=-1,bossSpawned=false,bossDead=false,attackHeld=false,joy={x:0,y:0,id:null},keys={},upgrades={damage:0,armor:0},earned=0,runGold=0; let seed=0; const rnd=()=>Math.random(), clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y), fmt=s=>`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`; const TYPES={grunt:{hp:34,speed:49,color:'#bf6d50',r:12,damage:6,rate:1.05},archer:{hp:27,speed:34,color:'#d5b36a',r:11,damage:7,rate:2.5},thief:{hp:24,speed:77,color:'#a78bcb',r:10,damage:0,rate:1.3},ram:{hp:80,speed:32,color:'#d98158',r:15,damage:14,rate:2.0},duelist:{hp:47,speed:63,color:'#cf776f',r:12,damage:9,rate:1.15},boss:{hp:480,speed:25,color:'#cf9b58',r:25,damage:17,rate:2.0}};

function resetJoy(){joy.x=joy.y=0;joy.id=null;$('knob').style.transform='translate(0,0)'}function moveJoy(e){let r=$('stick').getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2,l=Math.hypot(x,y),m=r.width*.33;joy.x=x/Math.max(m,l);joy.y=y/Math.max(m,l);$('knob').style.transform=`translate(${joy.x*m}px,${joy.y*m}px)`}$('stick').addEventListener('pointerdown',e=>{e.preventDefault();joy.id=e.pointerId;$('stick').setPointerCapture(e.pointerId);moveJoy(e)});$('stick').addEventListener('pointermove',e=>{if(e.pointerId===joy.id)moveJoy(e)});for(let s of ['pointerup','pointercancel','lostpointercapture'])$('stick').addEventListener(s,e=>{if(e.pointerId===joy.id)resetJoy()});$('attack').addEventListener('pointerdown',e=>{e.preventDefault();$('attack').setPointerCapture(e.pointerId);attackHeld=true;unlockAudio();if(state==='run')swing()});for(let s of ['pointerup','pointercancel','lostpointercapture'])$('attack').addEventListener(s,()=>attackHeld=false);$('heavy').addEventListener('pointerdown',e=>{e.preventDefault();heavyAttack()});$('dash').addEventListener('pointerdown',e=>{e.preventDefault();dash()});function pause(){if(state!=='run')return;state='pause';attackHeld=false;resetJoy();panel('<div class="eyebrow">Journey paused</div><h1>Rest stop</h1><button class="wide" id="resume">Resume</button><button class="wide" id="quit">Abandon journey</button>');$('resume').onclick=()=>{state='run';hide()};$('quit').onclick=menu}$('pause').onclick=pause;document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});window.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;keys[e.key]=true;if(e.key==='Shift')dash();if(e.key.toLowerCase()==='q'&&!e.repeat)heavyAttack();if(e.key===' ')unlockAudio();if(e.key==='Escape')pause();if([' ','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key))e.preventDefault()});window.addEventListener('keyup',e=>keys[e.key]=false);

function onMotion(e){if(!motionEnabled)return;let a=e.acceleration,mag;if(a&&[a.x,a.y,a.z].every(Number.isFinite)){mag=Math.hypot(a.x,a.y,a.z);}else{a=e.accelerationIncludingGravity;if(!a||![a.x,a.y,a.z].every(Number.isFinite))return;mag=Math.abs(Math.hypot(a.x,a.y,a.z)-9.81);}if(!motionSeen){motionSeen=true;showMotionStatus();}if(state!=='run'||t<furyReady||mag<5.5)return;const now=performance.now();if(now-lastPulse<100)return;pulseCount=now-lastPulse<650?pulseCount+1:1;lastPulse=now;if(pulseCount>=2){pulseCount=0;activateFury();}}
