<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#110e18">
  <meta name="description" content="Rise of the Dead is an incremental necromancer RPG. Raise the fallen, build your legion, and conquer the underworld.">
  <title>Rise of the Dead</title>
  <style>
:root {
  color-scheme:dark;
  --base:#100e16; --deep:#120f1b; --panel:#191522; --inset:#15111e; --edge:#31263f; --border:#382c48;
  --text:#f1e8f4; --muted:#b4a4c2; --subtle:#a091ad; --purple:#c59aee; --pale:#ddbbff; --gold:#e4b87b;
  --heading: Georgia,"Times New Roman",serif; --body:"Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{min-height:100vh;margin:0;background:radial-gradient(ellipse at 48% 23%,#20162a 0,transparent 56%),var(--base);color:var(--text);font-family:var(--body);font-size:16px}
button,a,input,select{font:inherit}
button{color:inherit;cursor:pointer}
button:disabled{cursor:default}
a{color:inherit;text-decoration:none}
button:focus-visible,a:focus-visible,summary:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #d6a5ff;outline-offset:3px}
svg{width:19px;height:19px;display:block;flex:none}
[data-icon]{display:inline-flex;flex:none;align-items:center;justify-content:center}
h1,h2,h3,p{margin:0}
.frame{width:min(calc(100% - 64px),1496px);margin-inline:auto}
.masthead{background:#15101eef;border-bottom:1px solid #382947}
.head-inner{min-height:90px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.wordmark{display:inline-flex;align-items:center;gap:13px;white-space:nowrap}
.sigil{width:56px;height:56px;color:#d0a1fa;position:relative;filter:drop-shadow(0 0 9px #a556dc50)}
.sigil svg{width:100%;height:100%}
.wordmark-kicker{display:block;line-height:1.2;font-size:.66rem;font-weight:750;letter-spacing:.17em;color:#c49bdb}
.wordmark strong{display:block;font:700 2.2rem/.99 var(--heading);letter-spacing:-.04em;margin-top:4px}
.resources{display:flex;gap:10px;align-items:center}
.resource{display:flex;gap:10px;align-items:center;min-width:113px;padding:8px 12px;background:#1c1527;border:1px solid #372847;border-radius:8px}
.resource.essence{min-width:145px}
.resource-icon{width:29px;height:32px;border-radius:6px;background:#2b1d3a;color:#d1a0ff}
.resource-icon svg{width:19px;height:19px}
.essence .resource-icon{color:#dba777;background:#332439}
.mana .resource-icon{color:#b49efb;background:#271e44}
.dominion .resource-icon{color:#e0ad79;background:#322237}
.resource small{color:#b8a4c5;font-size:.64rem;line-height:1.1;letter-spacing:.1em;font-weight:750;display:block;white-space:nowrap}
.resource strong{display:block;font-size:1.18rem;line-height:1.15;letter-spacing:.01em;font-variant-numeric:tabular-nums}
.resource strong span{font-size:.91rem;color:#ae9fbd;font-weight:600}
.icon-button{display:inline-flex;justify-content:center;align-items:center;background:#201929;border:1px solid #3b2c4a;border-radius:7px;color:#c9b5d9;min-width:37px;min-height:35px;font-size:.86rem;font-weight:700;line-height:1}
.icon-button.enabled,.icon-button.active,.icon-button:hover:not(:disabled){background:#352347;color:#ead0ff;border-color:#74508c}
.icon-button:disabled{opacity:.47}
.sound{width:42px;height:43px;margin-left:3px}
.nav-wrap{background:#17121fe8;border-bottom:1px solid #31263e}
.nav-inner{display:flex;align-items:center;justify-content:space-between;gap:14px}
.main-nav{display:flex;gap:8px;min-height:53px}
.main-nav button{position:relative;display:flex;gap:8px;align-items:center;padding:0 16px;background:none;border:0;border-radius:0;font-size:.91rem;color:#b9abc7;font-weight:640;white-space:nowrap}
.main-nav button svg{width:17px;height:17px}
.main-nav button:first-child{padding-left:12px}
.main-nav button:hover{color:#edd4ff;background:#21182b}
.main-nav button.active{color:#e0bcff;background:linear-gradient(0deg,#a158dd24,transparent);box-shadow:inset 0 -2px #b67dde}
.save-state{display:flex;align-items:center;gap:6px;color:#ae9fbd;font-size:.79rem;white-space:nowrap}
.save-state svg{width:15px;height:15px;color:#8db28f}
.game{display:grid;grid-template-columns:minmax(198px,224px) minmax(0,1fr) minmax(202px,236px);gap:16px;padding-top:20px;align-items:start}
.campaign,.legion,.play-column{display:grid;gap:14px;min-width:0}
.play-column{gap:12px}
.panel{background:linear-gradient(155deg,#1c1727,#171320 72%);border:1px solid var(--edge);border-radius:10px;min-width:0;box-shadow:0 8px 22px #09071021}
.panel-heading{display:flex;gap:8px;align-items:center;min-height:48px;padding:9px 13px;border-bottom:1px solid #30243c}
.heading-icon{color:#ba95d7}
.heading-icon svg{width:18px;height:18px}
.panel-heading h2{font:700 1.16rem/1.15 var(--heading);white-space:nowrap}
.panel-heading .text-button{margin-left:auto}
.dungeon-panel #dungeons{display:grid;gap:8px;padding:10px}
.dungeon-card{width:100%;min-height:81px;text-align:left;padding:11px 8px;display:flex;gap:9px;align-items:center;position:relative;overflow:hidden;border-radius:7px;background:#1a1524;border:1px solid #35283f}
.dungeon-card:hover,.dungeon-card.is-preview{border-color:#7e548d;background:#2a1d36}
.dungeon-card.selected{background:linear-gradient(110deg,#39234e,#271931);border-color:#8457a3}
.dungeon-card.selected::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:2px;background:#c38cf6;border-radius:3px}
.dungeon-card.locked{color:#d0c2d9}
.rank-badge{width:33px;height:37px;display:grid;place-items:center;border:1px solid #624677;border-radius:6px;background:#36234a;color:#e0bcff;font:700 1.11rem var(--heading);flex:none}
.rank-badge.d{border-color:#675044;background:#332634;color:#deb394}
.dungeon-card.locked .rank-badge{opacity:.68}
.dungeon-name{display:block;font:700 .98rem/1.11 var(--heading)}
.dungeon-status{display:block;margin-top:5px;color:#baabca;font-size:.74rem}
.selected .dungeon-status{color:#d7abee}
.dungeon-card .mini-icon{margin-left:auto;color:#a194ad}
.mini-icon svg{width:13px;height:13px}
.field-guide{padding:13px;display:grid;gap:7px;min-height:96px}
.field-guide h2{display:flex;gap:7px;align-items:center;color:#dec1f8;font:700 1rem/1.2 var(--heading)}
.field-guide h2 svg{width:15px;height:15px;color:#bd8fea}
.field-guide p{color:#c6b7d2;font-size:.82rem;line-height:1.5}
.field-guide small{color:#b5a6c1;font-size:.76rem;line-height:1.45}
.field-guide .boss-preview{display:flex;gap:8px;align-items:center;margin-top:3px}
.field-guide .boss-preview img{width:45px;height:44px;object-fit:contain}
.battle-heading{min-height:73px;display:flex;justify-content:space-between;gap:12px;align-items:center;padding:0 1px 2px}
.battle-location{display:flex;gap:8px;align-items:center;color:#b5a4bd;font-size:.76rem;font-weight:650}
.rank-label{background:#3b2753;color:#ddafff;border:1px solid #6d4b87;border-radius:4px;padding:2px 6px;font-size:.64rem;font-weight:800;letter-spacing:.095em}
.battle-title h1,.management h1{font:700 clamp(1.72rem,3.1vw,2.33rem)/1.0 var(--heading);letter-spacing:-.028em;margin-top:4px}
.battle-title p{font-size:.85rem;color:#c3b4d0;margin-top:5px}
.battle-title p span{padding-inline:4px;color:#b18ac7}
.battle-tools{display:flex;gap:8px;align-items:center;margin-top:9px}
.speed-control{display:flex;gap:3px;background:#17121e;border:1px solid #382a45;border-radius:7px;padding:3px}
.speed-control .icon-button{border-color:transparent;min-width:34px;min-height:29px;background:transparent}
.speed-control .icon-button.active,.speed-control .icon-button:hover{background:#3a274f;color:#ead0ff;border-color:#513563}
.speed-control svg,.retreat-button svg{width:15px;height:15px}
.retreat-button{min-height:37px}
.arena{position:relative;isolation:isolate;overflow:hidden;border:1px solid #513864;border-radius:10px;background:#161023;box-shadow:0 9px 30px #09050d67,inset 0 0 16px #451b5261}
.arena canvas{display:block;width:100%;height:auto;aspect-ratio:2/1;min-height:270px;object-fit:fill;touch-action:manipulation}
.arena.targeting canvas{cursor:crosshair}
.arena-top,.arena-middle,.arena-bottom,.cinematic{position:absolute;pointer-events:none;left:0;right:0}
.arena-top{top:12px;padding:0 14px;display:flex;justify-content:space-between;gap:10px}
.arena-middle{top:23%;text-align:center}
.arena-bottom{bottom:15px;display:flex;align-items:end;justify-content:center;gap:8px;padding:0 12px}
.arena button,#cinematic button{pointer-events:auto}
.arena-tag{display:inline-flex;align-items:center;gap:6px;background:#17101fe8;border:1px solid #634a75;border-radius:5px;padding:6px 9px;color:#e2c6f4;font-size:.72rem;font-weight:700;letter-spacing:.04em;white-space:nowrap}
.arena-tag svg{width:13px;height:13px}
.arena-tag.warning{color:#ffc09e;border-color:#7a524e}
.arena .button{box-shadow:0 4px 22px #0c0817c7}
.arena-message{display:inline-block;max-width:94%;background:#1c1426ee;border:1px solid #65467a;padding:7px 12px;border-radius:7px;color:#ead7fa;font-size:.82rem;font-weight:650}
.arena-note{color:#d6c4df;text-shadow:0 1px 4px #090413;font-size:.75rem;margin-top:7px}
.stage-cta{display:grid;justify-items:center;text-align:center}
.boss-meter{width:min(65%,470px);margin:auto;padding:7px 11px 8px;background:#1c1224ef;border:1px solid #80516a;border-radius:6px;text-align:left}
.boss-meter strong{font:700 .98rem/1.2 var(--heading);color:#f6d3ca}
.boss-meter .meter-text{font-size:.74rem;color:#e4bacb}
.boss-meter .meter{background:#382339}
.boss-meter .meter span{background:linear-gradient(90deg,#7d3152,#e68381)}
.boss-intro{display:inline-block;border-block:1px solid #bb8c6f86;background:radial-gradient(ellipse,#1f1326ed,transparent);width:min(84%,560px);padding:11px 8px}
.boss-intro small,.cinematic small{display:block;color:#f1c38c;font-size:.68rem;letter-spacing:.17em;font-weight:800}
.boss-intro strong,.cinematic strong{display:block;font:700 clamp(1.15rem,3vw,2rem)/1.1 var(--heading);color:#f8e2d7;margin-top:5px}
.cinematic{inset:0;text-align:center;padding:9px 13px;display:grid;align-content:end;justify-items:center;gap:5px;text-shadow:0 1px 7px black}
.cinematic p{font-size:.75rem;color:#e6c8f9;max-width:75%}
.cinematic .skip{position:absolute;top:11px;right:11px}
.cinematic .oath{padding:8px 16px;background:#160e20c9;border-top:1px solid #825f927d;min-width:min(76%,450px);display:grid;justify-items:center;gap:4px}
.room-track{display:flex;gap:5px;align-items:center;padding:0 2px;margin-top:-3px}
.room-track span{flex:1;min-height:4px;border-radius:5px;background:#33283c}
.room-track span.current{background:#c88df6;box-shadow:0 0 9px #b36ff491}
.room-track span.done{background:#795399}
.room-track span.boss:not(.current):not(.done){background:#6b4a50}
.command-heading{min-height:43px}
.command-hint{font-size:.75rem;color:#b9aac7;margin-left:auto;text-align:right}
.command-row{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;padding:8px}
.command{display:flex;position:relative;min-height:58px;padding:7px 5px 7px 6px;align-items:center;gap:5px;text-align:left;background:#21182c;border:1px solid #3a2b49;border-radius:7px}
.command:hover:not(:disabled),.command.targeting{border-color:#a678bd;background:#3a264c}
.command.primary{background:linear-gradient(145deg,#573379,#352145);border-color:#704c8b}
.command.primary.ready{background:linear-gradient(145deg,#733e9a,#4a2b61);border-color:#d69af6;box-shadow:0 0 14px #985cc044}
.command:disabled{filter:saturate(.70);opacity:.72}
.action-icon{width:23px;color:#c5a0e4}
.action-icon svg{width:18px;height:18px}
.command strong{display:block;font-size:.74rem;line-height:1.16;font-weight:730}
.command small{display:block;color:#c5aed2;font-size:.64rem;line-height:1.2;margin-top:3px}
kbd{color:#b8a6c8;border:1px solid #51415f;background:#21172c;border-radius:3px;padding:0 3px;font:.61rem/1.25 var(--body);display:inline-flex;align-items:center}
.command kbd{align-self:start;margin-left:auto}
.chronicle .panel-heading{min-height:41px}
.chronicle ol{padding:8px 12px 9px;margin:0;list-style:none;display:grid;gap:5px;max-height:94px;overflow:auto}
.chronicle li{display:flex;gap:8px;color:#c6b6ce;font-size:.78rem;line-height:1.35}
.chronicle li::before{content:"";width:5px;height:5px;border-radius:50%;background:#9774b6;flex:none;margin-top:6px}
.chronicle li.violet{color:#d7b3f2}.chronicle li.gold{color:#efc18a}.chronicle li.warning{color:#eba9a6}
.chronicle time{color:#a794b0;font-size:.71rem;white-space:nowrap;font-variant-numeric:tabular-nums}
.legion .inside{padding:11px 12px;display:grid;gap:10px}
.meter-line{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:.8rem;color:#c6b7d2}
.meter-line strong{color:#ecd7fb;font-size:.83rem}
.meter{height:5px;background:#322641;border-radius:99px;overflow:hidden;margin-top:5px}
.meter span{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,#7750a4,#c291ef);min-width:0}
.legion-units{display:grid;gap:6px}
.unit-strip{display:flex;align-items:center;gap:8px;min-height:49px;border:1px solid #382a46;background:#21182b;border-radius:6px;padding:4px 7px 4px 3px}
.unit-strip img{width:38px;height:37px;object-fit:contain;background:#352547;border-radius:4px}
.unit-strip strong{display:block;font-family:var(--heading);font-size:.92rem;line-height:1.13}
.unit-strip small{color:#c0adc9;font-size:.71rem;line-height:1.1;display:block;margin-top:3px}
.unit-strip .count{margin-left:auto;color:#e0c5ef;font-size:.82rem;font-weight:750;white-space:nowrap}
.legion-summary{border-top:1px solid #33253f;padding-top:9px;display:grid;gap:6px;margin-top:1px}
.empty-card{display:grid;justify-items:center;text-align:center;padding:10px 5px;gap:7px;color:#c5b4d0;font-size:.81rem;line-height:1.45}
.empty-emblem{display:grid;place-items:center;width:41px;height:43px;border:1px solid #503860;border-radius:7px;color:#ad86c8;background:#2a1d38}
.empty-emblem svg{width:22px;height:22px}
.empty-card strong{font:700 1rem var(--heading);color:#e6d3f0}
.text-button{display:inline-flex;justify-content:center;align-items:center;gap:5px;padding:4px 0;color:#d4aaf8;background:none;border:0;font-size:.77rem;font-weight:650;white-space:nowrap}
.text-button:hover{text-decoration:underline;color:#f2d6ff}
.text-button svg{width:13px;height:13px}
.button{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:36px;padding:7px 13px;border:1px solid #674483;border-radius:6px;background:#3c2652;color:#f3defe;font-size:.82rem;font-weight:750;text-align:center}
.button svg{width:16px;height:16px}
.button:hover:not(:disabled){background:#593873;border-color:#b27ad9}
.button:disabled{opacity:.49}
.button.accent{background:linear-gradient(135deg,#8351ab,#593575);border-color:#b681db;color:#fff0ff;font-size:.92rem;padding:8px 15px}
.button.accent:hover{background:linear-gradient(135deg,#a36ace,#754797)}
.button.secondary{background:#251b33;border-color:#544165}
.button.danger{background:#492333;border-color:#8e4b65}
.manage-heading{display:grid;gap:7px;margin-bottom:18px}
.manage-heading p,.manage-note{color:#c1afcc;font-size:.9rem;line-height:1.48}
.manage-note{padding:12px 14px;margin-bottom:12px}
.management h2{font:700 1.22rem var(--heading)}
.management h3{font:700 1.09rem/1.22 var(--heading)}
.manage-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.manage-grid.single{grid-template-columns:1fr}
.manage-card{display:grid;gap:9px;padding:12px;min-width:0}
.manage-title{display:flex;align-items:center;gap:9px}
.manage-title img,.manage-icon{width:48px;height:48px;object-fit:contain;background:#30203f;border:1px solid #503760;border-radius:6px;color:#cba3ed;display:grid;place-items:center;flex:none}
.manage-title img.mystery{filter:brightness(.33) contrast(1.2)}
.manage-title p{color:#cab6d3;font-size:.78rem;margin-top:3px}
.manage-card dl{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;padding:8px;margin:0;background:#161121;border-radius:6px}
.manage-card dl div{min-width:35px}
.manage-card dt{color:#b8a6bf;font-size:.73rem}
.manage-card dd{margin:3px 0 0;font-size:.85rem;font-weight:700}
.manage-card>p,.manage-card label{color:#cebed7;font-size:.83rem;line-height:1.48}
.manage-card .buttons{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.general-control{display:grid;gap:6px}
.general-control .button{width:100%}
.exp-draft{display:grid;gap:8px}
.exp-unit{display:flex;justify-content:space-between;align-items:center;gap:7px}
.exp-unit label{font-weight:650}
.exp-unit input,.exp-draft select{width:64px;background:#21182b;color:#ede0f4;border:1px solid #624773;border-radius:5px;padding:6px}
.exp-draft select{width:100%}
.exp-forecast{padding:8px;background:#23182e;border-radius:5px;color:#dec9ea;font-size:.81rem;line-height:1.5}
.toast{position:fixed;z-index:6;right:20px;bottom:20px;max-width:min(400px,calc(100% - 40px));padding:11px 15px;border:1px solid #8d63a7;border-radius:7px;background:#342140;color:#f3defa;box-shadow:0 7px 32px #0009;font-size:.88rem}
.footer{display:flex;align-items:center;justify-content:space-between;margin-top:16px;padding:8px 1px 18px;color:#a393ad;font-size:.75rem}
.footer-dot{color:#b684d2;padding:0 3px}
dialog{width:min(540px,calc(100% - 32px));max-height:90vh;overflow:auto;color:var(--text);background:#1d162b;border:1px solid #8b62a3;border-radius:10px;padding:18px;box-shadow:0 16px 62px #000a}
dialog::backdrop{background:#0f0a18b9}
dialog h2{font:700 1.55rem var(--heading);margin-bottom:6px}
dialog p{font-size:.91rem;color:#cbbad9;line-height:1.5}
.dialog-top{display:flex;justify-content:space-between;gap:10px;margin-bottom:10px}
.dev-actions{display:flex;flex-wrap:wrap;gap:7px;margin-block:10px}
dialog label{display:grid;gap:5px;margin-top:8px;color:#d7c2e2;font-size:.87rem}
dialog select{padding:7px;color:#ecdaf5;background:#2b1e38;border:1px solid #614774;border-radius:6px}
@media(max-width:1230px){
  .frame{width:calc(100% - 36px)}
  .game{grid-template-columns:190px minmax(0,1fr) 199px;gap:12px}
  .command kbd{display:none}
  .dungeon-card{gap:7px}
}
@media(max-width:1010px){
  .game{grid-template-columns:176px minmax(0,1fr)}
  .legion{grid-column:2;grid-template-columns:1fr 1fr;align-items:start}
  .campaign{grid-row:1/span 2}
  .command kbd{display:inline-flex}
}
@media(max-width:720px){
  .frame{width:calc(100% - 24px)}
  .head-inner{gap:9px;min-height:0;flex-wrap:wrap;padding-block:10px}
  .wordmark strong{font-size:1.8rem}
  .sigil{height:45px;width:45px}
  .resources{width:100%;gap:5px}
  .resource,.resource.essence{flex:1;min-width:0;padding:6px 5px;gap:5px}
  .resource-icon{width:23px;height:24px}
  .resource-icon svg{width:14px;height:14px}
  .resource small{font-size:.57rem;letter-spacing:.03em}
  .resource strong{font-size:1rem}
  .resource strong span{font-size:.75rem}
  .sound{height:36px;width:35px;min-width:35px}
  .nav-inner{width:100%;overflow:auto;padding-inline:9px}
  .main-nav{gap:0;min-height:46px}
  .main-nav button,.main-nav button:first-child{padding-inline:10px;font-size:.78rem}
  .main-nav button svg{width:14px;height:14px}
  .save-state{display:none}
  .game{display:flex;flex-direction:column;padding-top:12px;gap:11px}
  .campaign,.legion,.play-column,.management{width:100%}
  .campaign{order:2}.legion{order:1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
  .dungeon-panel #dungeons{grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;padding:6px}
  .dungeon-card{min-height:56px;gap:4px;padding:6px 3px;overflow:visible}
  .dungeon-card .mini-icon{display:none}
  .rank-badge{width:21px;height:29px;font-size:.91rem}
  .dungeon-name{font-size:.81rem}
  .dungeon-status{font-size:.66rem}
  .field-guide{min-height:auto}
  .battle-heading{min-height:66px}
  .arena canvas{min-height:225px}
  .command-row{grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}

  <script>
"use strict";
(() => {
const unit = (name, role, cost, hp, damage, interval, speed, range, mana, essence, color, extra = {}) =>
  ({name, role, cost, hp, damage, interval, speed, range, mana, essence, color, ...extra});

const UNITS = {
  skeleton: unit("Skeleton", "Infantry", 1, 102, 21, 1.16, 59, 32, 9, 12, "#c6b9a9"),
  rat: unit("Giant Rat", "Skirmisher", 1, 38, 7, .86, 86, 25, 7, 8, "#9b7c80"),
  goblin: unit("Goblin", "Melee damage", 1, 66, 12, 1.04, 65, 31, 12, 13, "#8c9d58"),
  archer: unit("Goblin Archer", "Ranged damage", 2, 49, 14, 1.54, 56, 186, 16, 18, "#a0aa63"),
  armored: unit("Armored Skeleton", "Frontline", 3, 221, 17, 1.28, 47, 35, 23, 27, "#94a4b5", {guard: .77}),
  spider: unit("Venom Spider", "Poison damage", 2, 83, 12, 1.04, 77, 33, 19, 22, "#879069", {poison: 5}),
  king: unit("Goblin King", "Swarm general", 5, 300, 27, 1.24, 63, 41, 0, 65, "#b3a062", {
    bossHP: 490, title: "The Hollow Crown", signature: "Royal Rally", cooldown: 25,
    command: "Summons three spectral goblins for 12 seconds.",
    leadership: "Skeletons, giant rats and goblins deal 18% more damage.",
    gesture: "The king bows and yields his crown.", accent: "#d2ad64"
  }),
  knight: unit("Vareth, the Crimson Knight", "Vanguard general", 8, 480, 43, 1.4, 56, 45, 0, 105, "#bd626a", {
    bossHP: 1350, title: "The Oathbreaker", signature: "Crimson Cleave", cooldown: 28,
    command: "Unleashes a frontal sweep for heavy area damage.",
    leadership: "Skeletons and armored skeletons gain 25% maximum health.",
    gesture: "Vareth kneels and plants his blade.", accent: "#ff7c91"
  }),
  queen: unit("The Brood Queen", "Summoner general", 10, 610, 44, 1.31, 70, 54, 0, 160, "#a685b6", {
    bossHP: 2420, title: "Mother of Venom", signature: "Brood Awakening", cooldown: 30,
    command: "Hatches five spectral venom spiders for 14 seconds.",
    leadership: "Giant rats and venom spiders deal 25% more damage.",
    gesture: "The queen lowers her body as spectral light runs through her limbs.", accent: "#ca8aff", poison: 8
  }),
  egg: unit("Brood Egg", "Hatches spiders", 0, 43, 0, 99, 0, 0, 0, 4, "#b8a969")
};

const COMMON = ["skeleton", "rat", "goblin", "archer", "armored", "spider"];
const GENERALS = ["king", "knight", "queen"];
const DUNGEONS = [
  {name: "Goblin Cavern", rank: "E", difficulty: "Beginner", boss: "king", cue: "A crown stirs in the dark.", color: "#a88ce5",
    species: ["rat","goblin","archer"], rooms: [
      ["The Outer Crossing", ["rat","rat"]],
      ["Scavenger's Den", ["rat","goblin","rat"]],
      ["The Winding Stairs", ["goblin","rat","archer","rat"]],
      ["The King's Guard", ["goblin","goblin","archer","rat","archer"]]
    ], clear: 100, expedition: {power: 62, time: 112, reward: 37}},
  {name: "Forgotten Crypt", rank: "D", difficulty: "Challenging", boss: "knight", cue: "A blade scrapes beneath the stone.", color: "#d49d79",
    species: ["skeleton","armored","archer"], rooms: [
      ["The Sunken Gate", ["skeleton","skeleton","archer","rat"]],
      ["Hall of Remains", ["skeleton","armored","archer","skeleton"]],
      ["Unmarked Graves", ["armored","skeleton","archer","archer","skeleton"]],
      ["The Ossuary", ["skeleton","armored","armored","archer","skeleton","archer"]],
      ["The Broken Oath", ["armored","armored","skeleton","archer","archer","skeleton"]]
    ], clear: 230, expedition: {power: 118, time: 159, reward: 86}},
  {name: "Spider Nest", rank: "D", difficulty: "Severe", boss: "queen", cue: "Beneath the web, something waits.", color: "#9ab68d",
    species: ["spider","rat","armored"], rooms: [
      ["Silken Passage", ["spider","rat","spider","rat","spider"]],
      ["The Hanging Brood", ["spider","spider","rat","spider","rat","spider"]],
      ["The Venom Pools", ["spider","rat","spider","armored","spider","rat"]],
      ["Webbed Catacomb", ["spider","spider","rat","spider","armored","spider","rat"]],
      ["The Nursery", ["spider","spider","spider","armored","spider","rat","spider"]],
      ["The Queen's Guard", ["armored","spider","spider","spider","spider","armored","rat","spider"]]
    ], clear: 480, expedition: {power: 180, time: 213, reward: 147}}
];

const UPGRADES = {
  dominion: {name: "Dominion", icon: "crown", detail: "Increases your active army’s capacity.", start: 5, step: 2, max: 13, base: 28, growth: 1.29, format: n => n + " capacity"},
  mana: {name: "Mana Capacity", icon: "drop", detail: "Increases maximum mana.", start: 45, step: 12, max: 10, base: 32, growth: 1.44, format: n => n + " mana"},
  regen: {name: "Mana Regeneration", icon: "spark", detail: "Restores mana faster during an attempt.", start: 1.65, step: .48, max: 12, base: 36, growth: 1.42, format: n => n.toFixed(2) + " per sec"},
  damage: {name: "Grave-Forged Blades", icon: "swords", detail: "Increases common undead attack damage.", start: 1, step: .22, max: 16, base: 37, growth: 1.36, format: n => Math.round(n*100) + "% damage"},
  armor: {name: "Restless Bones", icon: "shield", detail: "Increases common undead maximum health.", start: 1, step: .23, max: 16, base: 37, growth: 1.36, format: n => Math.round(n*100) + "% health"},
  general: {name: "Undying Oath", icon: "helm", detail: "Increases general health, attack and expedition strength.", start: 1, step: .22, max: 12, base: 73, growth: 1.39, format: n => Math.round(n*100) + "% general power"},
  expedition: {name: "March of the Dead", icon: "flag", detail: "Improves expedition performance and Essence yield.", start: 1, step: .14, max: 12, base: 62, growth: 1.42, format: n => Math.round(n*100) + "% efficiency"}
};

const ROUTE = {
  spacing: 920, chamberWidth: 822, lane: 289, corridorTop: 214, corridorBottom: 366,
  entrance: 211, engagement: 344, pace: 218, regroup: .65, riseTime: .50,
  rates: [.5,1,1.5,2]
};

const RULES = {
  width: 960, height: 480, roomWait: 8, rallyWindow: 7, betweenHeal: .24, repeatHeal: .20,
  reserveMana: 9, reinforceMana: 12, reinforceDuration: 8, reinforceCooldown: 21,
  offlineLimit: 8 * 3600, cinematicTime: 6.4
};
const isGeneral = id => GENERALS.includes(id);
const totalCost = stack => Object.entries(stack).reduce((sum,[id,count]) => sum + UNITS[id].cost*count, 0);
const countStack = stack => Object.values(stack).reduce((sum,count) => sum + count, 0);
const formatNumber = n => Math.floor(n).toLocaleString("en-US");
const timeLabel = n => {
  const seconds = Math.max(0, Math.ceil(n));
  return Math.floor(seconds/60) + ":" + String(seconds%60).padStart(2,"0");
};


const SAVE_KEY = "rise-of-the-dead.v1";
const cleanCount = value => Number.isFinite(value) ? Math.max(0, Math.floor(value)) : 0;
const stack = value => Object.fromEntries(Object.keys(UNITS).filter(id => id !== "egg" && cleanCount(value?.[id]))
  .map(id => [id, Math.min(isGeneral(id) ? 1 : 9999, cleanCount(value[id]))]));

const createState = (now = Date.now()) => ({
  version: 1, essence: 0, owned: {skeleton: 1}, lineup: {skeleton: 1}, levels: {}, cleared: [],
  expeditions: [], expeditionEssence: 0, lastSaved: now, sound: true, speed: 1, selected: 0
});
const value = (state, id) => UPGRADES[id].start + (state.levels[id] || 0) * UPGRADES[id].step;
const upgradeCost = (state, id) => Math.ceil(UPGRADES[id].base * UPGRADES[id].growth ** (state.levels[id] || 0));
const unlocked = (state, index) => index === 0 || state.cleared.includes(index - 1);
const automationUnlocked = state => state.cleared.includes(0) && Boolean(state.owned.king);
const assigned = (state, id) => state.expeditions.reduce((sum, expedition) => sum + (expedition.squad[id] || 0), 0);
const reserve = (state, id, active = state.lineup, regenerating = {}) =>
  Math.max(0,(state.owned[id] || 0) - assigned(state,id) - (active[id] || 0) - (regenerating[id] || 0));
const available = (state, active, regenerating) => Object.fromEntries(Object.keys(state.owned)
  .map(id => [id, reserve(state,id,active,regenerating)]).filter(([,count]) => count > 0));

function deploy(state, id, delta) {
  const definition = UNITS[id];
  if (!definition || ![1,-1].includes(delta)) return false;
  if (delta === 1 && (reserve(state,id) < 1 || totalCost(state.lineup) + definition.cost > value(state,"dominion"))) return false;
  const current = state.lineup[id] || 0;
  if (current + delta < 0) return false;
  if (current + delta) state.lineup[id] = current + delta;
  else delete state.lineup[id];
  return true;
}

function acquire(state, id) {
  if (!UNITS[id] || id === "egg" || (isGeneral(id) && state.owned[id])) return false;
  state.owned[id] = (state.owned[id] || 0) + 1;
  return true;
}

function buy(state, id) {
  if (!UPGRADES[id] || (state.levels[id] || 0) >= UPGRADES[id].max) return false;
  const cost = upgradeCost(state,id);
  if (state.essence < cost) return false;
  state.essence -= cost;
  state.levels[id] = (state.levels[id] || 0) + 1;
  return true;
}

function expeditionForecast(state, dungeonId, squad) {
  const target = DUNGEONS[dungeonId]?.expedition;
  if (!target) return null;
  const power = Object.entries(squad).reduce((sum,[id,count]) => {
    const def = UNITS[id];
    if (!def) return sum;
    const rating = isGeneral(id) ?
      (def.hp/16 + def.damage*.75) * value(state,"general") :
      def.hp/16 * value(state,"armor") + (def.damage / def.interval + (def.poison || 0)) * .65 * value(state,"damage");
    return sum + rating * count;
  },0) * value(state,"expedition");
  return {power: Math.floor(power), required: target.power,
    duration: Math.max(21, Math.ceil(target.time / Math.max(.6, power/target.power) ** .67)),
    reward: Math.floor(target.reward * value(state,"expedition"))};
}

function startExpedition(state, dungeon, draft) {
  if (!automationUnlocked(state) || !state.cleared.includes(dungeon) || state.expeditions.some(item => item.dungeon === dungeon)) return false;
  const squad = stack(draft);
  if (Object.keys(squad).filter(isGeneral).length !== 1 || !COMMON.some(id => squad[id])) return false;
  if (Object.entries(squad).some(([id,count]) => count > reserve(state,id))) return false;
  const forecast = expeditionForecast(state,dungeon,squad);
  if (!forecast || forecast.power < forecast.required) return false;
  state.expeditions.push({dungeon,squad,duration:forecast.duration,reward:forecast.reward,progress:0,cycles:0});
  return true;
}

function advanceExpeditions(state, seconds) {
  let earned = 0, clears = 0;
  if (!Number.isFinite(seconds) || seconds <= 0) return {earned,clears};
  for (const task of state.expeditions) {
    const total = task.progress + seconds;
    const cycles = Math.floor(total/task.duration);
    task.progress = total % task.duration;
    task.cycles += cycles;
    earned += cycles * task.reward;
    clears += cycles;
  }
  state.essence += earned;
  state.expeditionEssence += earned;
  return {earned,clears};
}

function syncExpeditions(state, now, cap = RULES.offlineLimit) {
  const elapsed = Math.max(0, (now-state.lastSaved)/1000);
  const result = advanceExpeditions(state, Math.min(elapsed,cap));
  state.lastSaved = Math.max(state.lastSaved,now);
  return result;
}

function normalize(raw, now = Date.now()) {
  if (!raw || raw.version !== 1) return createState(now);
  const state = createState(now);
  state.essence = cleanCount(raw.essence);
  state.lineup = {};
  state.owned = stack(raw.owned);
  if (!countStack(state.owned)) state.owned.skeleton = 1;
  for (const [id,up] of Object.entries(UPGRADES)) state.levels[id] = Math.min(up.max,cleanCount(raw.levels?.[id]));
  state.cleared = [...new Set((Array.isArray(raw.cleared) ? raw.cleared : [])
    .filter(id => Number.isInteger(id) && id >= 0 && id < DUNGEONS.length))];
  state.selected = unlocked(state,raw.selected) && DUNGEONS[raw.selected] ? raw.selected : 0;
  state.expeditionEssence = cleanCount(raw.expeditionEssence);
  state.sound = raw.sound !== false;
  state.speed = raw.speed === 2 ? 2 : 1;
  state.lastSaved = Number.isFinite(raw.lastSaved) ? Math.max(0,raw.lastSaved) : now;
  for (const task of Array.isArray(raw.expeditions) ? raw.expeditions : []) {
    const squad = stack(task?.squad);
    if (!startExpedition(state,task?.dungeon,squad)) continue;
    const restored = state.expeditions[state.expeditions.length-1];
    if (Number.isFinite(task.duration) && task.duration >= 21) restored.duration = Math.ceil(task.duration);
    if (Number.isFinite(task.reward) && task.reward >= 1) restored.reward = Math.floor(task.reward);
    restored.progress = Number.isFinite(task.progress) ? Math.max(0,Math.min(task.progress,restored.duration)) % restored.duration : 0;
    restored.cycles = cleanCount(task.cycles);
  }
  for (const [id, count] of Object.entries(stack(raw.lineup))) {
    const limit = Math.floor((value(state,"dominion")-totalCost(state.lineup))/UNITS[id].cost);
    const valid = Math.min(count,limit,reserve(state,id));
    if (valid > 0) state.lineup[id] = valid;
  }
  return state;
}

function loadGame(storage, now = Date.now()) {
  let raw;
  try { raw = JSON.parse(storage.getItem(SAVE_KEY)); } catch { raw = null; }
  const state = normalize(raw,now);
  const offline = syncExpeditions(state,now);
  saveGame(storage,state);
  return {state,offline};
}

function saveGame(storage,state) {
  try { storage.setItem(SAVE_KEY,JSON.stringify(state)); return true; }
  catch { return false; }
}



const distance = (a,b) => Math.hypot(a.x-b.x,a.y-b.y);
const clamp = (n,min,max) => Math.min(max,Math.max(min,n));
const tally = (result, unit) => { result[unit.kind] = (result[unit.kind] || 0) + 1; return result; };

class Battle {
  constructor(state, events = {}) {
    this.state = state;
    this.events = events;
    this.serial = 0;
    this.traversalRate = 1;
    this.reset();
  }

  reset() {
    this.phase = "ready";
    this.room = 0;
    this.team = [];
    this.enemies = [];
    this.encounters = [];
    this.march = null;
    this.corpses = [];
    this.effects = [];
    this.projectiles = [];
    this.regenerating = {};
    this.cooldowns = {};
    this.mana = value(this.state,"mana");
    this.rallyUntil = 0;
    this.focus = null;
    this.selectedCorpse = null;
    this.boss = null;
    this.bossCorpse = null;
    this.cinematic = null;
    this.elapsed = 0;
    this.roomElapsed = 0;
    this.reinforced = 0;
    this.reinforceReady = 0;
    this.paused = false;
    this.wait = 0;
    this.intro = 0;
    this.outcome = "";
    this.clearAwarded = false;
  }

  get dungeon() { return DUNGEONS[this.state.selected]; }
  get ongoing() { return ["marching","fighting","between","fallen","cinematic"].includes(this.phase); }
  get field() { return this.team.filter(unit => unit.hp > 0 && !unit.temporary).reduce(tally,{}); }
  get reserves() { return available(this.state,this.ongoing ? this.field : this.state.lineup,this.regenerating); }
  get roomX() { return this.room * ROUTE.spacing; }
  get roomName() { return this.dungeon.rooms[this.room]?.[0] || UNITS[this.dungeon.boss].title; }
  get used() { return totalCost(this.ongoing ? this.field : this.state.lineup); }

  signal() { this.events.changed?.(); }
  log(message, kind = "") { this.events.log?.(message,kind); }
  save() { this.events.save?.(); }
  sound(kind) { this.events.sound?.(kind); }

  make(kind, ally, x, y, options = {}) {
    const def = UNITS[kind];
    let health = options.boss ? def.bossHP : def.hp;
    let damage = def.damage * (options.boss ? 1.24 : 1);
    if (ally) {
      health *= value(this.state,isGeneral(kind) ? "general" : "armor");
      damage *= value(this.state,isGeneral(kind) ? "general" : "damage");
    }
    if (options.temporary) { health *= .68; damage *= .74; }
    return {id:++this.serial,kind,ally,x,y,hp:health,maxHP:health,damage,speed:def.speed,range:def.range,
      interval:def.interval,nextAttack:.22+this.serial%5*.09,attackAt:-10,hitAt:-10,facing:ally?1:-1,
      step:0,movedAt:-10,riseAt:-10,poison:0,poisonDps:0,guard:def.guard||1,leaderGuard:false,...options};
  }

  buyUpgrade(id) {
    if (!UPGRADES[id]) return false;
    const previous = value(this.state,id);
    if (!buy(this.state,id)) return false;

    if (this.ongoing && ["damage","armor","general"].includes(id)) {
      const multiplier = value(this.state,id)/previous;
      for (const unit of this.team) {
        if (unit.hp <= 0 || isGeneral(unit.kind) !== (id === "general")) continue;
        if (id !== "armor") unit.damage *= multiplier;
        if (id !== "damage") {
          unit.maxHP *= multiplier;
          unit.hp *= multiplier;
        }
      }
    }
    return true;
  }

  select(index) {
    if (this.ongoing || !unlocked(this.state,index) || !DUNGEONS[index]) return false;
    this.state.selected = index;
    this.reset();
    this.save();
    this.signal();
    return true;
  }

  start(room = 0) {
    if (this.ongoing || !countStack(this.state.lineup)) return false;
    this.reset();
    this.room = room;
    this.placeEncounters();
    const entrance = this.roomX+ROUTE.entrance;
    for (const [kind,count] of Object.entries(this.state.lineup)) {
      for (let i=0;i<count;i++) this.team.push(this.make(kind,true,entrance,ROUTE.lane));
    }
    this.team=this.formation();
    this.team.forEach((unit,index) => Object.assign(unit,this.marchSlot(entrance,index)));
    this.applyLeadership();
    this.log("Your legion entered " + this.dungeon.name + ".","violet");
    this.sound("enter");
    this.beginMarch(entrance,0);
    return true;
  }

  placeEncounters() {
    this.encounters=this.dungeon.rooms.map(([,group],room)=>group.map((kind,i)=>
      this.make(kind,false,room*ROUTE.spacing+660+(i%3)*54,226+(i%4)*43+Math.floor(i/4)*14)));
    this.encounters.push([this.make(this.dungeon.boss,false,this.dungeon.rooms.length*ROUTE.spacing+704,ROUTE.lane,
      {boss:true,nextSpecial:5,specialIndex:0,windup:0})]);
  }

  formation() {
    return this.team.filter(unit=>unit.hp>0&&!unit.temporary).sort((a,b)=>
      Number(b.guard<1||isGeneral(b.kind))-Number(a.guard<1||isGeneral(a.kind)) ||
      Number(a.range>55)-Number(b.range>55) || a.id-b.id);
  }

  marchSlot(front,index) {
    const column=Math.floor(index/5), rank=index%5;
    const offset=[0,-27,27,-54,54][rank];
    return {x:front-column*29-Math.abs(offset)*.19,y:ROUTE.lane+offset+column%2*4};
  }

  beginMarch(x, regroup) {
    this.phase = "marching";
    this.team = this.formation();
    this.march = {x,regroup,destination:this.roomX+ROUTE.engagement};
    this.enemies = [];
    this.boss = null;
    this.bossCorpse = null;
    this.selectedCorpse = null;
    this.focus = null;
    this.corpses = [];
    this.projectiles = [];
    this.signal();
  }

  tickMarch(dt) {
    const pace = ROUTE.pace*this.traversalRate;
    const march = this.march;
    if (march.regroup>0) march.regroup-=dt;
    else march.x=Math.min(march.destination,march.x+pace*dt);

    let settled=true;
    this.team.forEach((unit,index)=>{
      const slot=this.marchSlot(march.x,index);
      const gap=distance(unit,slot);
      if(gap>7) settled=false;
      if(gap<.5 || this.elapsed-unit.riseAt < ROUTE.riseTime) return;
      const speed=Math.min(Math.max(81,pace*.8),gap*6)+pace*.61;
      const stride=Math.min(gap,speed*dt);
      unit.facing=slot.x>=unit.x?1:-1;
      unit.x+=(slot.x-unit.x)*stride/gap;
      unit.y+=(slot.y-unit.y)*stride/gap;
      unit.step+=stride*.077;
      unit.movedAt=this.elapsed;
    });
    if(march.x>=march.destination && settled) this.engage();
  }

  engage() {
    this.phase = "fighting";
    this.march = null;
    this.roomElapsed = 0;
    this.team.forEach((unit,i) => {
      unit.nextAttack = this.elapsed + .32 + i%5*.11;
      unit.poison = 0;
      unit.poisonDps = 0;
    });
    this.enemies = this.encounters[this.room];
    this.boss = this.enemies.find(unit=>unit.boss) || null;
    this.intro = this.boss ? 2.7 : 0;
    if (this.boss) {
      this.log(UNITS[this.boss.kind].name + " awaits in the final chamber.","gold");
      this.sound("boss");
    } else if (this.room > 0) this.log("Entered " + this.roomName + ".");
    this.signal();
  }

  applyLeadership() {
    const knight = this.team.some(unit => unit.kind === "knight" && unit.hp > 0);
    for (const unit of this.team) {
      if (!["skeleton","armored"].includes(unit.kind) || unit.leaderGuard === knight) continue;
      const ratio = unit.hp/unit.maxHP;
      unit.leaderGuard = knight;
      unit.maxHP *= knight ? 1.25 : .8;
      unit.hp = unit.maxHP * ratio;
    }
  }

  chooseTarget(unit, opponents) {
    if (unit.ally && this.focus?.hp > 0) return this.focus;
    let nearest, score = Infinity;
    for (const candidate of opponents) {
      if (candidate.hp <= 0) continue;
      const threatensRanged = unit.ally && UNITS[unit.kind].guard && this.team.some(
        ally => ally.hp > 0 && ally.range > 55 && distance(candidate,ally) < 90);
      const rating = distance(unit,candidate) - (threatensRanged ? 32 : 0);
      if (rating < score) { nearest = candidate; score = rating; }
    }
    return nearest;
  }

  move(unit, target, dt) {
    const gap = distance(unit,target);
    if (gap < 1) return;
    const amount = Math.min(gap,unit.speed*dt);
    unit.x = clamp(unit.x+(target.x-unit.x)*amount/gap,this.roomX+55,this.roomX+856);
    unit.y = clamp(unit.y+(target.y-unit.y)*amount/gap,155,418);
    unit.step += amount*.16;
    unit.movedAt = this.elapsed;
  }

  separate(units,dt) {
    for (let i=0;i<units.length;i++) {
      const a = units[i];
      for (let j=i+1;j<units.length;j++) {
        const b = units[j];
        if ((a.kind === "egg" && b.kind === "egg") || a.hp <= 0 || b.hp <= 0) continue;
        const gap = distance(a,b);
        const desired = a.boss || b.boss ? 39 : 23;
        if (gap >= desired) continue;
        const push = (desired-gap)*dt*2.4;
        const dx = gap > .1 ? (a.x-b.x)/gap : a.id%2 ? 1 : -1;
        const dy = gap > .1 ? (a.y-b.y)/gap : .4;
        if (a.speed) { a.x = clamp(a.x+dx*push,this.roomX+55,this.roomX+856); a.y = clamp(a.y+dy*push,155,418); }
        if (b.speed) { b.x = clamp(b.x-dx*push,this.roomX+55,this.roomX+856); b.y = clamp(b.y-dy*push,155,418); }
      }
    }
  }

  attack(unit,target) {
    unit.nextAttack = this.elapsed + unit.interval;
    unit.attackAt = this.elapsed;
    let amount = unit.damage;
    const poison = UNITS[unit.kind].poison;
    if (unit.ally) {
      if (["skeleton","rat","goblin"].includes(unit.kind) && this.team.some(a => a.kind === "king" && a.hp > 0)) amount *= 1.18;
      if (["rat","spider"].includes(unit.kind) && this.team.some(a => a.kind === "queen" && a.hp > 0)) amount *= 1.25;
    } else if (unit.empowered > this.elapsed) amount *= 1.45;
    if (unit.range > 55) {
      this.projectiles.push({x:unit.x,y:unit.y-17,target,amount,ally:unit.ally,poison});
      this.sound("arrow");
    } else {
      const angle = Math.atan2(target.y-unit.y,target.x-unit.x);
      const heavy = Boolean(unit.boss || isGeneral(unit.kind));
      const bite = ["rat","spider","queen"].includes(unit.kind);
      const color = poison ? "#c3e786" : unit.ally ? "#d4a5ff" : "#ffc697";
      this.effect(bite?"bite":"slash",target.x,target.y-(bite?10:18),color,.30,heavy?44:bite?20:32,"",{angle,heavy});
      this.hit(target,amount,poison,{angle,heavy});
      if (heavy) this.sound("heavy-hit");
    }
  }

  hit(target, amount, poison = 0, {angle = 0, heavy = false} = {}) {
    if (target.hp <= 0) return;
    const resistance = target.ally && this.elapsed < this.reinforced ? .57 : 1;
    const damage = Math.max(1,amount*target.guard*resistance);
    target.hp = Math.max(0,target.hp-damage);
    target.hitAt = this.elapsed;
    target.hitAngle = angle;
    target.heavyHit = heavy;
    target.poison = Math.max(target.poison,poison ? 3.8 : 0);
    target.poisonDps = Math.max(target.poisonDps,poison);
    const color = poison ? "#c5e78a" : target.ally ? "#ffae94" : "#e1baff";
    const impactY = target.y - (["rat","spider","queen"].includes(target.kind) ? 11 : 24);
    this.effect("sparks",target.x,impactY,color,.30,heavy?35:23,"",{angle,heavy});
    this.effect("damage",target.x+(target.id%3-1)*10,impactY-13,target.ally ? "#ffb2a2" : "#f3e5ff",.75,0,Math.round(damage),{heavy});
    if (!heavy) this.sound(target.guard < 1 ? "armor" : "hit");
    if (target.hp <= 0) this.destroy(target);
  }

  effect(type,x,y,color,life,radius=0,text="",style={}) {
    this.effects.push({type,x,y,color,life,total:life,radius,text,seed:this.serial,...style});
  }

  destroy(unit) {
    unit.hp = 0;
    if (unit.ally) {
      if (!unit.temporary) {
        this.regenerating[unit.kind] = (this.regenerating[unit.kind] || 0)+1;
        this.log(UNITS[unit.kind].name + " is regenerating.","warning");
      }
      this.effect("burst",unit.x,unit.y,"#9874bb",.65,25);
      this.applyLeadership();
    } else {
      const essence = unit.minion || unit.kind === "egg" ? UNITS[unit.kind].essence*.24 : UNITS[unit.kind].essence;
      this.state.essence += Math.floor(essence);
      if (!unit.minion && unit.kind !== "egg" && (!unit.boss || !this.state.owned[unit.kind])) {
        const corpse = {id:unit.id,kind:unit.kind,x:unit.x,y:unit.y,boss:unit.boss,claimed:false};
        this.corpses.push(corpse);
        if (unit.boss) this.bossCorpse = corpse;
      }
      this.effect("burst",unit.x,unit.y,unit.boss ? "#ecb973" : "#8e654f",.7,unit.boss ? 46 : 23);
      this.save();
    }
    this.signal();
  }

  spawnMinions(kind,count,source) {
    for(let i=0;i<count;i++) {
      const angle = (i/count)*Math.PI*2 + .3;
      const x = clamp(source.x+Math.cos(angle)*76,this.roomX+62,this.roomX+850);
      const y = clamp(source.y+Math.sin(angle)*61,160,412);
      this.enemies.push(this.make(kind,false,x,y,{minion:true,hatch:this.elapsed+5,nextAttack:this.elapsed+1.2}));
      this.effect("burst",x,y,"#cb9870",.8,22);
    }
  }

  bossMove(boss) {
    const name = boss.kind;
    const index = boss.specialIndex;
    if (boss.windup && this.elapsed >= boss.windup) {
      const victims = this.team.filter(a => a.hp > 0 && distance(a,boss) <= boss.blast);
      victims.forEach(a => this.hit(a,boss.blastDamage,name === "queen" ? 8 : 0,{
        angle:Math.atan2(a.y-boss.y,a.x-boss.x),heavy:true
      }));
      this.effect("shock",boss.x,boss.y,name === "knight" ? "#f16b81" : name === "queen" ? "#afdd78" : "#edbc73",.65,boss.blast);
      this.sound("impact");
      boss.windup = 0;
    }
    if (this.roomElapsed < boss.nextSpecial || boss.windup) return;
    boss.specialIndex += 1;
    boss.nextSpecial = this.roomElapsed + (name === "queen" ? 6.5 : 6.4);
    if (name === "king" && index%3 !== 2) {
      this.spawnMinions("goblin",index%3 === 0 ? 2 : 1,boss);
      for (const enemy of this.enemies) if (enemy.kind === "goblin") enemy.empowered = this.elapsed+7;
      this.effect("ring",boss.x,boss.y,"#deb066",.85,112);
      this.log("The Goblin King rallies his guard.","gold");
    } else if (name === "queen" && index%3 !== 2) {
      this.spawnMinions(index%3 === 0 ? "egg" : "spider",index%3 === 0 ? 3 : 4,boss);
      this.log(index%3 === 0 ? "Brood eggs are about to hatch." : "A wave of venom spiders spills into the chamber.","gold");
    } else {
      boss.blast = name === "king" ? 76 : name === "queen" ? 124 : index%2 ? 132 : 74;
      boss.blastDamage = name === "king" ? 32 : name === "queen" ? 36 : index%2 ? 62 : 36;
      boss.windup = this.elapsed+(name === "knight" && index%2 ? 2.2 : 1.18);
      const attack = name === "king" ? "Royal Smash" : name === "queen" ? "Venom Burst" : index%2 ? "Oathbreaker’s Judgment" : "Crimson Sweep";
      this.log(UNITS[name].name + " prepares " + attack + ".","warning");
      this.sound("warning");
    }
  }

  tickUnits(dt) {
    this.applyLeadership();
    const team = this.team.filter(unit => unit.hp > 0);
    const enemy = this.enemies.filter(unit => unit.hp > 0);
    for (const unit of [...team,...enemy]) {
      if (unit.hp <= 0 || this.elapsed-unit.riseAt < ROUTE.riseTime) continue;
      if (unit.poison > 0) {
        unit.poison -= dt;
        unit.hp = Math.max(0,unit.hp-unit.poisonDps*dt*(unit.ally && this.elapsed < this.reinforced ? .57 : 1));
        if (unit.hp <= 0) { this.destroy(unit); continue; }
        if (unit.poison <= 0) unit.poisonDps = 0;
      }
      if (unit.temporary && this.elapsed >= unit.expires) { this.destroy(unit); continue; }
      if (unit.kind === "egg") {
        if (this.elapsed >= unit.hatch) {
          unit.hp = 0;
          this.spawnMinions("spider",2,unit);
        }
        continue;
      }
      if (unit.boss) {
        this.bossMove(unit);
        if (unit.windup) continue;
      }
      const target = this.chooseTarget(unit,unit.ally ? enemy : team);
      if (!target) continue;
      unit.facing = target.x >= unit.x ? 1 : -1;
      if (distance(unit,target) > unit.range) this.move(unit,target,dt);
      else if (this.elapsed >= unit.nextAttack) this.attack(unit,target);
    }
    this.separate(team,dt);
    this.separate(enemy,dt);
    this.projectiles = this.projectiles.filter(shot => {
      if (shot.target.hp <= 0) return false;
      const target = {x:shot.target.x,y:shot.target.y-13};
      const gap = distance(shot,target);
      if (gap <= dt*385+3) {
        this.hit(shot.target,shot.amount,shot.poison,{angle:Math.atan2(target.y-shot.y,target.x-shot.x)});
        return false;
      }
      shot.x += (target.x-shot.x)/gap*dt*385;
      shot.y += (target.y-shot.y)/gap*dt*385;
      return true;
    });
  }

  tick(dt) {
    if (this.phase === "cinematic") {
      this.cinematic.time += dt;
      if (this.cinematic.time >= RULES.cinematicTime) this.finishCinematic();
      return;
    }
    if (this.phase === "fallen") {
      this.effects = this.effects.filter(item => (item.life -= dt) > 0);
      return;
    }
    if (this.paused || !["marching","fighting","between"].includes(this.phase)) return;
    const time = dt*this.state.speed;
    this.elapsed += time;
    this.mana = Math.min(value(this.state,"mana"),this.mana+value(this.state,"regen")*time);
    this.effects = this.effects.filter(item => (item.life -= time) > 0);
    if (this.phase === "marching") { this.tickMarch(time); return; }
    if (this.phase === "between") {
      this.wait -= time;
      if (this.wait <= 0) this.marchToNextRoom();
      return;
    }
    if (this.intro > 0) { this.intro -= time; return; }
    this.roomElapsed += time;
    this.tickUnits(time);
    if (this.boss && this.boss.hp <= 0) {
      this.enemies = [];
      this.projectiles = [];
      if (this.bossCorpse) {
        this.phase = "fallen";
        this.selectedCorpse = this.bossCorpse.id;
        this.log("The general has fallen. Claim its allegiance.","gold");
        this.sound("fall");
        this.signal();
      } else this.victory();
      return;
    }
    if (!this.team.some(unit => unit.hp > 0)) {
      const cap = value(this.state,"dominion");
      const canRally = Object.keys(this.reserves).some(kind => UNITS[kind].cost <= cap)
        || this.corpses.some(corpse => !corpse.claimed && UNITS[corpse.kind].cost <= cap);
      if (!canRally || (this.rallyUntil && this.elapsed >= this.rallyUntil)) {
        this.end("defeat");
        return;
      }
      if (!this.rallyUntil) {
        this.rallyUntil = this.elapsed + RULES.rallyWindow;
        this.log("The field is empty. Raise a corpse or call the reserves.","warning");
        this.signal();
      }
    } else this.rallyUntil = 0;
    if (!this.enemies.some(unit => unit.hp > 0)) {
      this.phase = "between";
      this.wait = RULES.roomWait;
      this.log("Room cleared. Claim the fallen before advancing.","violet");
      this.signal();
    } else if (this.dungeon.boss === "queen" && !this.boss && this.room >= 3 && this.roomElapsed >= 9 && this.roomElapsed-time < 9) {
      this.spawnMinions("spider",this.room-1,{x:this.roomX+751,y:302});
      this.log("Nest reinforcements are closing in.","warning");
    }
  }

  marchToNextRoom() {
    const survivors=this.formation();
    if (!survivors.length) { this.end("defeat"); return; }
    const healing = this.state.cleared.includes(this.state.selected) ? RULES.repeatHeal : RULES.betweenHeal;
    for (const unit of survivors) unit.hp = Math.min(unit.maxHP,unit.hp+unit.maxHP*healing);
    this.mana = Math.min(value(this.state,"mana"),this.mana+5);
    const front=clamp(Math.max(...survivors.map(unit=>unit.x)),this.roomX+396,this.roomX+755);
    this.room++;
    this.beginMarch(front,ROUTE.regroup);
  }

  pick(x,y,focusOnly = false) {
    if (!this.ongoing || this.phase === "cinematic") return false;
    const point = {x,y};
    const target = this.enemies.filter(unit => unit.hp > 0 && distance({x:unit.x,y:unit.y-14},point) <= (unit.boss ? 60 : 33))
      .sort((a,b) => distance(a,point)-distance(b,point))[0];
    if (target) {
      this.focus = this.focus === target ? null : target;
      if (this.focus) this.log("Focus set to " + UNITS[target.kind].name + ".");
      this.signal();
      return true;
    }
    if (!focusOnly) {
      const corpse = this.corpses.filter(item => !item.claimed && distance(item,point) <= (item.boss ? 60 : 31))
        .sort((a,b) => distance(a,point)-distance(b,point))[0];
      if (corpse) { this.pickCorpse(corpse.id); return true; }
    }
    return false;
  }

  pickCorpse(id) {
    if (!this.corpses.some(corpse => corpse.id === id && !corpse.claimed)) return;
    this.selectedCorpse = this.selectedCorpse === id ? null : id;
    this.signal();
  }

  arise(all = false) {
    if (this.phase === "fallen") return this.claimBoss();
    if (!["fighting","between"].includes(this.phase)) return 0;
    const unclaimed = this.corpses.filter(corpse => !corpse.claimed && !corpse.boss);
    const first = unclaimed.find(corpse => corpse.id === this.selectedCorpse) || unclaimed[0];
    const targets = all ? unclaimed : first ? [first] : [];
    let raised = 0;
    for (const corpse of targets) {
      const cost = UNITS[corpse.kind].mana;
      if (this.mana < cost || !acquire(this.state,corpse.kind)) continue;
      corpse.claimed = true;
      this.mana -= cost;
      if (this.used+UNITS[corpse.kind].cost <= value(this.state,"dominion")) {
        deploy(this.state,corpse.kind,1);
        this.summon(corpse.kind,corpse.x,corpse.y).riseAt=this.elapsed;
      } else this.effect("burst",corpse.x,corpse.y,"#bf87fc",1.2,45);
      raised++;
    }
    if (raised) {
      if (this.corpses.find(corpse => corpse.id === this.selectedCorpse)?.claimed) this.selectedCorpse = null;
      this.log(raised === 1 ? "A new soldier answers your call." : raised + " soldiers answer your call.","violet");
      this.sound("arise");
      this.save();
      this.signal();
    } else if (targets.length) this.log("You need more mana to raise the fallen.","warning");
    return raised;
  }

  summon(kind,x,y,temporary=0) {
    const unit = this.make(kind,true,x,y,{temporary:Boolean(temporary),expires:this.elapsed+temporary,nextAttack:this.elapsed+.22});
    this.team.push(unit);
    this.effect("burst",x,y,"#be83ff",1.15,45);
    this.applyLeadership();
    return unit;
  }

  reinforce() {
    if (!["fighting","between"].includes(this.phase) || this.mana < RULES.reinforceMana || this.elapsed < this.reinforceReady) return false;
    this.mana -= RULES.reinforceMana;
    this.reinforced = this.elapsed + RULES.reinforceDuration;
    this.reinforceReady = this.elapsed + RULES.reinforceCooldown;
    for (const unit of this.team) if (unit.hp > 0) this.effect("ring",unit.x,unit.y,"#a297f4",.55,29);
    this.log("Grave Ward shields your legion for 8 seconds.","violet");
    this.sound("ward");
    this.signal();
    return true;
  }

  callReserves() {
    if (!["fighting","between"].includes(this.phase)) return 0;
    let summoned = 0;
    const capacity = value(this.state,"dominion");
    for (const [kind,count] of Object.entries(this.reserves).sort(([a],[b]) => UNITS[b].cost-UNITS[a].cost)) {
      for(let i=0;i<count && this.mana >= RULES.reserveMana && this.used+UNITS[kind].cost <= capacity;i++) {
        if (reserve(this.state,kind,this.field,this.regenerating) <= 0) break;
        this.mana -= RULES.reserveMana;
        this.summon(kind,this.roomX+250+summoned*11,ROUTE.lane+((summoned%3)-1)*30);
        summoned++;
      }
    }
    if (summoned) {
      this.sound("arise");
      this.log(summoned + (summoned === 1 ? " reserve soldier deployed." : " reserve soldiers deployed."),"violet");
      this.signal();
    }
    return summoned;
  }

  generalCommand(kind) {
    const source = this.team.find(unit => unit.kind === kind && unit.hp > 0 && !unit.temporary);
    if (this.phase !== "fighting" || this.intro > 0 || !source || (this.cooldowns[kind] || 0) > this.elapsed || !GENERALS.includes(kind)) return false;
    this.cooldowns[kind] = this.elapsed + UNITS[kind].cooldown;
    const level = value(this.state,"general");
    if (kind === "knight") {
      const target = this.chooseTarget(source,this.enemies);
      if (target) source.facing = target.x >= source.x ? 1 : -1;
      for (const enemy of this.enemies) if (enemy.hp > 0 && (enemy.x-source.x)*source.facing > -24 && distance(source,enemy) < 235) {
        this.hit(enemy,141*level,0,{angle:Math.atan2(enemy.y-source.y,enemy.x-source.x),heavy:true});
      }
      this.effect("slash",source.x+source.facing*83,source.y-21,"#f69cd9",.48,103,"",{angle:source.facing===1?0:Math.PI,heavy:true});
      this.effect("shock",source.x,source.y,"#d891ed",.52,120);
    } else {
      const spider = kind === "queen";
      const size = spider ? 5 : 3;
      for (let i=0;i<size;i++) this.summon(spider ? "spider" : "goblin",source.x+(i%2?48:-34),source.y+(i-(size-1)/2)*26,spider ? 14 : 12);
      this.effect("shock",source.x,source.y,spider?"#9bddb3":"#c990ff",.73,117);
    }
    this.sound("arise");
    this.sound("impact");
    this.log(UNITS[kind].signature + " unleashed.","gold");
    this.signal();
    return true;
  }

  claimBoss() {
    const corpse = this.bossCorpse;
    if (this.phase !== "fallen" || !corpse || corpse.claimed || !acquire(this.state,corpse.kind)) return false;
    corpse.claimed = true;
    this.awardClear();
    this.save();
    this.phase = "cinematic";
    this.cinematic = {kind:corpse.kind,time:0,x:corpse.x,y:corpse.y,preview:false};
    this.sound("cinematic");
    this.signal();
    return true;
  }

  previewCinematic(kind) {
    if (this.ongoing || !isGeneral(kind)) return false;
    this.comeBackTo = this.phase;
    this.phase = "cinematic";
    this.cinematic = {kind,time:0,x:560,y:300,preview:true};
    this.sound("cinematic");
    this.signal();
    return true;
  }

  finishCinematic() {
    if (this.phase !== "cinematic") return false;
    if (this.cinematic.preview) {
      this.phase = this.comeBackTo;
      this.cinematic = null;
      this.signal();
      return true;
    }
    this.log(UNITS[this.cinematic.kind].name + " has sworn allegiance.","gold");
    this.cinematic = null;
    this.victory();
    return true;
  }

  awardClear() {
    if (this.clearAwarded) return;
    const id = this.state.selected;
    this.clearAwarded = true;
    if (!this.state.cleared.includes(id)) this.state.cleared.push(id);
    this.state.essence += this.dungeon.clear;
  }

  victory() {
    this.awardClear();
    this.end("victory");
  }

  retreat() {
    if (!["marching","fighting","between"].includes(this.phase)) return false;
    this.end("retreat");
    return true;
  }

  end(outcome) {
    this.outcome = outcome;
    this.phase = "ended";
    this.regenerating = {};
    this.corpses = [];
    this.effects = [];
    this.projectiles = [];
    this.log(outcome === "victory" ? this.dungeon.name + " conquered. +" + this.dungeon.clear + " Essence."
      : outcome === "defeat" ? "The legion was overwhelmed. Fallen soldiers recovered at camp." : "The legion has returned to camp.",
      outcome === "victory" ? "gold" : "warning");
    this.sound(outcome === "victory" ? "victory" : "fall");
    this.save();
    this.signal();
  }
}

  backdrop(index) {
    if(!this.art.complete||!this.art.naturalWidth) return null;
    if(!this.cache.has(index)) {
      const canvas=document.createElement("canvas");
      canvas.width=ROUTE.chamberWidth;
      canvas.height=RULES.height;
      const context=canvas.getContext("2d");
      context.filter=PALETTES[index].filter;
      context.drawImage(this.art,0,0,canvas.width,canvas.height);
      this.cache.set(index,canvas);
    }
    return this.cache.get(index);
  }

  render(g,offset,dungeon,count,time) {
    const palette=PALETTES[dungeon];
    const {spacing,chamberWidth}=ROUTE;
    const first=Math.max(0,Math.floor((offset-48)/spacing));
    const last=Math.min(count-1,Math.floor((offset+RULES.width+50)/spacing));
    const art=this.backdrop(dungeon);
    paint(g,"#0f0b16",offset-8,0,RULES.width+16,RULES.height);
    for(let room=first;room<=last;room++) {
      const x=room*spacing;
      paint(g,palette.floor,x,0,chamberWidth,RULES.height);
      if(art) g.drawImage(art,x,0);
      paint(g,MOODS[(room+dungeon*2)%MOODS.length],x,0,chamberWidth,RULES.height);
      this.details(g,x,room,count,dungeon,palette,time);
    }
    this.corridor(g,-152,28,palette,time);
    for(let room=first;room<=last && room<count-1;room++) {
      const edge=room*spacing+chamberWidth;
      this.corridor(g,edge-26,(room+1)*spacing+26,palette,time);
    }
  }

  corridor(g,left,right,palette,time) {
    const top=ROUTE.corridorTop,bottom=ROUTE.corridorBottom,w=right-left;
    paint(g,"#100c18",left,top-22,w,bottom-top+47);
    paint(g,palette.floor,left,top,w,bottom-top);
    for(let row=0;row<5;row++) {
      const y=top+row*31;
      paint(g,palette.line,left,y,w,2);
      for(let x=left+((row%2)*19);x<right;x+=38) {
        paint(g,palette.line,x,y,2,Math.min(31,bottom-y));
        paint(g,"#c4acc216",x+3,y+3,Math.min(32,right-x-2),1);
        if((row+Math.floor(x/38))%3===0) paint(g,"#0f0d183b",x+10,y+18,10,2);
      }
    }
    for(const y of [top-19,bottom]) {
      paint(g,palette.edge,left,y,w,15);
      paint(g,"#211928",left,y+4,w,10);
      paint(g,"#876b893b",left,y,w,2);
      for(let x=left+9;x<right;x+=24) paint(g,"#100c18",x,y+3,2,11);
    }
    for(const x of [left+4,right-17]) {
      for(const y of [top-23,bottom-8]) this.pillar(g,x,y,palette);
    }
    this.torch(g,(left+right)/2,top+5,palette,time);
  }

  pillar(g,x,y,palette) {
    paint(g,"#100c18",x-4,y-4,24,30);
    paint(g,palette.edge,x,y,15,24);
    paint(g,"#9a829755",x+2,y+2,3,18);
    paint(g,"#17121f",x+7,y+5,7,16);
    paint(g,palette.edge,x-3,y+21,21,5);
  }

  torch(g,x,y,palette,time) {
    const sway=Math.sin(time*9+x*.031);
    const bloom=g.createRadialGradient(x,y-9,2,x,y-9,48+sway*3);
    bloom.addColorStop(0,palette.flame+"76");bloom.addColorStop(1,palette.flame+"00");
    paint(g,bloom,x-55,y-61,110,110);
    paint(g,"#17101f",x-6,y+1,12,8);
    paint(g,palette.edge,x-5,y+1,10,3);
    paint(g,palette.flame,x-3,y-7,7,8);
    paint(g,palette.flame,x+Math.round(sway*2),y-14,3,9);
    paint(g,palette.spark,x-1,y-5,3,6);
    paint(g,palette.spark,x+5*Math.sin(time*4+x),y-18-(time*14+x)%17,2,2);
  }

  details(g,x,room,count,dungeon,palette,time) {
    const boss=room===count-1;
    this.torch(g,x+147,135,palette,time);
    this.torch(g,x+675,135,palette,time);
    if(boss) {
      const cx=x+592;
      g.save();g.strokeStyle=palette.flame+"70";g.lineWidth=2;
      for(const radius of [42,72,108]) {
        g.beginPath();g.ellipse(cx,ROUTE.lane,radius,radius*.60,0,0,Math.PI*2);g.stroke();
      }
      g.setLineDash([5,10]);
      g.beginPath();g.ellipse(cx,ROUTE.lane,115,69,0,0,Math.PI*2);g.stroke();
      g.restore();
      this.torch(g,x+481,180,palette,time);
      this.torch(g,x+481,401,palette,time);
    } else if(room%3===1) {
      for(const [dx,y] of [[263,155],[560,155],[263,397],[560,397]]) this.pillar(g,x+dx,y,palette);
    } else if(room%3===2) {
      const cx=x+373;
      g.save();g.strokeStyle=palette.flame+"53";g.lineWidth=2;
      g.strokeRect(cx-55,ROUTE.lane-39,110,78);
      g.translate(cx,ROUTE.lane);g.rotate(Math.PI/4);g.strokeRect(-29,-29,58,58);
      g.restore();
    }
    if(dungeon===2) {
      g.save();g.strokeStyle="#c1dabe66";g.lineWidth=1;
      const origin=x+(room%2?733:55);
      const direction=room%2?-1:1;
      const rays=[[0,85],[32,67],[72,49],[102,27],[125,0]];
      for(const [a,b] of rays) {
        g.beginPath();g.moveTo(origin,132);g.lineTo(origin+direction*a,132+b);g.stroke();
      }
      for(const factor of [.30,.57,.85]) {
        g.beginPath();
        rays.forEach(([a,b],i)=>g[i?"lineTo":"moveTo"](origin+direction*a*factor,132+b*factor));
        g.stroke();
      }
      g.restore();
    } else if(dungeon===1) {
      for(const [dx,y] of [[340,159],[391,153],[442,156],[450,410]]) {
        paint(g,"#15111a",x+dx,y,15,29);
        paint(g,"#594755",x+dx+2,y+2,11,24);
        paint(g,"#a0878059",x+dx+6,y+8,2,12);
        paint(g,"#a0878059",x+dx+3,y+11,8,2);
      }
    }
  }
}


const EYE = "#efc6ff";
const palette = (kind,ally) => ({
  edge: "#110e1d", low: ally ? "#3e2b63" : "#303027",
  mid: ally ? "#685095" : UNITS[kind].color, hi: ally ? "#b299dc" : "#d2baa2",
  eye: ally ? EYE : "#ffb46e", metal: ally ? "#d8bfee" : "#b5a7a2"
});

function polygon(g,color,points) {
  g.fillStyle=color;
  g.beginPath();
  points.forEach(([x,y],i) => i ? g.lineTo(x,y) : g.moveTo(x,y));
  g.closePath();
  g.fill();
}

function drawSprite(g,kind,x,y,scale=2,ally=false,facing=1,pose={}) {
  const p = palette(kind,ally);
  const rect = (color,x,y,w,h) => {g.fillStyle=color;g.fillRect(x,y,w,h);};
  const poly = (color,points) => polygon(g,color,points);
  const stride = Math.round(pose.stride || 0);
  const attack = pose.attack || 0;
  g.save();
  g.translate(Math.round(x),Math.round(y));
  g.scale(scale*facing,scale);
  g.globalAlpha *= pose.alpha ?? 1;
  if (pose.rotation) g.rotate(pose.rotation);
  if (kind === "rat") {
    poly(p.edge,[[-11,-1],[-16,0],[-22,-2],[-21,-4],[-15,-3],[-11,-6],[-5,-11],[4,-12],[9,-9],[9,-12],[13,-12],[14,-8],[19,-6],[17,-2],[10,1],[-6,2]]);
    poly(p.mid,[[-12,-4],[-6,-9],[5,-10],[11,-7],[16,-6],[16,-4],[9,-2],[-7,-2]]);
    rect(p.low,-10,-5,13,4); rect(p.hi,-5,-9,7,2); rect(p.hi,10,-11,3,4); rect(p.eye,12,-7,2,1);
    rect(p.mid,-8+stride,-2,4,3); rect(p.mid,5-stride,-2,5,3); rect(p.hi,16,-5,2,1);
  } else if (kind === "spider" || kind === "queen") {
    const queen = kind==="queen";
    for(let i=0;i<4;i++) {
      const dx=i*4, step=(i%2?stride:-stride), extent=queen?3:0;
      poly(p.edge,[[-10+dx,-10],[-17+dx,-13-i%2],[-23+dx,-5+step],[-22+dx,-1+step],[-16+dx,-7-i%2],[-7+dx,-5]]);
      poly(p.mid,[[-11+dx,-9],[-17+dx,-11-i%2],[-22+dx,-4+step],[-17+dx,-8-i%2],[-9+dx,-6]]);
      poly(p.edge,[[2+dx,-9],[7+dx,-8],[14+dx+extent,-1+step],[13+dx+extent,3+step],[9+dx+extent,2+step],[6+dx,-4],[1+dx,-4]]);
      poly(p.hi,[[3+dx,-7],[7+dx,-6],[13+dx+extent,1+step],[11+dx+extent,1+step],[6+dx,-4]]);
    }
    poly(p.edge,[[-17,-10],[-15,-17],[-10,-21],[-2,-22],[4,-18],[8,-13],[14,-12],[19,-9],[18,-4],[13,-1],[5,-3],[-3,-6],[-12,-5]]);
    poly(p.mid,[[-15,-11],[-13,-16],[-8,-19],[-2,-19],[3,-15],[6,-10],[1,-7],[-11,-7]]);
    poly(p.hi,[[-12,-15],[-7,-19],[-1,-18],[1,-15],[-6,-14],[-10,-11]]);
    rect(p.low,-8,-10,9,3); rect(p.mid,7,-10,9,6); rect(p.eye,11,-9,5,2); rect(p.eye,12,-5,3,1);
    if(queen) {
      poly(ally?"#e0a3ff":"#d0aa67",[[7,-13],[6,-22],[10,-19],[12,-24],[14,-19],[18,-22],[17,-12]]);
      rect(p.eye,11,-17,3,4);
    }
  } else if (kind === "egg") {
    poly(p.edge,[[-11,0],[-15,-5],[-14,-15],[-9,-23],[-3,-26],[5,-24],[11,-18],[14,-9],[12,-1],[5,3],[-6,3]]);
    poly(p.mid,[[-10,-3],[-12,-7],[-10,-16],[-5,-23],[2,-22],[8,-17],[11,-8],[8,-2],[1,1]]);
    poly(p.hi,[[-9,-11],[-7,-18],[-3,-21],[0,-19],[-4,-15],[-4,-10]]);
    poly(p.low,[[5,-19],[3,-12],[6,-10],[2,-6],[5,-4],[2,1],[8,-2],[10,-8]]);
    rect(p.eye,2,-10,3,2);
  } else {
    const bones = ["skeleton","armored","knight"].includes(kind);
    const heavy = kind === "armored" || kind === "knight";
    const king = kind === "king";
    const archer = kind === "archer";
    const head = bones ? (ally ? "#cbbbe5" : "#d0c3a7") : (ally ? "#9c7bb8" : p.mid);
    const cloth = ally ? "#65508d" : heavy || king ? "#822f43" : "#655044";
