function portraits() {
  const canvas = document.createElement("canvas");
  canvas.width=128; canvas.height=104;
  const g=canvas.getContext("2d");
  return Object.fromEntries(Object.keys(UNITS).map(kind => {
    g.clearRect(0,0,128,104);
    drawSprite(g,kind,61,93,isGeneral(kind)?1.73:kind==="rat"?2.9:2.1,true);
    return [kind,canvas.toDataURL()];
  }));
}

function flare(g,x,y,color,alpha,radius) {
  g.save();
  g.globalAlpha=alpha;
  const gradient=g.createRadialGradient(x,y,0,x,y,radius);
  gradient.addColorStop(0,color);
  gradient.addColorStop(1,color+"00");
  g.fillStyle=gradient;
  g.fillRect(x-radius,y-radius,radius*2,radius*2);
  g.restore();
}

function ellipse(g,x,y,rx,ry,color,fill = false) {
  g.beginPath();g.ellipse(x,y,rx,ry,0,0,Math.PI*2);
  if(fill) {g.fillStyle=color;g.fill();} else {g.strokeStyle=color;g.stroke();}
}

const spriteScale = unit => unit.boss ? 2.65 : isGeneral(unit.kind) ? 1.97 : unit.kind === "rat" ? 1.35 : 1.55;
const timeNow = () => performance.now()/1000;

class BattlefieldView {
  constructor(canvas,battle) {
    this.canvas=canvas;
    this.battle=battle;
    this.g=canvas.getContext("2d");
    this.g.imageSmoothingEnabled=false;
    this.motion=window.matchMedia("(prefers-reduced-motion: reduce)");
    this.dungeonView=new DungeonView();
    this.camera=-65;
    this.ambience=Array.from({length:45},(_,i)=>[(i*219.4)%960,(i*101.9)%480,1+i%3,(i%5+1)/10]);
  }

  cameraGoal() {
    const b=this.battle;
    if(b.phase==="ready" || b.cinematic?.preview) return -65;
    const last=(b.dungeon.rooms.length)*ROUTE.spacing-65;
    let goal=b.roomX-65;
    if(b.phase==="marching") goal=b.march.x-346;
    else if(b.bossCorpse) goal=Math.max(goal-40,Math.min(goal+60,b.bossCorpse.x-504));
    else if(b.phase==="fighting" && !b.intro) {
      const troops=b.team.filter(unit=>unit.hp>0);
      if(troops.length) {
        const average=troops.reduce((sum,unit)=>sum+unit.x,0)/troops.length;
        goal+=Math.max(-31,Math.min(98,(average-b.roomX-465)*.30));
      }
    }
    return Math.max(-122,Math.min(last,goal));
  }

  worldX(screenX) { return screenX+this.camera; }

  render(dt) {
    const b=this.battle,g=this.g,w=RULES.width,h=RULES.height;
    const time=timeNow();
    const goal=this.cameraGoal();
    if(b.phase==="ready" || Math.abs(goal-this.camera)>w*1.25) this.camera=goal;
    else if(!b.paused) {
      const step=(goal-this.camera)*(1-Math.exp(-dt*6.2));
      const limit=890*dt;
      this.camera+=Math.max(-limit,Math.min(limit,step));
    }
    const offset=this.camera;
    const shake=this.motion.matches?0:b.effects.reduce((peak,e)=>
      e.type==="shock"?Math.max(peak,5*(e.life/e.total)**5):peak,0);
    g.clearRect(0,0,w,h);
    g.save();
    g.translate(-offset+Math.sin(b.elapsed*78)*shake,Math.cos(b.elapsed*91)*shake*.55);
    this.dungeonView.render(g,offset,b.state.selected,b.dungeon.rooms.length+1,this.motion.matches?0:time);
    const vignette=g.createRadialGradient(offset+480,257,104,offset+480,240,568);
    vignette.addColorStop(0,"#16122200");vignette.addColorStop(1,"#0d0a17a2");
    g.fillStyle=vignette;g.fillRect(offset-8,0,w+16,h);
    if(!this.motion.matches) for(const [x,y,size,alpha] of this.ambience) {
      const tx=offset+(x+time*(size+1))%w;
      const ty=(y-time*(size+2)+h*1000)%h;
      g.globalAlpha=alpha*(.45+.5*Math.sin(time*1.2+x));
      g.fillStyle=b.state.selected===2?"#9dc8a1":"#d5acf7";g.fillRect(tx,ty,size===3?2:1,size===3?2:1);
    }
    g.globalAlpha=1;
    if(b.phase === "cinematic") { g.restore(); this.cinematic(); return; }
    if(b.phase === "ready") { this.staging(); g.restore(); return; }
    for(const corpse of b.corpses) if(!corpse.claimed) this.corpse(corpse,corpse.id===b.selectedCorpse);
    if(b.boss?.windup) {
      const boss=b.boss;
      const pulse=.25+Math.abs(Math.sin(time*10))*.38;
      g.save();g.globalAlpha=pulse;g.lineWidth=2;g.setLineDash([7,7]);
      ellipse(g,boss.x,boss.y,boss.blast,boss.blast,"#ff736c");
      ellipse(g,boss.x,boss.y,boss.blast,boss.blast,"#a02b503b",true);
      g.restore();
    }
    const waiting=b.encounters.flatMap((units,index)=>
      index>b.room || (index===b.room && b.phase==="marching") ? units : []);
    const units=[...b.team,...b.enemies,...waiting].filter(unit=>unit.hp>0&&unit.x>offset-90&&unit.x<offset+w+90)
      .sort((a,c)=>a.y-c.y);
    for(const unit of units) this.actor(unit,!waiting.includes(unit));
    for(const shot of b.projectiles) {
      const angle=Math.atan2(shot.target.y-13-shot.y,shot.target.x-shot.x);
      const length=this.motion.matches?13:27;
      const tailX=shot.x-Math.cos(angle)*length,tailY=shot.y-Math.sin(angle)*length;
      const trail=g.createLinearGradient(tailX,tailY,shot.x,shot.y);
      trail.addColorStop(0,shot.ally?"#a861e100":"#ee985900");
      trail.addColorStop(.72,shot.ally?"#b27aef":"#e8a365");
      trail.addColorStop(1,"#fff0d8");
      g.strokeStyle=trail;g.lineWidth=3;
      g.beginPath();g.moveTo(tailX,tailY);g.lineTo(shot.x,shot.y);g.stroke();
      g.fillStyle="#fff5dc";g.fillRect(shot.x-1,shot.y-1,3,3);
    }
    for(const e of b.effects) this.effect(e);
    g.restore();
  }

  staging() {
    const b=this.battle,g=this.g,d=b.dungeon;
    const slots=Object.entries(b.state.lineup).flatMap(([kind,count])=>Array(count).fill(kind));
    const stand=(kind,ally,x,y)=>({kind,ally,x,y,hp:1,maxHP:1,facing:ally?1:-1,step:0,attackAt:-10,hitAt:-10});
    slots.forEach((kind,i)=>{
      const slot=b.marchSlot(ROUTE.entrance,i);
      this.actor(stand(kind,true,slot.x,slot.y),false);
    });
    d.rooms[0][1].forEach((kind,i)=>this.actor(stand(kind,false,660+(i%3)*54,226+(i%4)*43),false));
    if(slots.length) {
      g.font="13px Georgia";
      g.textAlign="center";
      g.fillStyle="#ebd8ff";g.fillText("YOUR LEGION",ROUTE.entrance,366);
    }
  }

  actor(unit, combat = true) {
    const b=this.battle,g=this.g,scale=spriteScale(unit);
    const boss=unit.boss, friendly=unit.ally;
    const strike=b.elapsed-unit.attackAt, sinceHit=b.elapsed-unit.hitAt;
    const motion=!this.motion.matches;
    const lunge=motion&&strike<.24?Math.sin(strike/.24*Math.PI)*(unit.range>55?-4:boss?16:11)*unit.facing:0;
    const recoil=motion&&sinceHit<.17?(1-sinceHit/.17)**2*(unit.heavyHit?9:5):0;
    const x=unit.x+lunge+Math.cos(unit.hitAngle??0)*recoil,y=unit.y+Math.sin(unit.hitAngle??0)*recoil;
    const walking=b.elapsed-unit.movedAt<.15;
    const stride=walking?Math.sin(unit.step)*2.2:0;
    const bob=walking&&motion?Math.abs(Math.sin(unit.step))*3:0;
    const risen=Math.min(1,(b.elapsed-(unit.riseAt??-10))/ROUTE.riseTime);
    ellipse(g,x,y+1,boss?55:27, boss?13:8, "#0b0812c8",true);
    if(friendly || boss) {
      g.lineWidth=1;
      ellipse(g,x,y+1,boss?49:24,boss?12:7,friendly?"#bb8ef07b":"#ec926c7e");
      flare(g,x,y-8,friendly?"#a467ed":"#e89568",friendly?.21:.12,boss?83:43);
    }
    if(unit === b.focus) {
      g.lineWidth=2;ellipse(g,x,y,32,11,"#ffbe83");
      polygon(g,"#ffbd89",[[x-6,y-73],[x+6,y-73],[x,y-66]]);
    }
    const damageFlash=motion&&sinceHit<.09;
    if(damageFlash){g.save();g.filter=unit.heavyHit?"brightness(1.9)":"brightness(1.5)";}
    if(risen<1) flare(g,x,y,"#c28aff",.36*(1-risen),36);
    drawSprite(g,unit.kind,x,y-bob,scale,friendly,unit.facing,{
      stride,attack:strike<.35?1-strike/.35:0,
      rotation:motion?(1-risen)**2*1.18:0,alpha:.30+risen*.70
    });
    if(damageFlash)g.restore();
    if(!combat || boss) return;
    const offset=unit.kind==="rat"?25:unit.kind==="spider"?41:unit.kind==="egg"?44:66;
    const width=31;
    g.fillStyle="#10091adb";g.fillRect(x-width/2-1,y-offset-1,width+2,5);
    g.fillStyle=friendly?"#b691ed":"#d76c65";g.fillRect(x-width/2,y-offset,width*unit.hp/unit.maxHP,3);
    if(unit.poison>0) {g.fillStyle="#bae283";g.fillRect(x+width/2+4,y-offset,3,3);}
  }

  corpse(item,selected) {
    const g=this.g;
    ellipse(g,item.x,item.y,selected?36:25,selected?12:8,selected?"#d99aff":"#9773c065");
    flare(g,item.x,item.y,"#a769df",selected?.42:.12,selected?52:27);
    drawSprite(g,item.kind,item.x-7,item.y+4,item.boss?1.91:1.04,false,1,{rotation:Math.PI/2.7,alpha:.49});
    const size=item.boss?8:4;
    polygon(g,"#d9a1ff",[[item.x,item.y-15-size],[item.x+size,item.y-15],[item.x,item.y-15+size],[item.x-size,item.y-15]]);
  }

  effect(e) {
    const g=this.g,age=1-e.life/e.total;
    g.save();g.globalAlpha=Math.min(1,e.life/e.total*1.5);
    if(e.type==="damage") {
      const punch=this.motion.matches?0:Math.max(0,1-age*5)*4;
      const drift=this.motion.matches?16:35;
      g.font="bold "+Math.round((e.heavy?20:15)+punch)+"px Georgia";
      g.textAlign="center";g.fillStyle=e.color;g.strokeStyle="#170e1a";g.lineWidth=e.heavy?4:3;
      const y=e.y-(1-(1-age)**2)*drift;
      g.strokeText(e.text,e.x,y);g.fillText(e.text,e.x,y);
    } else if(e.type==="ring") {
      g.lineWidth=3*(1-age)+1;
      ellipse(g,e.x,e.y,e.radius*(.22+age*.78),e.radius*(.12+age*.46),e.color);
    } else if(e.type==="shock") {
      const radius=e.radius*(.15+.85*(1-(1-age)**3));
      g.lineWidth=Math.max(1,(1-age)*5);
      ellipse(g,e.x,e.y,radius,radius*.77,e.color);
      g.globalAlpha*=.45;
      ellipse(g,e.x,e.y,radius*.83,radius*.64,e.color);
      if(!this.motion.matches) flare(g,e.x,e.y,e.color,.25*(1-age),radius*.82);
    } else if(e.type==="slash" || e.type==="bite") {
      g.translate(e.x,e.y);
      g.rotate(e.angle??0);
      const radius=e.radius*(.72+age*.3);
      const bite=e.type==="bite";
      for(let i=0;i<(bite?2:1);i++) {
        const y=bite?(i===0?-5:5):0;
        g.beginPath();
        g.ellipse(-radius*.42,y,radius,radius*(bite?.29:.59),bite?(i===0?.42:-.42):-.48,-1.22,1.25);
        g.strokeStyle=e.color;g.lineWidth=(e.heavy?13:8)*(1-age)+1;g.stroke();
        g.strokeStyle="#fff2e6";g.lineWidth=(e.heavy?4:2)*(1-age)+1;g.stroke();
      }
    } else if(e.type==="sparks") {
      if(!this.motion.matches) flare(g,e.x,e.y,e.color,.42*(1-age),e.radius*.83);
      const amount=this.motion.matches?4:e.heavy?12:7;
      const travel=1-(1-age)**2;
      for(let i=0;i<amount;i++) {
        const angle=e.angle+(i*2.4+e.seed*.13)%(2*Math.PI);
        const distance=e.radius*travel*(.37+(i%5)*.19);
        const x=e.x+Math.cos(angle)*distance,y=e.y+Math.sin(angle)*distance;
        g.strokeStyle=i%3===0?"#fff3e6":e.color;
        g.lineWidth=i%3===0?2.4:1.5;
        g.beginPath();g.moveTo(x,y);
        g.lineTo(x+Math.cos(angle)*(1-age)*7,y+Math.sin(angle)*(1-age)*7);g.stroke();
      }
    } else {
      for(let i=0;i<15;i++) {
        const angle=i*2.4+e.seed*.13;
        const distance=e.radius*age*(.48+(i%5)*.15);
        const x=e.x+Math.cos(angle)*distance,y=e.y+Math.sin(angle)*distance-age*21;
        g.fillStyle=i%4===0?"#ead9ff":e.color;
        g.fillRect(x,y,i%4===0?3:2,i%4===0?3:2);
      }
    }
    g.restore();
  }

  cinematic() {
    const g=this.g,b=this.battle,c=b.cinematic;
    const elapsed=c.time;
    g.fillStyle="#0d0816d9";g.fillRect(0,0,960,480);
    const progress=Math.min(1,elapsed/1.4);
    const ease=1-(1-progress)**3;
    const origin=c.preview?c.x:c.x-this.camera;
    const x=origin+(480-origin)*ease,y=c.y+(294-c.y)*ease;
    const transformed=elapsed>2.35;
    const accent=UNITS[c.kind].accent;
    const radius=(64+Math.sin(elapsed*2)*22)*(transformed?1.6:1);
    flare(g,x,y-17,accent,transformed?.46:.22,radius*1.6);
    g.save();
    g.globalAlpha=.65;
    g.lineWidth=1.5;
    for(let i=0;i<3;i++) ellipse(g,x,y,38+i*18+Math.sin(elapsed*3)*4,10+i*4,accent);
    for(let i=0;i<102;i++) {
      const angle=i*2.4+elapsed*(i%3+1)*.44;
      const flow=(i*.071+elapsed*.53)%1;
      const rr=(1-flow)*(182-i%9*7);
      const px=x+Math.cos(angle)*rr,py=y+Math.sin(angle)*rr*.46-flow*120;
      g.globalAlpha=.15+flow*.72;
      g.fillStyle=i%7===0?"#fff2ff":accent;
      g.fillRect(px,py,i%5===0?4:2,i%5===0?4:2);
    }
    g.restore();
    const rise=Math.min(1,Math.max(0,(elapsed-1.45)*1.38));
    const gesture=Math.max(0,Math.sin(Math.max(0,elapsed-3.13)*1.36))*(elapsed>3.13&&elapsed<5.45?1:0);
    g.save();g.translate(x,y+gesture*(c.kind==="queen"?9:8));
    if(c.kind==="queen")g.scale(1,1-gesture*.25);
    if(c.kind==="knight")g.scale(1,1-gesture*.22);
    drawSprite(g,c.kind,0,0,2.7+rise*.7,transformed,-1,{rotation:(1-rise)*1.17+(c.kind==="king"?gesture*.34:0),planted:c.kind==="knight"&&gesture>.22,alpha:.53+rise*.47});
    g.restore();
    if(elapsed>2.24 && elapsed<2.76) {
      g.fillStyle="rgba(209,164,248,"+((2.76-elapsed)*.53)+")";g.fillRect(0,0,960,480);
    }
  }
}

class GameAudio {
  constructor(enabled) { this.enabled=enabled; this.context=null; this.last={}; }
  wake() {
    if(!this.enabled) return;
    const Audio=window.AudioContext||window.webkitAudioContext;
    if(!Audio) return;
    this.context ||= new Audio();
    if(this.context.state==="suspended") this.context.resume().catch(()=>{});
  }
  play(name) {
    if(!this.enabled||!this.context||this.context.state!=="running"||!tones[name]) return;
    const time=this.context.currentTime;
    if(time-(this.last[name]??-9)<(name==="hit"?.14:.10)) return;
    this.last[name]=time;
    for(const [hz,duration,wave,volume,delay=0] of tones[name]) {
      const osc=this.context.createOscillator(), gain=this.context.createGain();
      const start=time+delay;
      osc.type=wave;
      osc.frequency.setValueAtTime(hz,start);
      osc.frequency.exponentialRampToValueAtTime(hz*((name==="hit"||name==="impact")?.58:.92),start+duration);
      gain.gain.setValueAtTime(.0001,start);
      gain.gain.exponentialRampToValueAtTime(volume,start+.018);
      gain.gain.exponentialRampToValueAtTime(.0001,start+duration);
      osc.connect(gain).connect(this.context.destination);
      osc.start(start);osc.stop(start+duration+.015);
    }
  }
}

function persist() {
  const result=syncExpeditions(state,Date.now());
  const saved=saveGame(storage,state);
  setHTML($("save-state"),icon(saved?"check":"info")+(saved?" Saved locally":" Save unavailable"));
  if(result.earned) log("Expeditions returned "+formatNumber(result.earned)+" Essence.","gold");
  return saved;

function log(message,kind="") {
  entries.unshift({message,kind,time:Date.now()});
  if(entries.length>26) entries.pop();
  setHTML($("log"),entries.map(entry=>'<li class="'+entry.kind+'"><time datetime="'+new Date(entry.time).toISOString()+'">'+
    new Date(entry.time).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"})+'</time>'+escapeHTML(entry.message)+'</li>').join(""));
}

function commanderGuide() {
  const d=DUNGEONS[peek ?? state.selected], remembered=state.cleared.includes(peek ?? state.selected);
  if(peek!==null) {
    setHTML($("guide"),'<h2>'+icon("book")+d.name+'</h2><p>'+d.difficulty+' · '+(d.rooms.length+1)+' rooms</p><small>'+
      d.species.map(id=>UNITS[id].name).join(" · ")+'</small><div class="boss-preview">'+image(d.boss)+'<div><small>Dungeon boss</small><p>'+UNITS[d.boss].name+'</p></div></div><small>'+
      (remembered && automationUnlocked(state)?"Available for expeditions":!unlocked(state,peek)?"Conquer the previous dungeon to unlock.":d.cue)+'</small>');
    return;
  }
  let tip="Your servants fight on their own. Raise fallen enemies to grow your legion.";
  if(battle.phase==="fallen") tip="Use Arise to bind the fallen general. The first binding is guaranteed and requires no mana.";
  else if(battle.phase==="between") tip="Claim the fallen before your army advances. Select a corpse for Arise, or use Arise All.";
  else if(state.cleared.length) tip="Upgrade Dominion to field larger armies. A general can lead an expedition from your reserves.";
  setHTML($("guide"),'<h2>'+icon("book")+'Commander’s Guide</h2><p>'+tip+'</p>');

function renderBattle() {
  const b=battle,d=b.dungeon,boss=b.boss, ongoing=b.ongoing, cap=value(state,"dominion");
  const acting=["fighting","between"].includes(b.phase);
  const traveling=b.phase==="marching";
  const canPause=acting||traveling;
  if(!acting) targeting=false;
  const corpses=b.corpses.filter(c=>!c.claimed&&!c.boss);
  const selected=corpses.find(c=>c.id===b.selectedCorpse)||corpses[0];
  $("rank").textContent=d.rank+"-RANK";
  $("difficulty").textContent=d.difficulty;
  $("location").textContent=d.name;
  setHTML($("room-label"),'Room '+(b.room+1)+' of '+(d.rooms.length+1)+' <span>·</span> '+escapeHTML(b.roomName));
  setHTML($("room-track"),Array.from({length:d.rooms.length+1},(_,i)=>'<span class="'+(i===b.room?"current ":i<b.room?"done ":"")+
    (i===d.rooms.length?"boss":"")+'" title="'+escapeHTML(d.rooms[i]?.[0]||UNITS[d.boss].name)+'"></span>').join(""));
  $("arena").classList.toggle("targeting",targeting);
  const badges=[];
  if(b.phase!=="cinematic") {
    const stage={ready:"At the gate",marching:b.march?.regroup>0?"Regrouping":"Marching",between:"Room cleared",fallen:"General defeated",fighting:"In combat",
      ended:b.outcome==="victory"?"Dungeon conquered":"Returned to camp"};
    badges.push('<span class="arena-tag">'+icon(acting?"swords":b.phase==="fallen"?"skull":"gate")+(b.paused&&canPause?"Paused":stage[b.phase])+'</span>');
    if(acting) badges.push('<span class="arena-tag '+(boss?.windup?"warning":"")+'">'+icon(boss?.windup?"info":"rune")+
      (boss?.windup?"Signature attack incoming":corpses.length+" claimable "+(corpses.length===1?"corpse":"corpses"))+'</span>');
    else if(b.phase==="ready") badges.push('<span class="arena-tag">'+icon("skull")+'Boss · '+UNITS[d.boss].name+'</span>');
  }
  setHTML($("arena-top"),badges.join(""));
  let middle="", bottom="";
  if(b.phase==="ready") {
    bottom='<div class="stage-cta">'+button("start","Begin Descent",{style:"accent",graphic:"swords",inactive:!countStack(state.lineup)})+
      '<p class="arena-note">'+(countStack(state.lineup)?"Your army advances and fights automatically.":"Deploy at least one soldier in Army.")+'</p></div>';
  } else if(b.phase==="ended") {
    const won=b.outcome==="victory";
    middle='<span class="arena-message">'+(won?d.name+" conquered":b.outcome==="defeat"?"Your legion was overwhelmed":"Returned to camp")+'</span>';
    bottom=button("start","Repeat Descent",{style:"accent",graphic:"swords",inactive:!countStack(state.lineup)})+
      (won&&DUNGEONS[state.selected+1]&&unlocked(state,state.selected+1)?button("dungeon","Next Dungeon",{style:"secondary",attrs:'data-index="'+(state.selected+1)+'"'}):"");
  } else if(b.phase==="between") {
    bottom='<span class="arena-message">March resumes in '+Math.max(1,Math.ceil(b.wait/state.speed))+'s</span>';
  } else if(b.phase==="fallen") {
    bottom=button("arise","Arise · Bind General",{style:"accent",graphic:"arise"})+'<span class="arena-tag">Free first binding</span>';
  } else if(b.phase==="fighting"&&boss?.hp>0) {
    middle=b.intro>0?'<div class="boss-intro"><small>BOSS ENCOUNTER</small><strong>'+UNITS[boss.kind].name+'</strong><p class="arena-note">'+UNITS[boss.kind].title+'</p></div>':
      '<div class="boss-meter"><div class="meter-line"><strong>'+UNITS[boss.kind].name+'</strong><span class="meter-text">'+Math.ceil(boss.hp)+' / '+boss.maxHP+'</span></div>'+
      meter(boss.hp/boss.maxHP*100)+'</div>';
  }
  if(b.rallyUntil>b.elapsed && b.phase==="fighting" && !b.team.some(unit=>unit.hp>0)) {
    bottom='<span class="arena-message">Raise or call reinforcements · '+Math.ceil((b.rallyUntil-b.elapsed)/state.speed)+'s</span>';
  }
  if(b.paused&&canPause) bottom='<span class="arena-message">Battle paused</span>'+button("pause","Resume battle",{style:"accent"});
  setHTML($("arena-middle"),middle);setHTML($("arena-bottom"),bottom);
  $("cinematic").hidden=b.phase!=="cinematic";
  if(b.phase==="cinematic") {
    const data=UNITS[b.cinematic.kind], phase=b.cinematic.time;
    setHTML($("cinematic"),button("skip","Skip",{style:"skip secondary",attrs:'aria-label="Skip resurrection cinematic"'})+
      '<div class="oath"><small>'+(phase<2.4?"THE BINDING":data.role.toUpperCase())+'</small><strong>'+(phase<2.4?"Arise":data.name)+'</strong>'+
      (phase>3.2?'<p>'+data.gesture+'</p>':"")+(phase>4.2?'<p><b>'+data.signature+'</b> · '+data.command+'</p>':"")+'</div>');
  }
  const actions={
    arise:b.phase==="fallen"||(acting&&selected&&b.mana>=UNITS[selected.kind].mana),
    "arise-all":acting&&corpses.some(c=>b.mana>=UNITS[c.kind].mana),
    focus:acting&&b.enemies.some(u=>u.hp>0),
    reinforce:acting&&b.mana>=RULES.reinforceMana&&b.elapsed>=b.reinforceReady,
    reserves:acting&&b.mana>=RULES.reserveMana&&Object.keys(b.reserves).some(kind=>b.used+UNITS[kind].cost<=cap),retreat:canPause
  };
  for(const [key,enabled] of Object.entries(actions)) {
    const control=document.querySelector('.command-row [data-action="'+key+'"],.battle-tools [data-action="'+key+'"]');
    control.disabled=!enabled;
    if(key==="arise") control.classList.toggle("ready",Boolean(enabled));
    if(key==="focus") control.classList.toggle("targeting",targeting);
  }
  $("arise-label").textContent=b.phase==="fallen"?"Bind the general":selected?UNITS[selected.kind].mana+" mana":"Raise one";
  $("all-label").textContent=corpses.length?corpses.length+" available":"Raise the fallen";
  $("focus-label").textContent=b.focus?.hp>0?"Target marked":targeting?"Select an enemy":"Mark a target";
  $("ward-label").textContent=b.reinforced>b.elapsed?Math.ceil(b.reinforced-b.elapsed)+"s warded":b.reinforceReady>b.elapsed?Math.ceil(b.reinforceReady-b.elapsed)+"s cooldown":"12 mana";
  $("command-hint").textContent=targeting?"Click an enemy to set focus":b.focus?.hp>0?"Focus · "+UNITS[b.focus.kind].name:
    selected?"Corpse · "+UNITS[selected.kind].name:traveling?"Your legion marches automatically":ongoing?"Click an enemy or corpse":"Commands become available during battle";
}

      const def=UNITS[id], owned=state.owned[id], field=(battle.ongoing?battle.field:state.lineup)[id];
      const status=owned?(assigned(state,id)?"On expedition":field?"Deployed":battle.regenerating[id]?"Regenerating":"Available in reserves"):DUNGEONS[i].name+" · Unbound";
      const stats=owned?'<dl>'+stat("Health",Math.round(def.hp*value(state,"general")))+stat("Damage",Math.round(def.damage*value(state,"general")))+stat("Dominion",def.cost)+stat("Cooldown",def.cooldown+"s")+'</dl>':"";
      return card(def.name,status,image(id,owned?"":"mystery"),stats+'<p><b>'+def.signature+'</b> · '+def.command+'</p><p><b>Leadership</b> · '+def.leadership+'</p>');
    }).join("")+'</div>';
  } else if(page==="upgrades") {
    html=heading("Upgrades","Spend Death Essence to improve your legion, mana, and expeditions.")+
      '<div class="manage-grid">'+Object.entries(UPGRADES).map(([id,up])=>{
        const level=state.levels[id]||0, fee=upgradeCost(state,id), max=level>=up.max;
        const shortfall=Math.max(0,fee-state.essence);
        const stats='<dl>'+stat("Current",up.format(value(state,id)))+stat("Next",max?"Maxed":up.format(value(state,id)+up.step))+'</dl>';
        return card(up.name,"Level "+level,'<span class="manage-icon">'+icon(up.icon)+'</span>','<p>'+up.detail+'</p>'+stats+
          '<div class="buttons">'+button("upgrade",max?"Fully upgraded":"Buy for "+formatNumber(fee)+" Essence",{
            attrs:'data-kind="'+id+'"',inactive:max||shortfall>0
          })+'</div>'+(shortfall>0&&!max?'<p>Need '+formatNumber(shortfall)+' more Essence.</p>':""));
      }).join("")+'</div>';
  } else html=renderExpeditions();
  setHTML($("management"),html);
  if(page==="expeditions") updateForecast();
}

function renderExpeditions() {
  const header=heading("Expeditions","Assign a general and soldiers to repeatedly clear conquered dungeons.");
  if(!automationUnlocked(state)) return header+'<section class="panel"><div class="empty-card"><span class="empty-emblem">'+icon("lock")+
    '</span><strong>Expeditions locked</strong><p>Conquer Goblin Cavern and bind the Goblin King to send your first expedition.</p></div></section>';
  const jobs=state.expeditions.map(task=>{
    const d=DUNGEONS[task.dungeon], general=Object.keys(task.squad).find(isGeneral);
    return card(d.name,UNITS[general].name+" · Repeating",image(general),
      '<p>'+Object.entries(task.squad).filter(([id])=>!isGeneral(id)).map(([id,n])=>n+" × "+UNITS[id].name).join(" · ")+'</p>'+
      '<dl>'+stat("Clear time",timeLabel(task.duration))+stat("Per clear",task.reward)+stat("Essence / min",(task.reward*60/task.duration).toFixed(1))+
      stat("Remaining",'<span data-exp-time="'+task.dungeon+'">'+timeLabel(task.duration-task.progress)+'</span>')+'</dl>'+
      '<div data-exp-meter="'+task.dungeon+'">'+meter(task.progress/task.duration*100)+'</div>'+
      '<div class="buttons">'+button("recall","Recall expedition",{style:"secondary",attrs:'data-index="'+task.dungeon+'"',inactive:battle.ongoing})+'</div>');
  }).join("");
  const total='<p class="panel manage-note">Lifetime expedition income · <strong id="exp-total">'+formatNumber(state.expeditionEssence)+'</strong> Essence</p>';
  if(battle.ongoing) return header+total+'<p class="panel manage-note">Expeditions continue during battle. Visit camp to change assignments.</p><div class="manage-grid single">'+jobs+'</div>';
  const choices=state.cleared.filter(id=>!state.expeditions.some(task=>task.dungeon===id));
  if(!choices.includes(expeditionDraft.dungeon)) expeditionDraft.dungeon=choices[0];
  const units=GENERALS.filter(id=>reserve(state,id)>0), current=units.find(id=>expeditionDraft.squad[id]);
  const edit=choices.length?'<div class="panel manage-card"><h3>Assemble an Expedition</h3><div class="exp-draft">'+
    '<label>Conquered dungeon<select id="exp-dungeon">'+choices.map(i=>'<option value="'+i+'"'+(expeditionDraft.dungeon===i?" selected":"")+'>'+DUNGEONS[i].name+'</option>').join("")+'</select></label>'+
    '<label>General<select id="exp-general"><option value="">Select a reserve general</option>'+
    units.map(id=>'<option value="'+id+'"'+(current===id?" selected":"")+'>'+UNITS[id].name+'</option>').join("")+'</select></label>'+
    (!units.length?'<p class="manage-note">Move an owned general to reserves from the Army screen.</p>':"")+
    COMMON.filter(id=>reserve(state,id)>0).map(id=>'<div class="exp-unit"><label for="exp-'+id+'">'+UNITS[id].name+' <small>('+reserve(state,id)+' available)</small></label>'+
      '<input type="number" id="exp-'+id+'" data-exp-unit="'+id+'" min="0" max="'+reserve(state,id)+'" value="'+Math.min(reserve(state,id),expeditionDraft.squad[id]||0)+'"></div>').join("")+
    '<p class="exp-forecast" id="exp-forecast"></p>'+button("start-exp","Start expedition",{style:"accent",graphic:"flag"})+'</div></div>':"";
  return header+total+'<div class="manage-grid single">'+jobs+edit+'</div>';
}

function updateForecast() {
  const output=$("exp-forecast");
  if(!output) return;
  const forecast=expeditionForecast(state,expeditionDraft.dungeon,expeditionDraft.squad), squad=expeditionDraft.squad;
  const ready=forecast&&forecast.power>=forecast.required&&GENERALS.some(id=>squad[id]&&reserve(state,id)>0)&&COMMON.some(id=>squad[id]);
  output.textContent=forecast?"Strength "+forecast.power+" / "+forecast.required+" required · "+timeLabel(forecast.duration)+" per clear · "+forecast.reward+
    " Essence per clear · "+(forecast.reward*60/forecast.duration).toFixed(1)+" Essence/min":"Choose a dungeon.";
  document.querySelector('[data-action="start-exp"]').disabled=!ready;
}

function refresh() {
  renderResources();renderDungeons();renderBattle();renderLegion();renderManagement();
}
function setPage(next) {
  if(!["battle","army","generals","upgrades","expeditions"].includes(next)) return;
  if(battle.phase==="cinematic"&&next!=="battle") return;
  page=next;
  $("battle-page").hidden=next!=="battle";
  $("management").hidden=next==="battle";
  document.querySelectorAll(".main-nav button").forEach(node=>{
    node.classList.toggle("active",node.dataset.page===page);
    if(node.dataset.page===page) node.setAttribute("aria-current","page"); else node.removeAttribute("aria-current");
  });
  renderManagement();
}

function dev() {
  $("dialog").innerHTML='<div class="dialog-top"><div><h2>Developer Tools</h2><p>Changes affect this browser’s current save.</p></div>'+
    '<button type="button" class="icon-button" data-action="close" aria-label="Close">'+icon("close")+'</button></div>'+
    '<div class="dev-actions">'+button("dev-essence","Add 500 Essence")+button("dev-mana","Restore mana")+button("dev-cap","Increase Dominion")+
    button("dev-unlock","Unlock dungeons")+button("dev-offline","Simulate 1 hour")+'</div>'+
    '<label>Traversal pace<select id="dev-traversal">'+ROUTE.rates.map(rate=>
      '<option value="'+rate+'"'+(battle.traversalRate===rate?' selected':'')+'>'+rate+'×</option>').join("")+'</select></label>'+
    '<label>Unit<select id="dev-unit">'+COMMON.map(id=>'<option value="'+id+'">'+UNITS[id].name+'</option>').join("")+'</select></label>'+
    '<div class="dev-actions">'+button("dev-grant","Grant 5 test units")+button("dev-spawn","Spawn enemy")+'</div>'+
    '<label>Boss<select id="dev-boss">'+GENERALS.map((id,i)=>'<option value="'+i+'">'+UNITS[id].name+'</option>').join("")+'</select></label>'+
    '<div class="dev-actions">'+button("dev-boss","Trigger boss encounter")+button("dev-preview","Preview cinematic")+
    button("dev-reset","Reset saved progress",{style:"danger"})+'</div>';
  if(!$("dialog").open) $("dialog").showModal();
}
function actions(name,node={dataset:{}}) {
  const id=node.dataset.kind, index=Number(node.dataset.index);
  switch(name) {
    case "start": battle.start(); break;
    case "arise": battle.arise(); break;
    case "arise-all": battle.arise(true); break;
    case "focus":
      if(battle.phase!=="fighting") break;
      if(battle.focus?.hp>0){battle.focus=null;targeting=false;} else targeting=!targeting;
      renderBattle();break;
    case "reinforce": battle.reinforce(); break;
    case "reserves": battle.callReserves(); break;
    case "general": battle.generalCommand(id); break;
    case "skip": battle.finishCinematic(); break;
    case "pause":
      if(!["between","fighting","marching"].includes(battle.phase)) break;
      battle.paused=!battle.paused;refresh();break;
    case "speed":
      state.speed=Number(node.dataset.speed);battle.paused=false;persist();refresh();break;
    case "retreat": battle.retreat();break;
    case "dungeon":
      if(!DUNGEONS[index]) break;
      if(battle.select(index)) {peek=peek===index?null:index;setPage("battle");}
      else peek=peek===index?null:index;
      refresh();break;
    case "sound":
      state.sound=!state.sound;audio.enabled=state.sound;
      if(state.sound){audio.wake();audio.play("ward");}
      persist();renderResources();break;
    case "deploy": case "remove":
      if(!battle.ongoing&&deploy(state,id,name==="deploy"?1:-1)){persist();refresh();}
      break;
    case "upgrade":
      if(battle.buyUpgrade(id)){
        audio.play("ward");
        persist();
        refresh();
        notify(UPGRADES[id].name+" upgraded to level "+state.levels[id]+".");
      }
      break;
    case "start-exp":
      if(battle.ongoing) break;
      persist();
      if(startExpedition(state,expeditionDraft.dungeon,expeditionDraft.squad)){
        expeditionDraft={dungeon:0,squad:{}};
        persist();refresh();notify("Expedition dispatched.");
      } else notify("Check the squad’s strength and available reserves.");
      break;
    case "recall":
      if(battle.ongoing) break;
      persist();
      state.expeditions=state.expeditions.filter(job=>job.dungeon!==index);
      persist();refresh();notify("Expedition recalled. Soldiers returned to reserve.");break;
    case "developer": dev();break;
    case "close": $("dialog").close();break;
    case "dev-essence": state.essence+=500;persist();refresh();notify("500 test Essence added.");break;
    case "dev-mana": battle.mana=value(state,"mana");refresh();notify("Mana restored.");break;
    case "dev-cap":
      state.levels.dominion=Math.min(UPGRADES.dominion.max,(state.levels.dominion||0)+4);
      persist();refresh();notify("Dominion increased.");break;
    case "dev-unlock":
      state.cleared=[0,1,2];persist();refresh();notify("All dungeons unlocked.");break;
    case "dev-offline": {
      const now=Date.now(), result=syncExpeditions(state,now);
      const simulated=syncExpeditions(state,Math.max(now,state.lastSaved)+3600000);
      state.lastSaved=now;persist();refresh();
      notify("Simulated "+(simulated.clears+result.clears)+" clears and "+formatNumber(simulated.earned+result.earned)+" Essence.");
      break;
    }
    case "dev-grant":
      for(let i=0;i<5;i++)acquire(state,$("dev-unit").value);
      persist();refresh();notify("Five test soldiers moved to reserves.");break;
    case "dev-spawn":
      if(battle.phase!=="fighting"){notify("Start a dungeon before spawning an enemy.");break;}
      battle.enemies.push(battle.make($("dev-unit").value,false,battle.roomX+790,302,{nextAttack:battle.elapsed+.8}));
      $("dialog").close();refresh();break;
    case "dev-boss": {
      if(battle.ongoing){notify("Finish or retreat from the current attempt first.");break;}
      const n=Number($("dev-boss").value);
      for(let i=0;i<n;i++)if(!state.cleared.includes(i))state.cleared.push(i);
      battle.select(n);
      if(!battle.start(battle.dungeon.rooms.length)){notify("Deploy a soldier before starting a boss encounter.");break;}
      $("dialog").close();setPage("battle");refresh();break;
    }
    case "dev-preview":
      if(battle.ongoing){notify("Return to camp before previewing a cinematic.");break;}
      $("dialog").close();setPage("battle");battle.previewCinematic(GENERALS[Number($("dev-boss").value)]);break;
    case "dev-reset":
      $("dialog").innerHTML='<h2>Reset saved progress?</h2><p>This removes your current army, upgrades, and expedition assignments from this browser.</p>'+
        '<div class="dev-actions">'+button("developer","Cancel",{style:"secondary"})+button("dev-confirm-reset","Reset save",{style:"danger"})+'</div>';
      $("dialog").querySelector('[data-action="developer"]').focus();
      break;
    case "dev-confirm-reset": {
      if (!$("dialog").open) break;
      Object.assign(state,createState());
      battle.reset();
      audio.enabled=state.sound;
      peek=null;
      targeting=false;
      expeditionDraft={dungeon:0,squad:{}};
      entries.length=0;
      setPage("battle");
      log("A lone skeleton answers your call.","violet");
      const saved=persist();
      $("dialog").close();
      refresh();
      notify(saved?"Save reset. A new game has started.":"A new game has started. Browser storage is unavailable.");
      break;
    }
  }
}

document.querySelectorAll("[data-icon]").forEach(node=>node.innerHTML=icon(node.dataset.icon));
document.addEventListener("click",event=>{
  const node=event.target.closest("[data-action],[data-page]");
  if(!node||node.disabled)return;
  audio.wake();
  if(node.dataset.page){event.preventDefault();setPage(node.dataset.page);}
  else actions(node.dataset.action,node);
});
$("field").addEventListener("click",event=>{
  const rect=$("field").getBoundingClientRect();
  const x=view.worldX((event.clientX-rect.x)/rect.width*RULES.width);
  if(battle.pick(x,(event.clientY-rect.y)/rect.height*RULES.height,targeting)){
    targeting=false;renderBattle();
  }
});
document.addEventListener("keydown",event=>{
  if(event.repeat||event.altKey||event.ctrlKey||event.metaKey||page!=="battle"||$("dialog").open||
    ["INPUT","SELECT","TEXTAREA"].includes(document.activeElement?.tagName))return;
  if(event.key===" "&&document.activeElement?.tagName==="BUTTON")return;
  const keys={a:"arise",q:"arise-all",f:"focus",r:"reinforce",c:"reserves"," ":"pause"};
  const action=keys[event.key.toLowerCase()];
  if(action){event.preventDefault();audio.wake();actions(action);}
});
$("dialog").addEventListener("change",event=>{
  if(event.target.id==="dev-traversal") {
    const rate=Number(event.target.value);
    if(ROUTE.rates.includes(rate)) battle.traversalRate=rate;
  }
});
$("management").addEventListener("input",event=>{
  const input=event.target;
  if(input.dataset.expUnit) {
    const count=Math.min(Number(input.max),Math.max(0,Math.floor(Number(input.value)||0)));
    expeditionDraft.squad[input.dataset.expUnit]=count;
    if(input.value!==""&&Number(input.value)!==count)input.value=count;
  } else if(input.id==="exp-dungeon")expeditionDraft.dungeon=Number(input.value);
  else if(input.id==="exp-general") {
    for(const id of GENERALS)delete expeditionDraft.squad[id];
    if(input.value)expeditionDraft.squad[input.value]=1;
  }
  updateForecast();
});
window.addEventListener("pagehide",persist);
document.addEventListener("visibilitychange",()=>{
  previous=performance.now();persist();
  if(!document.hidden){renderResources();renderManagement();}
});

let previous=performance.now(), uiAt=0, syncAt=0;
function frame(now) {
  const dt=Math.min(.05,Math.max(0,(now-previous)/1000));
  previous=now;
  if(!document.hidden) {
    battle.tick(dt);
    if(page==="battle")view.render(dt);
    if(now-uiAt>155) {
      uiAt=now;renderResources();
      if(page==="battle"){renderBattle();renderLegion();}
    }
    if(now-syncAt>1000) {
      syncAt=now;
      if(state.expeditions.length) {
        persist();
        for(const job of state.expeditions) {
          const timer=document.querySelector('[data-exp-time="'+job.dungeon+'"]');
          if(timer)timer.textContent=timeLabel(job.duration-job.progress);
          const progress=document.querySelector('[data-exp-meter="'+job.dungeon+'"]');
          if(progress)setHTML(progress,meter(job.progress/job.duration*100));
        }
        if($("exp-total"))$("exp-total").textContent=formatNumber(state.expeditionEssence);
        if(page==="upgrades")renderManagement();
      }
    }
  }
  requestAnimationFrame(frame);
}

if(loaded.offline.earned) {
  const message="While you were away, your expeditions cleared "+loaded.offline.clears+" dungeons and earned "+formatNumber(loaded.offline.earned)+" Essence.";
  log(message,"gold");notify(message);
} else log(countStack(state.owned)===1?"A lone skeleton answers your call.":"Your legion awaits your command.","violet");
persist();refresh();requestAnimationFrame(frame);

})();
</script>
</body>
</html>
