<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Games</title>
<style>
  :root { --bg:#12141c; --panel:#1c2030; --text:#e8ebf5; --dim:#8a92aa; --accent:#6ee7b7; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px system-ui,sans-serif; padding:16px; }
  main { max-width:480px; margin:0 auto; }
  h1 { font-size:22px; }
  .games { display:grid; gap:10px; }
  a.game { display:block; padding:16px; border-radius:14px; background:var(--panel); color:var(--text); text-decoration:none; }
  a.game strong { color:var(--accent); font-size:18px; }
  a.game span { display:block; color:var(--dim); margin-top:4px; font-size:14px; }
</style>
</head>
<body>
<main>
  <h1>Games</h1>
  <div class="games">
    <a class="game" href="incremental/">
      <strong>Incremental</strong>
      <span>Idle clicker with upgrades and prestige</span>
    </a>
    <a class="game" href="snake/">
      <strong>Snake</strong>
      <span>Classic snake with swipe and button controls</span>
    </a>
    <a class="game" href="isometric/">
      <strong>Isometric Brawler</strong>
      <span>Toon isometric action with 3-hit combo, mobile controls and tuning sliders</span>
    </a>
  </div>
</main>
</body>
</html>
