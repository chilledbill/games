<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Ember Road</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Layout: HUD strip on top, scrolling scene fills the middle, upgrade panel docked at the bottom. */
:root {
  --panel: #171a33;
  --line: #2f3466;
  --text: #f6efe3;
  --muted: #a3a1c2;
  --gold: #ffd166;
  --go: #7bd88f;
  --boss: #c45cff;
  --display: "Pixelify Sans", ui-monospace, "Courier New", monospace;
  --body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; background: var(--panel); color: var(--text); font-family: var(--body); overscroll-behavior: none; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
body { display: flex; flex-direction: column; padding-top: env(safe-area-inset-top); }

.hud { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 14px; padding: 10px 16px; background: var(--panel); border-bottom: 2px solid var(--line); }
.stage { display: flex; flex-direction: column; line-height: 1; }
.stage span { font-size: 10px; letter-spacing: .14em; color: var(--muted); }
.stage b { font-family: var(--display); font-size: 30px; font-weight: 700; margin-top: 3px; }
.prog { position: relative; height: 20px; background: #0e1022; border: 2px solid var(--line); border-radius: 4px; overflow: hidden; }
.prog i { position: absolute; inset: 0 auto 0 0; width: 0; background: linear-gradient(#ff9d5c, #e8603c); transition: width .2s; }
.prog.boss { border-color: var(--boss); }
.prog.boss i { background: linear-gradient(#d98bff, #8a2fd0); transition: none; }
.prog.farm i { background: #3a3f6e; }
.prog span { position: absolute; inset: 0; display: grid; place-items: center; font: 700 11px var(--display); letter-spacing: .06em; text-shadow: 0 1px 0 #000a; }
.gold { display: flex; align-items: center; gap: 7px; font-family: var(--display); font-size: 22px; font-weight: 700; color: var(--gold); font-variant-numeric: tabular-nums; }
.coin { display: inline-block; width: 14px; height: 14px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff2b0, var(--gold) 55%, #c98f1a); box-shadow: 0 0 0 2px #7a560d; flex: none; }

.scene { position: relative; flex: 1; min-height: 0; }
#scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.chip { position: absolute; top: 10px; appearance: none; border: 2px solid var(--line); background: rgba(14,16,34,.82); color: var(--text); font: 700 15px var(--display); padding: 8px 12px; border-radius: 6px; cursor: pointer; min-width: 52px; min-height: 40px; }
.chip:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
#speed { right: 12px; }
#speed.fast { border-color: var(--gold); color: var(--gold); }
#fightBoss { left: 50%; transform: translateX(-50%); border-color: var(--boss); background: #3b1a5c; color: #f0d9ff; padding: 10px 18px; box-shadow: 0 4px 0 #1e0d30; animation: pulse 1.4s ease-in-out infinite; }
#fightBoss:active { transform: translateX(-50%) translateY(3px); box-shadow: 0 1px 0 #1e0d30; }
#fightBoss[hidden] { display: none; }
@keyframes pulse { 50% { background: #5a2790; } }
@media (prefers-reduced-motion: reduce) { #fightBoss { animation: none; } }

.abils { position: absolute; left: 10px; right: 10px; bottom: 10px; display: flex; gap: 6px; justify-content: flex-start; }
.abil { appearance: none; position: relative; width: 52px; height: 52px; border-radius: 50%; border: 3px solid var(--line); background: #0e1022; padding: 0; cursor: pointer; display: grid; place-items: center; overflow: hidden; }
.abil[hidden] { display: none; }
.abil canvas { width: 28px; height: 28px; margin-bottom: 8px; image-rendering: pixelated; }
.abil::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: conic-gradient(rgba(8,9,20,.78) calc(var(--cd, 0) * 360deg), transparent 0); }
.abil.ready { border-color: var(--gold); box-shadow: 0 0 0 3px #ffd16633, 0 0 14px #ffd16688; }
.abil.ready:active { transform: scale(.94); }
.abil:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.abil small { position: absolute; bottom: 3px; left: 0; right: 0; z-index: 1; font: 700 10px var(--display); color: var(--text); text-shadow: 0 1px 0 #000; text-align: center; }
#auto { left: 12px; }
#auto.on { border-color: var(--go); color: var(--go); }
.panel { padding: 10px 16px calc(12px + env(safe-area-inset-bottom)); background: var(--panel); border-top: 2px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
.buy { appearance: none; width: 100%; display: grid; grid-template-columns: 6px 1fr auto; grid-template-areas: "bar name cost" "bar eff cost"; align-items: center; column-gap: 12px; row-gap: 2px; text-align: left; padding: 7px 14px 7px 10px; min-height: 54px; border-radius: 8px; border: 2px solid var(--line); background: #232748; color: var(--muted); cursor: pointer; font-family: var(--body); touch-action: manipulation; }
.buy::before { content: ""; grid-area: bar; align-self: stretch; border-radius: 3px; background: var(--c); }
.buy .name { grid-area: name; font-family: var(--display); font-weight: 700; font-size: 17px; color: var(--text); }
.buy .name em { font-style: normal; font-size: 13px; color: var(--muted); margin-left: 6px; }
.buy .eff { grid-area: eff; font-size: 13px; font-variant-numeric: tabular-nums; }
.buy .cost { grid-area: cost; display: flex; align-items: center; gap: 7px; font-family: var(--display); font-weight: 700; font-size: 19px; color: var(--muted); font-variant-numeric: tabular-nums; }
.buy.ok { background: #2c4a3a; border-color: var(--go); color: #d4f2dc; box-shadow: 0 4px 0 #1a3025; }
.buy.ok .cost { color: var(--gold); }
.buy.ok:active { transform: translateY(3px); box-shadow: 0 1px 0 #1a3025; }
.buy:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.tabs { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.tab { appearance: none; position: relative; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 2px 5px; min-height: 52px; border-radius: 8px; border: 2px solid var(--line); background: #0e1022; color: var(--muted); cursor: pointer; font-family: var(--body); }
.tab canvas { width: 27px; height: 30px; image-rendering: pixelated; }
.tab small { font: 700 11px var(--display); font-variant-numeric: tabular-nums; white-space: nowrap; }
.tab.on { border-color: var(--gold); background: #2a2a4f; color: var(--text); }
.tab.locked canvas { filter: brightness(0) opacity(.45); }
.tab.ping { border-color: var(--gold); }
.tab.ping small { color: var(--gold); }
.tab.ping::after { content: ""; position: absolute; top: 4px; right: 4px; width: 8px; height: 8px; border-radius: 50%; background: var(--gold); animation: ping 1s ease-in-out infinite; }
@keyframes ping { 50% { transform: scale(1.5); } }
.tab:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.role { margin: 0; font-size: 12px; line-height: 1.35; color: var(--muted); min-height: 1.35em; }
.role b { color: var(--text); font-family: var(--display); font-size: 14px; }
.ups { display: flex; flex-direction: column; gap: 8px; }
.buy[hidden] { display: none; }
.hint { margin: 0; font-size: 12px; line-height: 1.4; color: var(--muted); text-align: center; }
</style>
</head>
<body>
<header class="hud">
  <div class="stage"><span>STAGE</span><b id="stage">1</b></div>
  <div class="prog" id="prog" role="progressbar" aria-label="Stage progress"><i id="progFill"></i><span id="progTxt">0 / 10</span></div>
  <div class="gold"><i class="coin"></i><b id="gold">0</b></div>
</header>

<main class="scene">
  <canvas id="scene" aria-label="Your party walks right and fights slimes. Tap to strike."></canvas>
  <button id="fightBoss" class="chip" type="button" hidden>Fight Boss</button>
  <button id="speed" class="chip" type="button" aria-label="Game speed">1x</button>
  <button id="auto" class="chip" type="button" aria-pressed="false">Auto: Off</button>
  <div class="abils" id="abils"></div>
</main>

<section class="panel">
  <div class="tabs" id="tabs" role="tablist"></div>
  <p class="role" id="role"></p>
  <div class="ups" id="ups"></div>
</section>

<script>

// draw one 32x32 frame anchored at the feet. Measured on these strips: feet at y = 23 (Slime: 20)
function sprite(key, col, row, footX, footY, sc, alpha) {
  const im = IMG[key];
  if (!im || !im.complete || !im.naturalWidth) return false;
  const w = 32 * sc;
  if (alpha != null) ctx.globalAlpha = alpha;
  ctx.drawImage(im, col * 32, row * 32, 32, 32, Math.round(footX - w / 2), Math.round(footY - (key === 'Slime' ? 20 : 23) * sc), w, w);
  ctx.globalAlpha = 1;
  return true;
}

function fmt(n) {
  if (n < 1000) return n < 10 && n % 1 ? n.toFixed(1) : String(Math.floor(n));

  return (v < 10 ? v.toFixed(2) : v < 100 ? v.toFixed(1) : v.toFixed(0)) + SUF[i];
}

function hud() {
  el.stage.textContent = S.stage;
  el.gold.textContent = fmt(S.gold);
  if (!M[S.tab]) S.tab = 'knight';
  const cur = M[S.tab], curHas = has(cur.id);
  TAB_ORDER.forEach(id => {
    const m = M[id], owned = has(id), ready = !owned && S.stage >= m.unlock;
    m.el.classList.toggle('on', S.tab === id);
    m.el.classList.toggle('locked', !owned);
    m.el.classList.toggle('ping', ready);
    m.el.setAttribute('aria-selected', S.tab === id);
    m.sub.textContent = owned ? 'Lv ' + memberLv(id) : ready ? 'Join!' : 'St ' + m.unlock;
  });
  el.role.innerHTML = '<b>' + cur.name + '</b> · ' + cur.row + ' row · ' + cur.role;
  recruit.el.hidden = curHas;
  if (!curHas) {
    const ok = S.stage >= cur.unlock;
    recruit.el.querySelector('.name').firstChild.textContent = 'Recruit ' + cur.name;
    recruit.lvEl.textContent = '';
    recruit.effEl.textContent = ok ? cur.row + ' row. ' + cur.role : 'Reach Stage ' + cur.unlock + ' to unlock';
    recruit.costEl.textContent = fmt(cur.cost);
    recruit.el.classList.toggle('ok', ok && S.gold >= cur.cost);
  }
  UP.forEach(u => {
    u.el.hidden = u.who !== S.tab || !curHas;
    if (u.el.hidden) return;
    const l = S[u.key], c = u.cost(l);
    u.lvEl.textContent = 'Lv ' + (l + 1);
    u.effEl.textContent = u.unit
      ? u.stat + ' ' + mult(u.val(l)) + ' → ' + mult(u.val(l + 1)) + u.unit
      : u.stat + ' ' + fmt(u.val(l)) + ' → ' + fmt(u.val(l + 1));
    u.costEl.textContent = fmt(c);
    u.el.classList.toggle('ok', S.gold >= c);
  });
  ABIL.forEach(a => { a.el.hidden = !has(a.who); });
  el.fight.hidden = !S.farm;
  progress();
}
function progress() {
  const boss = enemy && enemy.boss;
  el.prog.classList.toggle('boss', !!boss);
  el.prog.classList.toggle('farm', S.farm && !boss);
  if (boss) {
    el.fill.style.width = (Math.max(0, bossT) / C.bossTime * 100) + '%';
    el.txt.textContent = 'BOSS ' + Math.ceil(Math.max(0, bossT)) + 's';
  } else if (S.farm) {
    el.fill.style.width = '100%'; el.txt.textContent = 'FARMING';
  } else {
    el.fill.style.width = (S.kills / C.killsPerStage * 100) + '%';
    el.txt.textContent = S.kills + ' / ' + C.killsPerStage;
  }
}

/* ---------- Buying (tap or hold) ---------- */
function buy(u) {
  const l = S[u.key], c = u.cost(l);
  if (S.gold < c) return false;
  S.gold -= c; S[u.key]++;
  const gain = u.val(l + 1) - u.val(l);
  if (u.id === 'hp' && !down.knight) hp.knight += gain;
  if (u.id === 'tHp' && !down.tank) hp.tank += gain;
  const x = disp[u.who] || targetX(u.who);
  floatText(x, roadY() - P * 18, u.unit ? u.name.toUpperCase() + ' UP' : '+' + fmt(gain) + ' ' + u.stat.toUpperCase(), u.color, 13);
  burst(x, roadY() - P * 8, u.color, 8);
  hud();
  return true;
}
function bindHold(btn, fn) {
  let ht = null, hi = null;
  const stop = () => { clearTimeout(ht); clearInterval(hi); ht = hi = null; };
  btn.addEventListener('pointerdown', e => { e.preventDefault(); fn(); ht = setTimeout(() => { hi = setInterval(fn, 110); }, 350); });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(t => btn.addEventListener(t, stop));
  btn.addEventListener('click', e => { if (e.detail === 0) fn(); });
  btn.addEventListener('contextmenu', e => e.preventDefault());
}

/* ---------- Canvas ---------- */
const cv = $('scene'), ctx = cv.getContext('2d');
let W = 360, H = 400, U = 1, P = 3.5, SC = 3;
function resize() {
  const r = cv.getBoundingClientRect(), dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = Math.max(200, r.width); H = Math.max(160, r.height);
  cv.width = W * dpr; cv.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  U = Math.max(0.7, Math.min(W / 360, H / 380, 1.6));
  P = 3.9 * U;
  SC = Math.max(2, Math.round(3 * U));   // integer sprite scale keeps pixels crisp
  ctx.imageSmoothingEnabled = false;
}
window.addEventListener('resize', resize);
new ResizeObserver(resize).observe(cv);
const groundY = () => H * 0.62;
const roadY = () => groundY() + 14 * U;

/* ---------- Formation ---------- */
function lineup() { return PARTY.map(m => m.id).filter(has); }
function targetX(id) {
  const ids = lineup(), n = ids.length, sp = Math.min(17 * SC, W * 0.13);
  const front = Math.max(W * 0.36, W * 0.1 + sp * (n - 1));
  const i = ids.indexOf(id);
  return front - sp * (n - 1 - (i < 0 ? n - 1 : i));
}
const frontX = () => targetX(lineup()[lineup().length - 1]);

function spawnEnemy() {
  const boss = !S.farm && S.kills >= C.killsPerStage;
  const h = hpAt(S.stage) * (boss ? C.bossHpMult : 1);
  enemy = {
    x: W + 50 * U, hp: h, max: h, flash: 0, lunge: 0, boss, stun: 0,
    atk: eAtkAt(S.stage) * (boss ? C.bossAtkMult : 1), atkT: 0,
    scale: boss ? 1.6 : 1, sheet: enemySheet(S.stage), born: t,
    hue: boss ? (285 + S.stage * 23) % 360 : 120 + Math.floor((S.stage - 1) / 10) * 55
  };
  if (boss) { bossT = C.bossTime; floatText(W / 2, H * 0.28, 'BOSS!', '#d98bff', 34); }
  progress();
}
function floatText(x, y, text, color, size) { floats.push({ x, y, text, color, size: size * U, life: 0.9, max: 0.9 }); }

      ctx.fillStyle = '#fff2b0'; ctx.beginPath(); ctx.arc(-r * 0.25, -r * 0.25, r * 0.45, 0, 7); ctx.fill();
    }
    ctx.restore();
  }
}
function drawFx() {
  for (const q of parts) { ctx.globalAlpha = Math.max(0, q.life * 2); ctx.fillStyle = q.color; ctx.fillRect(q.x, q.y, 3 * U, 3 * U); }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'center'; ctx.lineJoin = 'round';
  for (const f of floats) {
    ctx.globalAlpha = Math.min(1, f.life / (f.max * 0.5));
    ctx.font = '700 ' + f.size + 'px "Pixelify Sans", ui-monospace, monospace';
    ctx.lineWidth = 3 * U; ctx.strokeStyle = '#0b0c1a'; ctx.strokeText(f.text, f.x, f.y);
    ctx.fillStyle = f.color; ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;
}
function draw() {
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - 0.5) * 8 * U, (Math.random() - 0.5) * 6 * U);
  drawWorld(); drawEnemy();
  lineup().forEach((id, i) => drawMember(id, i));
  drawShots(); drawFx();
  ctx.restore();
}

/* ---------- Main loop ---------- */
let last = performance.now(), hudT = 0;
function frame(now) {
  const real = Math.min(0.05, (now - last) / 1000); last = now;
  const n = C.speeds[S.speed % C.speeds.length];
  for (let i = 0; i < n; i++) update(real);
  hudT -= real; if (hudT <= 0) { hudT = 0.25; hud(); }
  ABIL.forEach(a => { if (a.el.hidden) return; a.el.style.setProperty('--cd', (a.left / a.cd).toFixed(3)); a.el.classList.toggle('ready', canCast(a)); });
  draw();
  requestAnimationFrame(frame);
}
resize(); fullHeal(); spawnEnemy(); showSpeed(); showAuto(); hud();
requestAnimationFrame(frame);
</script>
