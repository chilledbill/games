<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Vania</title>
<style>
  html,body { margin:0; height:100%; background:#07080d; overflow:hidden; touch-action:none;
    user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; font-family:system-ui,sans-serif; color:#cfd6e6; }
  canvas { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); background:#0b0d14; image-rendering:pixelated; }
  .btn { position:fixed; width:68px; height:68px; border-radius:50%; background:rgba(200,210,240,.15);
    border:2px solid rgba(200,210,240,.35); color:#e8ecf8; font-size:14px; font-weight:700;
    display:flex; align-items:center; justify-content:center; touch-action:none; }
  .btn.on { background:rgba(255,255,255,.4); }
  #left { left:14px; bottom:22px; } #right { left:96px; bottom:22px; } #down { left:55px; bottom:92px; width:50px; height:50px; } #up { left:55px; bottom:148px; width:50px; height:50px; }
  #jump { right:14px; bottom:90px; } #atk { right:92px; bottom:22px; width:76px; height:76px; } #run { right:14px; bottom:12px; width:60px; height:60px; }
  #gear { position:fixed; top:8px; right:8px; width:40px; height:40px; border-radius:8px; border:1px solid #445; background:rgba(20,24,36,.8);
    color:#cfd6e6; font-size:20px; }
  #panel { position:fixed; top:54px; right:8px; width:min(260px,70vw); max-height:calc(100% - 70px); overflow:auto; display:none;
    background:rgba(12,15,24,.94); border:1px solid #445; border-radius:10px; padding:10px 12px; font-size:13px; touch-action:pan-y; }
  #panel.show { display:block; }
  #panel label { display:block; margin:8px 0 2px; } #panel label b { float:right; color:#8fd; font-weight:500; }
  #panel input { width:100%; margin:0; }
  #panel button { margin-top:10px; width:100%; padding:8px; background:#223; color:#cfd6e6; border:1px solid #556; border-radius:6px; }
  #help { position:fixed; left:10px; top:8px; font-size:12px; opacity:.7; pointer-events:none; line-height:1.4; }
  @media (pointer:coarse) { #help { display:none; } }
  @media (pointer:fine) { .btn { display:none; } }
</style>
</head>
<body>
<canvas id="c" width="800" height="450"></canvas>
<div id="help">A/D move · Shift run · Space jump · J slash · W+J up-slash · S+J in air = pogo</div>
<button id="gear">⚙</button>
<div id="panel"></div>
<div class="btn" id="left" data-k="left">◀</div>
<div class="btn" id="right" data-k="right">▶</div>
<div class="btn" id="up" data-k="up">▲</div>
<div class="btn" id="down" data-k="down">▼</div>
<div class="btn" id="run" data-k="run">RUN</div>
<div class="btn" id="jump" data-k="jump">JUMP</div>
<div class="btn" id="atk" data-k="atk">ATK</div>
<script>
// ---------- Tunable settings (sliders) ----------
const DEFAULTS = {
  gravity:   [2200, 600, 3500, 50, 'Gravity'],
  walk:      [200, 60, 400, 5, 'Walk speed'],
  run:       [300, 100, 700, 10, 'Run speed'],
  jump:      [620, 300, 1000, 10, 'Jump power'],
  atkRange:  [70, 30, 150, 5, 'Attack range'],
  atkCd:     [0.32, 0.1, 1, 0.02, 'Attack cooldown (s)'],
  knock:     [260, 0, 700, 10, 'Enemy knockback'],
  hitstop:   [0.06, 0, 0.2, 0.01, 'Hit freeze (s)'],
  shake:     [6, 0, 20, 1, 'Screen shake'],
};
const S = {};
for (const k in DEFAULTS) S[k] = DEFAULTS[k][0];
try { Object.assign(S, JSON.parse(localStorage.vaniaS || '{}')); } catch (e) {}

const panel = document.getElementById('panel');
function buildPanel() {
  panel.innerHTML = '';
  for (const k in DEFAULTS) {
    const [, min, max, step, name] = DEFAULTS[k];
    const l = document.createElement('label');
    const b = document.createElement('b'); b.textContent = S[k];
    l.append(name, b);
    const i = document.createElement('input');
    i.type = 'range'; i.min = min; i.max = max; i.step = step; i.value = S[k];
    i.oninput = () => { S[k] = +i.value; b.textContent = S[k]; try { localStorage.vaniaS = JSON.stringify(S); } catch (e) {} };
    panel.append(l, i);
  }
  const r = document.createElement('button'); r.textContent = 'Reset to defaults';
  r.onclick = () => { for (const k in DEFAULTS) S[k] = DEFAULTS[k][0]; try { delete localStorage.vaniaS; } catch (e) {} buildPanel(); };
  panel.append(r);
}
buildPanel();
document.getElementById('gear').onclick = () => panel.classList.toggle('show');

// ---------- Canvas scaling ----------
const cv = document.getElementById('c'), g = cv.getContext('2d');
const W = 800, H = 450;
function fit() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = W * s + 'px'; cv.style.height = H * s + 'px';
}
addEventListener('resize', fit); fit();

// ---------- Input (keyboard + multi-touch buttons) ----------
const keys = { left:0, right:0, up:0, down:0, run:0, jump:0, atk:0 };
let jumpPressed = false, atkPressed = false;
const map = { ArrowLeft:'left', KeyA:'left', ArrowRight:'right', KeyD:'right', ArrowDown:'down', KeyS:'down',
  ShiftLeft:'run', ShiftRight:'run', Space:'jump', KeyC:'jump', ArrowUp:'up', KeyW:'up', KeyJ:'atk', KeyK:'atk', KeyZ:'atk' };
function setKey(k, v) {
  if (v && !keys[k]) { if (k === 'jump') jumpPressed = true; if (k === 'atk') atkPressed = true; }
  keys[k] = v;
}
addEventListener('keydown', e => { const k = map[e.code]; if (k) { setKey(k, 1); e.preventDefault(); } });
addEventListener('keyup', e => { const k = map[e.code]; if (k) setKey(k, 0); });
document.querySelectorAll('.btn').forEach(el => {
  const k = el.dataset.k;
  const on = e => { e.preventDefault(); el.setPointerCapture(e.pointerId); el.classList.add('on'); setKey(k, 1); };
  const off = e => { el.classList.remove('on'); setKey(k, 0); };
  el.addEventListener('pointerdown', on);
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(t => el.addEventListener(t, off));
  el.addEventListener('contextmenu', e => e.preventDefault());
});

// ---------- World ----------
const WORLD_W = 2600, FLOOR = 400;
const WALL_X = 1700;
const solids = [
  { x:-40, y:-200, w:40, h:900 },              // left boundary
  { x:WORLD_W, y:-200, w:40, h:900 },          // right boundary
  { x:0, y:FLOOR, w:WORLD_W, h:60 },           // floor
  { x:1740, y:0, w:WORLD_W - 1740, h:250 },    // ceiling over secret passage
  { x:300, y:320, w:140, h:16 },               // platforms
  { x:520, y:250, w:140, h:16 },
  { x:760, y:320, w:120, h:16 },
  { x:1250, y:300, w:150, h:16 },
  { x:1450, y:230, w:120, h:16 },
];
const wall = { x:WALL_X, y:250, w:40, h:150, hp:3, maxHp:3, alive:true, flash:0 };
const orb = { x:2250, y:FLOOR - 40, got:false };
const dummy = { x:1000, y:FLOOR - 64, w:40, h:64, hp:5, maxHp:5, flash:0, vx:0, dead:0, hits:0 };
const p = { x:100, y:FLOOR - 56, w:28, h:52, vx:0, vy:0, face:1, ground:false,
  atkT:0, atkCd:0, atkDir:0, hitSet:null, coyote:0, buffer:0, slashSide:1 };
const parts = []; let freeze = 0;
function spark(x, y, n, col) { for (let i = 0; i < n; i++) { const a = Math.random() * 6.28, v = 80 + Math.random() * 260; parts.push({ x, y, vx:Math.cos(a) * v, vy:Math.sin(a) * v - 60, t:0.35 + Math.random() * 0.25, col }); } }
let cam = 0, shake = 0, msg = '', msgT = 0;

function allSolids() { return wall.alive ? solids.concat(wall) : solids; }
function overlap(a, b) { return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }
function say(t) { msg = t; msgT = 2.5; }

function moveBody(b, dt) {
  b.x += b.vx * dt;
  for (const s of allSolids()) if (overlap(b, s)) {
    if (b.vx > 0) b.x = s.x - b.w; else if (b.vx < 0) b.x = s.x + s.w; b.vx = 0;
  }
  b.y += b.vy * dt; b.ground = false;
  for (const s of allSolids()) if (overlap(b, s)) {
    if (b.vy > 0) { b.y = s.y - b.h; b.ground = true; } else if (b.vy < 0) b.y = s.y + s.h;
    b.vy = 0;
  }
}

function attackBox() {
  const r = S.atkRange;
  if (p.atkDir === 2) return { x:p.x + p.w/2 - 22, y:p.y + p.h, w:44, h:r * 0.8 };
  if (p.atkDir === 1) return { x:p.x + p.w/2 - 22, y:p.y - r * 0.8, w:44, h:r * 0.8 };
  const x = p.face > 0 ? p.x + p.w : p.x - r;
  return { x, y:p.y + 2, w:r, h:p.h - 4 };
}

function hit(target, isWall) {
  const dir = p.atkDir ? 0 : p.face;
  target.flash = 0.12; shake = S.shake; freeze = S.hitstop;
  spark(target.x + target.w / 2, target.y + target.h / 2, isWall ? 10 : 14, isWall ? '#a89880' : '#fff');
  if (isWall) {
    target.hp--;
    if (target.hp <= 0) { target.alive = false; say('The wall crumbles... a hidden passage!'); shake = S.shake * 2; }
  } else {
    target.hp--; target.hits++; target.vx = (dir || p.face) * S.knock; if (p.atkDir === 1) target.vy = -250;
    if (target.hp <= 0) target.dead = 2;
  }
  if (p.atkDir === 2) { p.vy = -S.jump * 0.75; p.ground = false; }          // pogo
}

function update(dt) {
  if (freeze > 0) { freeze -= dt; return; }                                // hit-stop
  for (let i = parts.length - 1; i >= 0; i--) { const q = parts[i]; q.t -= dt; q.vy += 900 * dt; q.x += q.vx * dt; q.y += q.vy * dt; if (q.t <= 0) parts.splice(i, 1); }
  // movement
  const dir = keys.right - keys.left;
  const speed = keys.run ? S.run : S.walk;
  const target = dir * speed;
  const accel = p.ground ? 12000 : 7000;                                  // near-instant, like the Knight
  p.vx += Math.max(-accel * dt, Math.min(accel * dt, target - p.vx));
  if (dir) p.face = dir;
  p.coyote = p.ground ? 0.09 : p.coyote - dt;                              // coyote time
  p.buffer = jumpPressed ? 0.1 : p.buffer - dt;                            // jump buffer
  if (p.buffer > 0 && p.coyote > 0) { p.vy = -S.jump; p.ground = false; p.coyote = p.buffer = 0; }
  if (!keys.jump && p.vy < -S.jump * 0.3) p.vy = -S.jump * 0.3;            // variable jump height
  p.vy = Math.min(p.vy + S.gravity * (p.vy > 0 ? 1.35 : 1) * dt, 1000);    // heavier fall
  moveBody(p, dt);

  // attack
  p.atkCd -= dt; p.atkT -= dt;
  if (atkPressed && p.atkCd <= 0) {
    p.atkT = 0.14; p.atkCd = S.atkCd; p.hitSet = new Set();
    p.atkDir = keys.up ? 1 : (!p.ground && keys.down) ? 2 : 0;
    p.slashSide *= -1;
  }
  if (p.atkT > 0) {
    const box = attackBox();
    if (dummy.dead <= 0 && !p.hitSet.has(dummy) && overlap(box, dummy)) { p.hitSet.add(dummy); hit(dummy, false); }
    if (wall.alive && !p.hitSet.has(wall) && overlap(box, wall)) { p.hitSet.add(wall); hit(wall, true); }
  }
  jumpPressed = atkPressed = false;

  // dummy
  dummy.flash -= dt; wall.flash -= dt;
  dummy.vy = (dummy.vy || 0) + S.gravity * dt;
  dummy.vx *= Math.pow(0.001, dt);
  if (Math.abs(dummy.vx) < 5) dummy.vx = 0;
  moveBody(dummy, dt);
  if (dummy.dead > 0) { dummy.dead -= dt; if (dummy.dead <= 0) { dummy.hp = dummy.maxHp; dummy.hits = 0; dummy.x = 1000; dummy.vx = 0; } }

  // orb
  if (!orb.got && Math.hypot(p.x + p.w/2 - orb.x, p.y + p.h/2 - orb.y) < 30) { orb.got = true; say('You found a secret orb!'); }

  // camera + fx
  cam += (Math.max(0, Math.min(WORLD_W - W, p.x + p.w/2 - W/2 + p.face * 40)) - cam) * Math.min(1, dt * 6);
  shake = Math.max(0, shake - dt * 40); msgT -= dt;
}

// ---------- Rendering ----------
function rect(c, x, y, w, h) { g.fillStyle = c; g.fillRect(Math.round(x), Math.round(y), w, h); }
function draw(t) {
  g.setTransform(1, 0, 0, 1, 0, 0);
  const grd = g.createLinearGradient(0, 0, 0, H); grd.addColorStop(0, '#0a0c14'); grd.addColorStop(1, '#161a2a');
  g.fillStyle = grd; g.fillRect(0, 0, W, H);
  const sx = (Math.random() - .5) * shake, sy = (Math.random() - .5) * shake;
  // parallax stalactites
  g.fillStyle = '#10131f';
  for (let i = -1; i < 8; i++) {
    const x = i * 120 - (cam * 0.4) % 120, hh = 40 + ((i + Math.floor(cam * 0.4 / 120)) * 37 % 70 + 70) % 70;
    g.beginPath(); g.moveTo(x - 25, 0); g.lineTo(x + 25, 0); g.lineTo(x, hh); g.fill();
  }
  g.translate(Math.round(-cam + sx), Math.round(sy));

  // secret room tint
  rect('#1a1830', 1740, 250, WORLD_W - 1740, 150);
  for (const s of solids) { rect('#232838', s.x, s.y, s.w, s.h); rect('#3c4566', s.x, s.y, s.w, Math.min(4, s.h)); }
  // wall
  if (wall.alive) {
    const dmg = wall.maxHp - wall.hp;
    rect(wall.flash > 0 ? '#fff' : ['#7a6a58', '#6a5a4a', '#554636'][dmg], wall.x, wall.y, wall.w, wall.h);
    g.strokeStyle = '#1a1208'; g.lineWidth = 2;
    for (let i = 0; i < dmg * 2 + 1; i++) {
      g.beginPath(); g.moveTo(wall.x + 6 + i * 6, wall.y + 10 + i * 20); g.lineTo(wall.x + 30 - i * 3, wall.y + 40 + i * 25); g.stroke();
    }
  }
  // orb
  if (!orb.got) {
    const r = 9 + Math.sin(t / 200) * 2;
    const og = g.createRadialGradient(orb.x, orb.y, 1, orb.x, orb.y, 28);
    og.addColorStop(0, '#fff'); og.addColorStop(.3, '#7ff'); og.addColorStop(1, 'rgba(80,200,255,0)');
    g.fillStyle = og; g.beginPath(); g.arc(orb.x, orb.y, 28, 0, 7); g.fill();
    g.fillStyle = '#fff'; g.beginPath(); g.arc(orb.x, orb.y, r / 2, 0, 7); g.fill();
  }
  // dummy
  if (dummy.dead <= 0) {
    rect(dummy.flash > 0 ? '#fff' : '#a07a4a', dummy.x, dummy.y, dummy.w, dummy.h);
    rect('#5a4128', dummy.x + dummy.w/2 - 3, dummy.y + dummy.h, 6, 0);
    rect(dummy.flash > 0 ? '#fff' : '#c49a62', dummy.x + 6, dummy.y - 14, 28, 16);
    rect('#222', dummy.x + 10, dummy.y - 8, 4, 4); rect('#222', dummy.x + 24, dummy.y - 8, 4, 4);
    rect('#400', dummy.x - 5, dummy.y - 26, 50, 5);
    rect('#e44', dummy.x - 5, dummy.y - 26, 50 * dummy.hp / dummy.maxHp, 5);
    g.fillStyle = '#cfd6e6'; g.font = '11px sans-serif'; g.textAlign = 'center';
    g.fillText('Hits: ' + dummy.hits, dummy.x + 20, dummy.y - 32);
  }
  // player: pale horned mask, dark cloak, nail
  const f = p.face, cx = p.x + p.w / 2, bob = p.ground && Math.abs(p.vx) > 20 ? Math.sin(performance.now() / 50) * 1.5 : 0;
  rect('#15171f', p.x + 2, p.y + 18, p.w - 4, p.h - 18);                    // cloak
  rect('#232634', p.x + (f > 0 ? 2 : p.w - 8), p.y + 22, 6, p.h - 26);
  rect('#15171f', cx - 3 - f * 12, p.y + 22 + bob, 6, 10);                  // cape tail
  rect('#e9eef8', p.x, p.y + 2, p.w, 20);                                    // mask
  rect('#e9eef8', p.x + 2, p.y - 12, 6, 16); rect('#e9eef8', p.x + p.w - 8, p.y - 12, 6, 16); // horns
  rect('#0a0b10', cx + f * 3 - 6, p.y + 9, 5, 9); rect('#0a0b10', cx + f * 3 + 3, p.y + 9, 5, 9); // eyes
  rect('#bfc6d8', p.x + (f > 0 ? p.w - 2 : -10), p.y + 30, 12, 3);          // resting nail
  // slash effect
  if (p.atkT > 0) {
    const b = attackBox(), a = p.atkT / 0.14;
    g.fillStyle = `rgba(235,245,255,${0.3 + a * 0.6})`;
    g.beginPath();
    if (p.atkDir === 2) { g.moveTo(b.x, b.y); g.lineTo(b.x + b.w, b.y); g.lineTo(b.x + b.w / 2, b.y + b.h); }
    else if (p.atkDir === 1) { g.moveTo(b.x, b.y + b.h); g.lineTo(b.x + b.w, b.y + b.h); g.lineTo(b.x + b.w / 2, b.y); }
    else if (f > 0) { g.moveTo(b.x, b.y); g.quadraticCurveTo(b.x + b.w * 1.15, b.y + b.h / 2, b.x, b.y + b.h); g.quadraticCurveTo(b.x + b.w * .6, b.y + b.h / 2, b.x, b.y); }
    else { g.moveTo(b.x + b.w, b.y); g.quadraticCurveTo(b.x - b.w * .15, b.y + b.h / 2, b.x + b.w, b.y + b.h); g.quadraticCurveTo(b.x + b.w * .4, b.y + b.h / 2, b.x + b.w, b.y); }
    g.fill();
  }
  // hit sparks
  for (const q of parts) { g.globalAlpha = Math.min(1, q.t * 3); rect(q.col, q.x, q.y, 4, 4); }
  g.globalAlpha = 1;
  // fog + vignette
  g.setTransform(1, 0, 0, 1, 0, 0);
  const fg = g.createLinearGradient(0, H - 130, 0, H); fg.addColorStop(0, 'rgba(120,140,190,0)'); fg.addColorStop(1, 'rgba(120,140,190,.10)');
  g.fillStyle = fg; g.fillRect(0, H - 130, W, 130);
  const vg = g.createRadialGradient(W / 2, H / 2, H * .35, W / 2, H / 2, W * .65);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.7)');
  g.fillStyle = vg; g.fillRect(0, 0, W, H);
  // health masks (decorative)
  for (let i = 0; i < 5; i++) { g.fillStyle = '#e9eef8'; g.beginPath(); g.ellipse(70 + i * 24, 70, 8, 10, 0, 0, 7); g.fill(); g.fillStyle = '#0a0b10'; g.fillRect(66 + i * 24, 68, 3, 5); g.fillRect(72 + i * 24, 68, 3, 5); }
  // HUD
  if (msgT > 0) { g.fillStyle = '#fff'; g.font = '16px sans-serif'; g.textAlign = 'center'; g.globalAlpha = Math.min(1, msgT); g.fillText(msg, W / 2, 60); g.globalAlpha = 1; }
}

// ---------- Loop (fixed step) ----------
let last = performance.now(), acc = 0;
function frame(now) {
  acc += Math.min(0.1, (now - last) / 1000); last = now;
  const step = 1 / 120;
  while (acc >= step) { update(step); acc -= step; }
  draw(now);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
