<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>HD-2D Battle Prototype</title>
<style>
  :root { --bg:#12141c; --panel:#1c2030; --panel2:#262b40; --text:#e8ebf5; --dim:#8a92aa; --accent:#6ee7b7; --enemy:#f87171; --gold:#fbbf24; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font:14px system-ui,sans-serif; overflow:hidden; user-select:none; }
  #app { display:flex; flex-direction:column; height:100%; max-width:560px; margin:0 auto; padding:8px; gap:6px; }
  #top { display:flex; align-items:center; gap:6px; }
  #title { color:var(--dim); font-size:12px; white-space:nowrap; max-width:70px; overflow:hidden; text-overflow:ellipsis; }
  #order { display:flex; gap:4px; overflow:hidden; flex:1; }
  .chip { flex:0 0 auto; width:34px; height:34px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:18px; background:var(--panel); border:2px solid #3a4160; position:relative; }
  .chip.enemy { border-color:#7f3a3a; }
  .chip.now { border-color:var(--gold); transform:scale(1.08); }
  .chip img { height:28px; image-rendering:pixelated; }
  .chip small { position:absolute; bottom:-2px; right:1px; font-size:9px; color:var(--dim); }
  #top button { width:36px; height:36px; border-radius:8px; border:1px solid #445; background:var(--panel); color:var(--text); font-size:18px; flex:0 0 auto; }
  .row { display:grid; gap:6px; justify-content:center; }
  .card { position:relative; display:flex; flex-direction:column; align-items:center; transition:opacity .6s, filter .6s; }
  .sprite { position:relative; display:flex; justify-content:center; align-items:flex-end; z-index:1; }
  .sprite img { display:block; image-rendering:pixelated; filter:drop-shadow(0 0 1px #0008); animation:bob 1.6s ease-in-out infinite; }
  .sprite::after { content:''; position:absolute; bottom:-5px; left:50%; width:70%; height:12px; transform:translateX(-50%); border-radius:50%; background:radial-gradient(#000a, #0000 70%); z-index:-1; }
  @keyframes bob { 50% { transform:translateY(-3px); } }
  .enemy .sprite img { animation-duration:2.2s; }
  .info { width:100%; margin-top:6px; background:rgba(10,12,22,.7); border-radius:8px; padding:3px 4px; backdrop-filter:blur(2px); }
  .card .nm { font-size:11px; font-weight:600; text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .bar { height:6px; background:#0b0d14; border-radius:3px; overflow:hidden; margin-top:3px; }
  .bar i { display:block; height:100%; background:var(--accent); transition:width .25s; }
  .enemy .bar i { background:var(--enemy); }
  .hpn { font-size:10px; color:var(--dim); text-align:center; }
  .tags { display:flex; flex-wrap:wrap; gap:2px; justify-content:center; margin-top:2px; min-height:16px; }
  .tag { font-size:10px; padding:1px 4px; border-radius:4px; background:var(--panel2); }
  .tag.warn { background:#5b1d1d; color:#fecaca; animation:blink 1s infinite; }
  .tag.res { background:#1e3a4a; color:#bae6fd; }
  @keyframes blink { 50% { opacity:.55; } }
  .card.active::before { content:'▼'; position:absolute; top:-16px; left:50%; transform:translateX(-50%); color:var(--gold); font-size:13px; text-shadow:0 0 6px var(--gold); animation:arrow .6s ease-in-out infinite alternate; z-index:3; }
  @keyframes arrow { to { margin-top:-4px; } }
  .card.active { z-index:5; }
  .card.active .info { box-shadow:0 0 0 1px var(--gold); }
  .card.target { cursor:pointer; }
  .card.target .sprite::before { content:''; position:absolute; bottom:-9px; left:50%; width:90%; height:20px; transform:translateX(-50%); border-radius:50%; border:2px solid var(--accent); box-shadow:0 0 10px var(--accent); animation:ring .8s ease-in-out infinite alternate; }
  @keyframes ring { to { opacity:.4; width:105%; } }
  .card.charging .sprite img { filter:drop-shadow(0 0 6px #f00) drop-shadow(0 0 2px #f80); animation:bob .3s ease-in-out infinite; }
  .card.dead { opacity:.25; filter:grayscale(1) blur(1px); }
  .enemy.dead { opacity:.08; }
  .pop { position:absolute; left:50%; top:10px; transform:translateX(-50%); font-weight:900; font-size:22px; pointer-events:none; animation:pop 1s cubic-bezier(.2,1.6,.4,1) forwards; color:#fff; -webkit-text-stroke:1.5px #000; paint-order:stroke; text-shadow:0 3px 0 #000; white-space:nowrap; z-index:6; }
  .pop.heal { color:#86efac; } .pop.info { color:var(--gold); font-size:14px; } .pop.crit { color:#fb923c; font-size:32px; }
  @keyframes pop { 0% { opacity:1; transform:translate(-50%,8px) scale(.4); } 25% { transform:translate(-50%,-14px) scale(1.25); } 45% { transform:translate(-50%,-10px) scale(1); } 80% { opacity:1; } 100% { opacity:0; transform:translate(-50%,-30px); } }
  #stage { position:relative; overflow:hidden; flex:1; display:flex; flex-direction:column; justify-content:space-between; padding:22px 6px 10px; border-radius:12px; background:#0d1226; }
  #stage .row { position:relative; z-index:2; }
  .bg { position:absolute; left:0; right:0; pointer-events:none; }
  .sky { top:0; height:60%; background:linear-gradient(#0b1030, #2a2d5c 45%, #b8607a 85%, #f3a86b); }
  .sun { top:30%; left:55%; width:180px; height:180px; transform:translate(-50%,-50%); border-radius:50%; background:radial-gradient(#fff6d8, #ffcf8a55 25%, #ff9a6a22 50%, transparent 70%); mix-blend-mode:screen; }
  .mtn { top:24%; width:100%; height:36%; }
  .mtn .far { filter:blur(2px); } .mtn .near { filter:blur(.8px); }
  .floor { top:56%; bottom:0; background:linear-gradient(#3b5a3a, #26381f 60%, #1a2416); overflow:hidden; perspective:240px; }
  .floor::before { content:''; position:absolute; left:-60%; right:-60%; top:0; height:200%; transform:rotateX(62deg); transform-origin:top; background:repeating-linear-gradient(90deg, #0000 0 38px, #ffffff0d 38px 40px), repeating-linear-gradient(0deg, #0000 0 38px, #ffffff0d 38px 40px); }
  .floor::after { content:''; position:absolute; inset:0; background:linear-gradient(#f3a86b40, transparent 30%); }
  .rays { top:0; bottom:0; background:repeating-linear-gradient(105deg, transparent 0 30px, #ffe9b414 30px 55px, transparent 55px 90px); mix-blend-mode:screen; animation:rays 8s ease-in-out infinite alternate; }
  @keyframes rays { to { transform:translateX(30px); opacity:.5; } }
  .vig { top:0; bottom:0; background:radial-gradient(ellipse at 50% 55%, transparent 55%, #000a); z-index:3; transition:background .5s; }
  #stage.danger .vig { background:radial-gradient(ellipse at 50% 55%, transparent 45%, #b0000088); animation:danger 1s ease-in-out infinite alternate; }
  @keyframes danger { to { opacity:.6; } }
  #fx { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:4; }
  #flash { position:absolute; inset:0; pointer-events:none; z-index:5; background:#fff; opacity:0; }
  #log { height:62px; background:var(--panel); border-radius:10px; padding:6px 8px; font-size:12px; color:var(--dim); overflow:hidden; display:flex; flex-direction:column; justify-content:flex-end; }
  #log div:last-child { color:var(--text); }
  #menu { background:var(--panel); border-radius:10px; padding:8px; min-height:170px; }
  #who { font-weight:700; margin-bottom:6px; display:flex; justify-content:space-between; gap:6px; }
  #who span { color:var(--dim); font-weight:400; font-size:12px; text-align:right; }
  #acts { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
  #acts button { padding:11px 6px; font-size:14px; border-radius:8px; border:1px solid #3a4160; background:var(--panel2); color:var(--text); }
  #acts[style*="1fr 1fr 1fr"] button { font-size:13px; padding:10px 4px; }
  #acts button:disabled { opacity:.35; }
  #acts button.sel { border-color:var(--accent); }
  #desc { font-size:12px; color:var(--dim); margin-top:6px; min-height:16px; }
  #panel { position:fixed; top:52px; right:8px; width:min(280px,80vw); max-height:calc(100% - 64px); overflow:auto; display:none; background:rgba(20,24,36,.97); border:1px solid #445; border-radius:10px; padding:10px; font-size:12px; z-index:20; }
  #panel.show { display:block; }
  #panel h4 { margin:12px 0 0; color:var(--gold); }
  #panel label { display:block; margin:8px 0 2px; } #panel label b { float:right; color:#8fd; font-weight:500; }
  #panel input { width:100%; margin:0; }
  #panel button { margin-top:10px; width:100%; padding:8px; background:#223; color:#cfd6e6; border:1px solid #556; border-radius:6px; }
  #over { position:fixed; inset:0; background:rgba(0,0,0,.75); display:none; align-items:center; justify-content:center; z-index:30; }
  #over.show { display:flex; }
  #over > div { background:var(--panel); padding:20px; border-radius:14px; text-align:center; width:min(340px,92vw); }
  #over h2 { margin:0 0 8px; } #over p { color:var(--dim); margin:0 0 12px; }
  #ovBtns { display:flex; flex-direction:column; gap:8px; }
  #ovBtns button { padding:12px 16px; font-size:15px; border-radius:8px; border:1px solid #3a4160; background:var(--panel2); color:var(--text); text-align:left; }
  #ovBtns button.main { background:var(--accent); color:#0b1d15; font-weight:700; border:none; text-align:center; }
  #ovBtns button.main small { color:#14532d; }
  #ovBtns button small { display:block; color:var(--dim); font-size:11px; margin-top:2px; }
</style>
</head>
<body>
<div id="app">
  <div id="top"><span id="title"></span><div id="order"></div><button id="home">☰</button><button id="gear">⚙</button></div>
  <div id="stage">
    <div class="bg sky"></div><div class="bg sun"></div>
    <svg class="bg mtn" viewBox="0 0 100 40" preserveAspectRatio="none"><polygon class="far" fill="#4a4a7a" points="0,40 0,22 12,10 22,20 34,6 48,22 60,12 74,24 86,8 100,20 100,40"/><polygon class="near" fill="#2c3b4a" points="0,40 0,30 10,24 20,32 32,20 44,30 56,26 70,34 82,22 92,30 100,26 100,40"/></svg>
    <div class="bg floor"></div><div class="bg rays"></div><div class="bg vig"></div>
    <div id="enemies" class="row"></div><div id="party" class="row"></div>
    <canvas id="fx"></canvas><div id="flash"></div>
  </div>
  <div id="log"></div>
  <div id="menu"><div id="who"></div><div id="acts"></div><div id="desc"></div></div>
</div>
<div id="panel"></div>
<div id="over"><div><h2 id="ovT"></h2><p id="ovP"></p><div id="ovBtns"></div></div></div>
<script>
// ---------- Tunable settings (sliders) ----------
const DEFAULTS = {
  _g: 'General',
  partyDmg:   [1, 0.5, 2, 0.05, 'Hero damage x'],
  enemyDmg:   [1, 0.5, 2, 0.05, 'Enemy damage x'],
  enemyHp:    [1, 0.5, 2, 0.05, 'Enemy HP x (next battle)'],
  speed:      [1, 0.3, 2, 0.1, 'Animation time x'],
  shake:      [1, 0, 2, 0.1, 'Screen shake x'],
  _k: 'Kai (Monk)',
  chiMax:     [3, 1, 5, 1, 'Max Chi'],
  medHeal:    [0.2, 0, 0.5, 0.01, 'Meditate heal (of max HP)'],
  chiPower:   [0.5, 0, 1.5, 0.05, 'Palm Strike bonus per Chi'],
  shareHeal:  [25, 0, 60, 1, 'Share Chi ally heal'],
  _w: 'Wren (Thief)',
  chargeMax:  [3, 1, 5, 1, 'Max charges'],
  baseDodge:  [0.3, 0, 1, 0.05, 'Dodge chance with 0 charges'],
  partialCut: [0.5, 0, 1, 0.05, 'Partial dodge damage cut'],
  dodgeHeal:  [10, 0, 40, 1, 'Perfect dodge heal'],
  critRate:   [0.25, 0, 1, 0.05, 'Crit chance'],
  critMult:   [2, 1, 3, 0.1, 'Crit damage x'],
  exposeMult: [1.3, 1, 2, 0.05, 'Exposed: damage taken x'],
  markTurns:  [2, 1, 4, 1, 'Mark lasts (enemy turns)'],
  _s: 'Sela (Ranger)',
  mpMax:      [5, 2, 8, 1, 'Max mana'],
  roundCost:  [2, 1, 4, 1, 'Magic round cost'],
  mendHeal:   [35, 0, 80, 1, 'Mend Round heal'],
  burnDmg:    [9, 0, 25, 1, 'Burn per turn'],
  iceDelay:   [8, 0, 25, 1, 'Ice Round delay'],
  _v: 'Vance (Gambler)',
  fortuneMax: [5, 2, 8, 1, 'Max Fortune'],
  loadedCost: [2, 1, 5, 1, 'Loaded Dice Fortune cost'],
  donOdds:    [0.5, 0.1, 0.9, 0.05, 'Double or Nothing hit chance'],
  luckHeal:   [15, 0, 40, 1, 'Jackpot heals Vance'],
  jokerOdds:  [0.25, 0, 0.6, 0.05, 'Wild Card joker chance'],
  wildHeal:   [30, 0, 60, 1, 'Wild Card / All In heal'],
  _a: 'All heroes',
  guardCut:   [0.5, 0, 0.9, 0.05, 'Guard damage cut'],
  healFade:   [0.5, 0, 1, 0.05, 'Heal power kept per heal in a row'],
  stunDelay:  [12, 0, 30, 1, 'Doubles stun delay'],
};
const S = {};
for (const k in DEFAULTS) if (k[0] !== '_') S[k] = DEFAULTS[k][0];
try { Object.assign(S, JSON.parse(localStorage.hd2dS || '{}')); } catch (e) {}

const panel = document.getElementById('panel');
function buildPanel() {
  panel.innerHTML = '';
  for (const k in DEFAULTS) {
    if (k[0] === '_') { const h = document.createElement('h4'); h.textContent = DEFAULTS[k]; panel.append(h); continue; }
    const [, min, max, step, name] = DEFAULTS[k];
    const l = document.createElement('label');
    const b = document.createElement('b'); b.textContent = S[k];
    l.append(name, b);
    const i = document.createElement('input');
    i.type = 'range'; i.min = min; i.max = max; i.step = step; i.value = S[k];
    i.oninput = () => { S[k] = +i.value; b.textContent = S[k]; try { localStorage.hd2dS = JSON.stringify(S); } catch (e) {} render(); };
    panel.append(l, i);
  }
  const r = document.createElement('button'); r.textContent = 'Reset to defaults';
  r.onclick = () => { for (const k in DEFAULTS) if (k[0] !== '_') S[k] = DEFAULTS[k][0]; try { delete localStorage.hd2dS; } catch (e) {} buildPanel(); };
  const rs = document.createElement('button'); rs.textContent = 'Restart this battle';
  rs.onclick = () => { panel.classList.remove('show'); startBattle(battle); };
  panel.append(r, rs);
}
buildPanel();
document.getElementById('gear').onclick = () => panel.classList.toggle('show');
document.getElementById('home').onclick = () => { panel.classList.remove('show'); showSelect(); };

// ---------- Data ----------
const HEROES = {
  kai:   { cls: 'monk',    name: 'Kai',   face: '👊', max: 125, atk: 16, def: 5, spd: 14, role: 'Monk' },
  wren:  { cls: 'thief',   name: 'Wren',  face: '🗡️', max: 95,  atk: 14, def: 4, spd: 16, role: 'Thief' },
  sela:  { cls: 'ranger',  name: 'Sela',  face: '🔫', max: 105, atk: 15, def: 5, spd: 11, role: 'Ranger' },
  vance: { cls: 'gambler', name: 'Vance', face: '🎲', max: 130, atk: 17, def: 5, spd: 10, role: 'Gambler' },
};
// Enemy moves: [name, power, kind]. kind: 'aoe' hits everyone, 'windup' telegraphs, 'big' is the telegraphed hit, 'cheat' steals Fortune
const ENEMIES = {
  golem:  { name: 'Stone Golem', face: '🗿', max: 700, atk: 30, def: 8, spd: 7, cycle: [['Slam', 1], ['Slam', 1], ['Rumble', 0, 'windup'], ['QUAKE', 1.7, 'aoe big']] },
  bandit: { name: 'Bandit', face: '🥷', max: 130, atk: 22, def: 3, spd: 12, moves: [['Slash', 1], ['Slash', 1], ['Dirty Kick', 1.3]] },
  brute:  { name: 'Brute', face: '👹', max: 300, atk: 26, def: 5, spd: 9, cycle: [['Punch', 1], ['Punch', 1], ['Wind up', 0, 'windup'], ['HAYMAKER', 2.2, 'big']] },
  duelist:{ name: 'Duelist', face: '🤺', max: 230, atk: 22, def: 4, spd: 15, cycle: [['Slash', 1], ['Feint', 0.6], ['En garde', 0, 'windup'], ['LUNGE', 2.6, 'big']] },
  wyrm:   { name: 'Fire Wyrm', face: '🐉', max: 280, atk: 23, def: 5, spd: 10, weak: { ice: 1.6, fire: 0.4 }, cycle: [['Bite', 1], ['Ember', 1.2], ['Inhale', 0, 'windup'], ['INFERNO', 2.3, 'big']] },
  shark:  { name: 'Card Shark', face: '🃏', max: 200, atk: 19, def: 4, spd: 10, cycle: [['Deal', 1], ['Cheat', 0.5, 'cheat'], ['Shuffle', 0, 'windup'], ['ROYAL FLUSH', 2, 'big']] },
};
const BATTLES = {
  party: { title: 'Party', label: 'Party battle', sub: 'All four vs a Stone Golem that telegraphs QUAKE.', heroes: ['kai', 'wren', 'sela', 'vance'], foes: ['bandit', 'golem', 'bandit'] },
  kai:   { title: 'Kai solo', label: '👊 Kai vs Brute', sub: 'Build Chi, Meditate to heal, Palm Strike at full Chi breaks the wind-up.', heroes: ['kai'], foes: ['brute'] },
  wren:  { title: 'Wren solo', label: '🗡️ Wren vs Duelist', sub: 'Save 2 charges for a perfect dodge on LUNGE, then crit the exposed Duelist.', heroes: ['wren'], foes: ['duelist'] },
  sela:  { title: 'Sela solo', label: '🔫 Sela vs Fire Wyrm', sub: 'Ice Rounds hit hard and break INFERNO. Mend yourself when low.', heroes: ['sela'], foes: ['wyrm'] },
  vance: { title: 'Vance solo', label: '🎲 Vance vs Card Shark', sub: 'Backfires fill Fortune. The Shark cheats and steals it. Know when to go All In.', heroes: ['vance'], foes: ['shark'] },
};

// actions: target 'enemy' | 'ally' (any living hero, incl. self) | 'other' (ally not self) | 'self' | 'allEnemies'; w = turn weight (lower = acts again sooner)
const GUARD = { id: 'guard', n: '🛡 Guard', t: 'self', d: 'Take less damage until your next turn and gain 1 ' };
const RES = { monk: 'Chi', thief: 'charge', ranger: 'mana', gambler: 'Fortune' };
const ACTIONS = {
  monk: [
    { id: 'flurry', n: 'Flurry', t: 'enemy', d: 'Two quick punches. +1 Chi.' },
    { id: 'palm', n: 'Palm Strike', t: 'enemy', d: 'Spends all Chi for a big hit. At full Chi it breaks a wind-up.' },
    { id: 'meditate', n: 'Meditate', t: 'self', w: 0.8, d: 'Heal yourself and gain 1 Chi. Quick action.' },
    { id: 'share', n: 'Share Chi', t: 'other', party: true, chi: 1, d: 'Spend 1 Chi to heal an ally.' },
  ],
  thief: [
    { id: 'twin', n: 'Twin Slash', t: 'enemy', d: 'Two hits that can crit. Exposed targets get crit more.' },
    { id: 'shred', n: 'Shred', t: 'enemy', d: 'Light hit that Exposes the target (takes more damage, easier to crit).' },
    { id: 'mark', n: 'Mark', t: 'enemy', w: 0.6, party: true, d: 'The target can only attack Wren, even its all-party attacks. Quick action.' },
    { id: 'dance', n: 'Blade Dance', t: 'enemy', needCharge: true, d: 'Spend all charges: one hit per charge plus one.' },
  ],
  ranger: [
    { id: 'shot', n: 'Shoot', t: 'enemy', d: 'Plain shot. +1 extra mana.' },
    { id: 'fire', n: '🔥 Fire Round', t: 'enemy', mp: true, d: 'Burns the target for 3 turns.' },
    { id: 'ice', n: '❄ Ice Round', t: 'enemy', mp: true, d: 'Delays the target and breaks a wind-up.' },
    { id: 'mend', n: '💚 Mend Round', t: 'ally', mp: true, d: 'Shoot an ally, or yourself, to heal.' },
  ],
  gambler: [
    { id: 'coin', n: 'Coin Flip', t: 'enemy', d: 'Heads: bonus damage. Tails: weak hit, +1 Fortune.' },
    { id: 'dice', n: 'Roll the Dice', t: 'enemy', d: 'Damage from 2 dice. Doubles stun and break wind-ups. Low roll: +1 Fortune.' },
    { id: 'wild', n: 'Wild Card', t: 'enemy', d: 'Random: big hit, party heal, party power-up, or a Joker that hurts you (+2 Fortune).' },
    { id: 'don', n: 'Double or Nothing', t: 'enemy', d: 'Hit lands: double damage. Miss: you get hurt, +2 Fortune. Better odds on Exposed foes.' },
    { id: 'loaded', n: 'Loaded Dice', t: 'self', w: 0.6, d: 'Spend Fortune: your next roll is a guaranteed jackpot. Quick action.' },
    { id: 'allin', n: 'All In', t: 'allEnemies', d: 'Spend all Fortune. More Fortune = better odds of a jackpot that hits all foes and heals the party.' },
  ],
};

for (const c in ACTIONS) ACTIONS[c].push({ ...GUARD, d: GUARD.d + RES[c] + '.' });

// ---------- State ----------
let units = [], now = 0, battle = 'party', logLines = [], pending = null, sel = null, solo = false;
const $ = id => document.getElementById(id);
const wait = ms => new Promise(r => setTimeout(r, ms * S.speed));
const alive = side => units.filter(u => u.side === side && u.hp > 0);
const delay = u => 100 / u.spd;
const rnd = n => Math.floor(Math.random() * n);

function startBattle(key) {
  battle = key; const B = BATTLES[key]; solo = B.heroes.length === 1;
  const party = B.heroes.map((h, i) => ({ ...HEROES[h], art: h, id: 'p' + i, side: 'party', hp: HEROES[h].max,
    chi: 0, charges: 0, mp: 3, fortune: 0, guard: false, healStreak: 0, lucky: false, riposte: false, power: 0 }));
  const foes = B.foes.map((k, i) => {
    const e = ENEMIES[k], max = Math.round(e.max * S.enemyHp);
    const n = B.foes.filter(x => x === k).length, tag = n > 1 ? 'AB'[B.foes.slice(0, i).filter(x => x === k).length] : '';
    return { ...e, name: e.name + (tag ? ' ' + tag : ''), tag, id: 'e' + i, side: 'enemy', hp: max, max, burnT: 0, exposed: 0, marked: 0, step: 0, intent: null, charged: false, delayed: false };
  });
  units = [...party, ...foes];
  units.forEach((u, i) => { u.ct = delay(u) * (0.3 + 0.1 * (i % 3)); u.idx = i; });
  foes.forEach(pickIntent);
  now = 0; logLines = []; pending = null; sel = null;
  $('enemies').style.gridTemplateColumns = `repeat(${foes.length}, minmax(0, ${foes.length > 1 ? '1fr' : '140px'}))`;

}
function addFortune(u, n) { u.fortune = Math.min(S.fortuneMax, u.fortune + n); pop(u, `+${n}🍀`, 'info'); }

function canUse(u, a) {
  if (a.party && solo) return false;
  if (a.chi && u.chi < a.chi) return false;
  if (a.needCharge && u.charges < 1) return false;
  if (a.mp && u.mp < S.roundCost) return false;
  if (a.id === 'loaded' && (u.fortune < S.loadedCost || u.lucky)) return false;
  if (a.id === 'allin' && u.fortune < 1 && !u.lucky) return false;
  if (a.id === 'palm' && u.chi < 1) return false;
  return true;
}
function validTargets(u, a) {
  if (a.t === 'enemy') return alive('enemy');
  if (a.t === 'ally') return alive('party');
  if (a.t === 'other') return alive('party').filter(p => p !== u);
  return [];
}

function gainRes(u) {
  if (u.cls === 'monk') u.chi = Math.min(S.chiMax, u.chi + 1);
  if (u.cls === 'thief') u.charges = Math.min(S.chargeMax, u.charges + 1);
  if (u.cls === 'ranger') u.mp = Math.min(S.mpMax, u.mp + 1);
  if (u.cls === 'gambler') u.fortune = Math.min(S.fortuneMax, u.fortune + 1);
}
// Heals in a row get weaker so a fight can't stall on heal spam; attacking resets it
function healPower(u) { return Math.pow(S.healFade, u.healStreak++); }
function doAction(u, a, tgt) {
  if (a.mp) u.mp -= S.roundCost;
  if ((a.t === 'enemy' || a.t === 'allEnemies') && a.id !== 'mark') u.healStreak = 0;
  switch (a.id) {
    // Kai
    case 'flurry': damage(u, tgt, 0.55); damage(u, tgt, 0.55, { lag: 250 }); u.chi = Math.min(S.chiMax, u.chi + 1); break;
    case 'palm': { const full = u.chi >= S.chiMax; damage(u, tgt, 0.8 + S.chiPower * u.chi); if (full) breakWindup(tgt); u.chi = 0; break; }
    case 'guard': u.guard = true; gainRes(u); log(`${u.name} guards.`); break;
    case 'meditate': heal(u, u.max * S.medHeal * healPower(u)); u.chi = Math.min(S.chiMax, u.chi + 1); log('Kai meditates.'); break;
    case 'share': u.chi -= 1; heal(tgt, S.shareHeal); log(`Kai shares Chi with ${tgt.name}.`); break;
    // Wren
    case 'twin': damage(u, tgt, 0.6, { crit: rollCrit(u, tgt) }); damage(u, tgt, 0.6, { crit: rollCrit(u, tgt), lag: 250 }); break;
    case 'shred': damage(u, tgt, 0.5, { crit: rollCrit(u, tgt) }); if (tgt.hp > 0) { tgt.exposed = 3; pop(tgt, 'EXPOSED', 'info'); } break;
    case 'mark': tgt.marked = S.markTurns; pop(tgt, 'MARKED', 'info'); log(`${tgt.name} is Marked and will only attack Wren.`); break;
    case 'dance': { const n = u.charges + 1; for (let i = 0; i < n; i++) damage(u, tgt, 0.55, { crit: rollCrit(u, tgt), lag: i * 200 }); u.charges = 0; log(`Blade Dance x${n}!`); break; }
    // Sela
    case 'shot': damage(u, tgt, 1); u.mp = Math.min(S.mpMax, u.mp + 1); break;
    case 'fire': damage(u, tgt, 1, { el: 'fire' }); if (tgt.hp > 0) tgt.burnT = 3; break;
    case 'ice': damage(u, tgt, 1, { el: 'ice' }); if (tgt.hp > 0) { pushBack(tgt, S.iceDelay); breakWindup(tgt); } break;
    case 'mend': heal(tgt, S.mendHeal * healPower(u)); log(`Sela fires a Mend Round at ${tgt === u ? 'herself' : tgt.name}.`); break;
    // Vance
    case 'coin': if (takeLuck(u) || Math.random() < 0.5) { log('Heads!'); damage(u, tgt, 1.4); } else { log('Tails...'); damage(u, tgt, 0.6); addFortune(u, 1); } break;
    case 'dice': {
      let a1 = rnd(6) + 1, a2 = rnd(6) + 1;
      if (takeLuck(u)) a1 = a2 = 6;
      log(`🎲 ${a1} + ${a2}${a1 === a2 ? ' DOUBLES!' : ''}`);
      damage(u, tgt, (a1 + a2) / 7);
      if (a1 === a2 && tgt.hp > 0) { pushBack(tgt, S.stunDelay); pop(tgt, 'STUN', 'info'); breakWindup(tgt); }
      if (a1 + a2 <= 4) addFortune(u, 1);
      break;
    }
    case 'wild': {
      const lucky = takeLuck(u), hurt = alive('party').some(p => p.hp / p.max < 0.4);
      const pick = lucky ? (hurt ? 'heal' : 'hit') : Math.random() < S.jokerOdds ? 'joker' : ['hit', 'heal', 'power'][rnd(3)];
      if (pick === 'hit') { log('🃏 Ace of Spades: big hit!'); damage(u, tgt, 2.2); }
      if (pick === 'heal') { log('🃏 Queen of Hearts: party heal!'); alive('party').forEach(p => heal(p, S.wildHeal)); }
      if (pick === 'power') { log('🃏 King of Clubs: party power up!'); alive('party').forEach(p => { p.power = 3; pop(p, 'POWER', 'info'); }); }
      if (pick === 'joker') { log('🃏 Joker! It backfires.'); damage({ ...u, side: 'enemy' }, u, 0.8); addFortune(u, 2); }
      break;
    }
    case 'don':
      if (takeLuck(u) || Math.random() < S.donOdds + (tgt.exposed > 0 ? 0.25 : 0)) { log('Double!'); damage(u, tgt, 2, { crit: false, mult: 1.2 }); }
      else { log('Nothing... Vance takes the hit.'); damage({ ...u, side: 'enemy' }, u, 0.9); addFortune(u, 2); }
      break;
    case 'loaded': u.fortune -= S.loadedCost; u.lucky = true; log('Vance loads the dice.'); break;
    case 'allin': {
      const odds = u.fortune / S.fortuneMax, jackpot = takeLuck(u) || Math.random() < odds;
      u.fortune = 0;
      if (jackpot) { log('ALL IN: JACKPOT!'); alive('enemy').forEach((e, i) => damage(u, e, 1.8, { lag: i * 150 })); alive('party').forEach(p => heal(p, S.wildHeal, true)); }
      else { log(`All In misses (${Math.round(odds * 100)}% odds).`); alive('enemy').forEach(e => damage(u, e, 0.6)); }
      break;
    }
  }
  return a.w || 1;
}

// ---------- Enemy AI ----------
function pickIntent(e) {
  if (e.cycle) { e.intent = e.cycle[e.step % e.cycle.length]; e.step++; }
  else e.intent = e.moves[rnd(e.moves.length)];
}
function pickVictim(e) {
  const p = alive('party');
  if (e.marked > 0) { const w = p.find(x => x.cls === 'thief'); if (w) return w; }
  return p[rnd(p.length)];
}
async function enemyTurn(e) {
  if (e.burnT > 0) {
    const d = Math.round(S.burnDmg * S.partyDmg); e.hp = Math.max(0, e.hp - d); pop(e, d, 'dmg'); sparks(center(e), COLORS.fire, 14, 3); e.burnT--;
    render(); await wait(400);
    if (e.hp <= 0) { log(`${e.name} burns away!`); return; }
  }
  e.delayed = false;
  const [name, power, kind = ''] = e.intent;
  if (kind === 'windup') { e.charged = true; log(`⚠ ${e.name} gets ready for a huge attack!`); fxAura(e, '#ef4444'); shake(4); }
  else {
    const marked = e.marked > 0 && alive('party').some(p => p.cls === 'thief');
    if (kind.includes('big')) { flash(0.5, '#300'); fxAura(e, '#ef4444'); await wait(350); }
    if (kind.includes('aoe') && !marked) {
      log(`${e.name} uses ${name}!`);
      const back = await lunge(e, null);
      alive('party').forEach((p, i) => damage(e, p, power, { lag: i * 60 }));
      if (kind.includes('big')) { flash(0.7); shake(18); }
      await wait(90); back();
    } else {
      const t = pickVictim(e);
      log(`${e.name} uses ${name} on ${t.name}${kind.includes('aoe') ? ' (Marked)' : ''}.`);
      const back = await lunge(e, t);
      damage(e, t, power);
      if (kind.includes('big')) { flash(0.7); shake(18); }
      await wait(90); back();
      if (kind === 'cheat' && t.cls === 'gambler' && t.fortune > 0) { const s = 1; t.fortune -= s; log(`The Shark steals ${s} Fortune!`); }
    }
    e.charged = false;
    if (e.marked > 0) e.marked--;
  }
  if (e.exposed > 0) e.exposed--;
  pickIntent(e);
}

// ---------- Player input ----------
function startOfTurn(u) {
  u.guard = false;
  if (u.cls === 'thief') u.charges = Math.min(S.chargeMax, u.charges + 1);
  if (u.cls === 'ranger') u.mp = Math.min(S.mpMax, u.mp + 1);
}
function showMenu(u) {
  const info = { monk: `Chi ${u.chi}/${S.chiMax}`, thief: `◆${u.charges} charges · dodge ${dodgeTier(u)}`, ranger: `Mana ${u.mp}/${S.mpMax}`, gambler: `Fortune ${u.fortune}/${S.fortuneMax}` }[u.cls];
  $('who').innerHTML = `${u.face} ${u.name} the ${u.role} <span>${info}</span>`;
  $('desc').textContent = 'Pick an action.';
  const list = ACTIONS[u.cls].filter(a => !(a.party && solo));
  $('acts').style.gridTemplateColumns = list.length > 4 ? '1fr 1fr 1fr' : '1fr 1fr';
  $('acts').replaceChildren(...list.map(a => {
    const b = document.createElement('button');
    b.textContent = a.n + (a.mp ? ` (${S.roundCost}MP)` : a.id === 'loaded' ? ` (${S.loadedCost}🍀)` : '');
    b.disabled = !canUse(u, a);
    b.onclick = () => chooseAction(u, a, b);
    return b;
  }));
}
function chooseAction(u, a, btn) {
  document.querySelectorAll('#acts button').forEach(b => b.classList.remove('sel'));
  $('desc').textContent = a.d;
  if (a.t === 'self' || a.t === 'allEnemies') { sel = null; finish(a, null); return; }
  const targets = validTargets(u, a);
  if (targets.length === 1 && solo) { sel = null; finish(a, targets[0]); return; }
  btn.classList.add('sel');
  sel = { u, a };
  $('desc').textContent = a.d + ' Tap a target.';
  render();
}
function pickTarget(t) {
  if (!sel || !validTargets(sel.u, sel.a).includes(t)) return;
  const { a } = sel; sel = null; finish(a, t);
}
function finish(a, t) { $('acts').replaceChildren(); if (pending) { const p = pending; pending = null; p({ a, t }); } }

// ---------- Main loop ----------
async function loop() {
  const myUnits = units;
  while (units === myUnits) {
    const u = nextActor(); now = u.ct; u.acting = true;
    let w = 1;
    if (u.side === 'enemy') {
      render();
      $('who').innerHTML = `${u.face} ${u.name}'s turn`; $('acts').replaceChildren(); $('desc').textContent = '';
      await wait(500); if (units !== myUnits) return;
      await enemyTurn(u);
    } else {
      startOfTurn(u); render(); showMenu(u);
      const { a, t } = await new Promise(r => pending = r);
      if (units !== myUnits) return;
      const hits = a.t === 'enemy' || a.t === 'allEnemies';
      const back = hits ? await lunge(u, t, u.cls === 'ranger') : (fxAura(u, COLORS[u.cls]), () => {});
      w = doAction(u, a, t);
      await wait(hits ? 90 : 0); back();
      if (u.power > 0 && a.id !== 'wild') u.power--;
    }
    u.acting = false;
    if (u.hp > 0 && u.ct === now) u.ct += delay(u) * w;
    else if (u.hp > 0) u.ct = Math.max(u.ct, now + delay(u) * w);
    render(); await wait(700);
    if (units !== myUnits) return;
    if (!alive('enemy').length) return overlay('Victory!', BATTLES[battle].label + ' cleared.', [['Pick another battle', showSelect, true], ['Replay', () => startBattle(battle)]]);
    if (!alive('party').length) return overlay('Defeat', solo ? 'Try a different plan, or tune it with ⚙.' : 'The party has fallen.', [['Retry', () => startBattle(battle), true], ['Pick another battle', showSelect]]);
  }
}
function overlay(t, p, btns) {
  $('ovT').textContent = t; $('ovP').textContent = p;
  $('ovBtns').replaceChildren(...btns.map(([label, fn, main, sub]) => {
    const b = document.createElement('button'); b.className = main ? 'main' : '';
    b.innerHTML = label + (sub ? `<small>${sub}</small>` : ''); b.onclick = fn; return b;
  }));
  $('over').classList.add('show');
}
function showSelect() {
  pending = null; units = units.slice(); // stops the running loop
  overlay('Choose a battle', 'Each hero has a solo fight that teaches their trick.',
    Object.keys(BATTLES).map((k, i) => [BATTLES[k].label, () => startBattle(k), i === 0, BATTLES[k].sub]));
}

showSelect();
</script>
</body>
</html>
