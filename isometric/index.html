<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Isometric Brawler</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:linear-gradient(#1b1030,#3a1a4a 60%,#6a2a4a);font-family:system-ui,sans-serif;color:#fff;touch-action:none;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
  #zone{position:fixed;left:0;top:0;width:55%;height:100%;z-index:5}
  .joy{position:fixed;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:3px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08);display:none;z-index:6;pointer-events:none}
  .joy i{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:rgba(255,255,255,.5);border:3px solid #fff}
  .btn{position:fixed;z-index:6;border-radius:50%;border:4px solid #fff;color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;text-shadow:0 2px 0 rgba(0,0,0,.4);opacity:.85;touch-action:none}
  .btn.down{transform:scale(.92);opacity:1}
  #bAtk{right:max(24px,env(safe-area-inset-right));bottom:max(28px,env(safe-area-inset-bottom));width:110px;height:110px;background:#d8344a;font-size:20px}
  #bDash{right:calc(max(24px,env(safe-area-inset-right)) + 124px);bottom:max(24px,env(safe-area-inset-bottom));width:76px;height:76px;background:#2f8fd8;font-size:15px}
  #bDash.cd{filter:grayscale(.8) brightness(.7)}
  #gear,#home{position:fixed;top:10px;z-index:9;width:44px;height:44px;border-radius:12px;border:2px solid rgba(255,255,255,.5);background:rgba(20,10,35,.6);color:#fff;font-size:22px;display:flex;align-items:center;justify-content:center;text-decoration:none}
  #gear{right:10px}#home{left:10px}
  #panel{position:fixed;top:60px;right:10px;width:min(300px,86vw);max-height:78vh;overflow-y:auto;z-index:9;background:rgba(20,10,35,.92);border:2px solid rgba(255,255,255,.3);border-radius:12px;padding:8px 12px 12px;display:none;touch-action:pan-y;font-size:13px}
  #panel.open{display:block}
  #panel summary{font-weight:700;padding:8px 0;cursor:pointer;color:#ffcf6b}
  #panel label{display:flex;justify-content:space-between;margin-top:6px}
  #panel label b{font-weight:500;color:#aef}
  #panel input[type=range]{width:100%;margin:2px 0 6px;touch-action:pan-y}
  #panel button{margin-top:10px;width:100%;padding:10px;border-radius:8px;border:0;background:#d8344a;color:#fff;font-weight:700}
  #hud{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:4;display:flex;gap:8px;pointer-events:none}
  #hud i{width:16px;height:16px;border-radius:50%;border:2px solid #fff;background:rgba(255,255,255,.1);transition:.08s}
  #hud i.on{background:#ffcf6b;transform:scale(1.35);box-shadow:0 0 10px #ffcf6b}
  .dmg{position:fixed;z-index:3;pointer-events:none;font-weight:900;font-size:22px;color:#fff;text-shadow:0 2px 0 #b01030,0 0 6px #000;animation:fl .7s ease-out forwards;transform:translate(-50%,-50%)}
  .dmg.big{font-size:32px;color:#ffcf6b}
  @keyframes fl{to{transform:translate(-50%,-150%) scale(1.2);opacity:0}}
  #hint{position:fixed;bottom:6px;left:0;right:0;text-align:center;font-size:12px;opacity:.5;pointer-events:none;z-index:3}
  @media (pointer:coarse){#hint{display:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<a id="home" href="../">&#8592;</a>
<button id="gear" aria-label="Settings">&#9881;</button>
<div id="panel"></div>
<div id="hud"><i></i><i></i><i></i></div>
<div id="zone"></div>
<div class="joy" id="joy"><i id="knob"></i></div>
<div class="btn" id="bDash">DASH</div>
<div class="btn" id="bAtk">ATTACK</div>
<div id="hint">WASD / arrows move &middot; J attack &middot; Space dash</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
if(!window.THREE){document.body.innerHTML='<p style="padding:24px">Could not load three.js. Check your connection.</p>';}
else (function(){
'use strict';
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const angDiff=(a,b)=>Math.atan2(Math.sin(b-a),Math.cos(b-a));

// ---------- tunables ----------
const DEF={moveSpeed:7,accel:60,dashDist:5,dashCd:.6,comboWindow:.45,lunge:1,damage:20,hitStop:70,shake:1,knock:8,zoom:7,angle:50,follow:.5,outline:.04,light:1};
const CFG=[
 ['Movement',[['moveSpeed','Move speed',3,14,.1],['accel','Acceleration',10,150,1],['dashDist','Dash distance',2,12,.1],['dashCd','Dash cooldown (s)',0,2,.05]]],
 ['Combat',[['comboWindow','Combo window (s)',.1,1.2,.01],['lunge','Attack lunge',0,3,.05],['damage','Attack damage',5,60,1],['knock','Knockback force',0,20,.5]]],
 ['Impact',[['hitStop','Hit-stop (ms)',0,200,5],['shake','Screen shake',0,3,.05]]],
 ['Camera',[['zoom','Zoom (lower = closer)',5,16,.1],['angle','Camera angle',20,80,1],['follow','Follow smoothness',0,1,.01]]],
 ['Look',[['outline','Outline thickness',0,.1,.002],['light','Light intensity',.3,2,.05]]]
];
const S=Object.assign({},DEF);
try{const j=JSON.parse(localStorage.getItem('iso-brawler')||'{}');for(const k in DEF)if(typeof j[k]==='number')S[k]=j[k];}catch(e){}
const save=()=>{try{localStorage.setItem('iso-brawler',JSON.stringify(S));}catch(e){}};

// ---------- renderer / scene ----------
const canvas=$('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();
const camera=new THREE.OrthographicCamera(-1,1,1,-1,-80,120);
const hemi=new THREE.HemisphereLight(0xbfc8ff,0x5a3a6a,.75);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xfff0d8,1);
sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.bias=-.0006;
Object.assign(sun.shadow.camera,{left:-16,right:16,top:16,bottom:-16,near:1,far:60});
scene.add(sun,sun.target);

// toon gradient
const gt=new THREE.DataTexture(new Uint8Array([80,140,205,255]),4,1,THREE.LuminanceFormat);
gt.minFilter=gt.magFilter=THREE.NearestFilter;gt.generateMipmaps=false;gt.needsUpdate=true;
const rimU={value:1};
function patchRim(m){m.onBeforeCompile=s=>{s.uniforms.rimS=rimU;s.fragmentShader='uniform float rimS;\n'+s.fragmentShader.replace('#include <dithering_fragment>','#include <dithering_fragment>\n float rimF=1.0-saturate(dot(normalize(vViewPosition),normal));gl_FragColor.rgb+=vec3(.55,.7,1.)*smoothstep(.6,.68,rimF)*rimS*.3;');};return m;}
const matCache={};
function toon(color,own){
  if(!own&&matCache[color])return matCache[color];
  const m=patchRim(new THREE.MeshToonMaterial({color,gradientMap:gt}));
  if(!own)matCache[color]=m;return m;
}
const thickU={value:S.outline};
const outMats=[0,1,2].map(mode=>new THREE.ShaderMaterial({
  uniforms:{thick:thickU},side:THREE.BackSide,defines:{MODE:mode},
  vertexShader:`uniform float thick;void main(){vec3 p=position;
  #if MODE==0
    p+=normal*thick;
  #elif MODE==1
    p+=sign(position)*thick;
  #else
    float l=length(position.xz);if(l>1e-4)p.xz+=position.xz/l*thick;p.y+=sign(position.y)*thick;
  #endif
  gl_Position=projectionMatrix*modelViewMatrix*vec4(p,1.);}`,
  fragmentShader:'void main(){gl_FragColor=vec4(.07,.04,.12,1.);}'
}));
// mode: 0 smooth (sphere/capsule), 1 box, 2 cylinder
function mk(geo,color,mode,opt){
  opt=opt||{};
  const m=new THREE.Mesh(geo,opt.mat||toon(color));
  m.castShadow=opt.shadow!==false;m.receiveShadow=true;
  if(opt.outline!==false){const o=new THREE.Mesh(geo,outMats[mode||0]);m.add(o);}
  return m;
}
const box=(w,h,d,c,o)=>mk(new THREE.BoxGeometry(w,h,d),c,1,o);
const cyl=(r1,r2,h,c,o,seg)=>mk(new THREE.CylinderGeometry(r1,r2,h,seg||20),c,2,o);
const sph=(r,c,o)=>mk(new THREE.SphereGeometry(r,16,12),c,0,o);

// ---------- arena ----------
const ARENA_R=13;
const world=new THREE.Group();scene.add(world);
const slab=cyl(14,14,1.2,0x8a7f9a,null,48);slab.position.y=-.6;world.add(slab);
const under=mk(new THREE.ConeGeometry(14,10,48),0x5b4a6a,0);under.position.y=-6.2;under.rotation.x=Math.PI;world.add(under);
const disc=(r,y,c)=>{const m=cyl(r,r,.06,c,{outline:false,shadow:false},48);m.position.y=y;world.add(m);return m;};
disc(13.2,.02,0xa89cb8);disc(9.5,.05,0xb9aec7);disc(4,.08,0x8e7fa6);disc(3.3,.11,0xc9bfd6);
const rocks=[];
for(let i=0;i<7;i++){
  const r=new THREE.Mesh(new THREE.IcosahedronGeometry(.5+Math.random()*1.1,0),toon(0x6b5a7c));
  r.castShadow=false;r.add(new THREE.Mesh(r.geometry,outMats[0]));
  const a=i/7*Math.PI*2+.3,d=18+Math.random()*6;
  r.position.set(Math.cos(a)*d,-4+Math.random()*10-3,Math.sin(a)*d);r.userData={ph:Math.random()*6,y0:r.position.y};
  world.add(r);rocks.push(r);
}

// obstacles: {t:'c',x,z,r} or {t:'b',x,z,hw,hd}
const obstacles=[];
for(let i=0;i<6;i++){
  const a=(i/6)*Math.PI*2+Math.PI/6,x=Math.cos(a)*9.2,z=Math.sin(a)*9.2,h=i%3===0?2.2:3.8;
  const g=new THREE.Group();g.position.set(x,0,z);
  const b=box(2.0,.4,2.0,0x9a8fae);b.position.y=.2;
  const s=cyl(.8,.8,h,0xc7bcd6);s.position.y=.4+h/2;
  const c=box(1.8,.4,1.8,0x9a8fae);c.position.y=.4+h+.2;
  const ring=cyl(.86,.86,.18,0xe0b04a);ring.position.y=1.2;
  g.add(b,s,c,ring);world.add(g);obstacles.push({t:'c',x,z,r:1.0});
}
[[-3,-7,.3],[5.5,-3.5,0],[-7.5,4,.7],[6.5,6.5,.2],[6.5,5.4,0]].forEach(([x,z,ry],i)=>{
  const s=i===4?.9:1.3;
  const c=box(s,s,s,0xb8864a);c.position.set(x,s/2,z);c.rotation.y=ry;
  const band=box(s+.04,.18,s+.04,0x6a4a2a,{outline:false});band.position.y=0;c.add(band);
  world.add(c);obstacles.push({t:'b',x,z,hw:s*.62,hd:s*.62,ry:0});
});

// resolve circle (x,z,r) against obstacles + arena; skip = dummy to ignore
function resolve(p,r,skip){
  for(const o of obstacles){
    if(o.t==='c'){
      const dx=p.x-o.x,dz=p.z-o.z,d=Math.hypot(dx,dz),m=r+o.r;
      if(d<m&&d>1e-5){p.x=o.x+dx/d*m;p.z=o.z+dz/d*m;}
    }else{
      const cx=clamp(p.x,o.x-o.hw,o.x+o.hw),cz=clamp(p.z,o.z-o.hd,o.z+o.hd);
      let dx=p.x-cx,dz=p.z-cz,d=Math.hypot(dx,dz);
      if(d<r){
        if(d>1e-5){p.x=cx+dx/d*r;p.z=cz+dz/d*r;}
        else{p.x+=r;}
      }
    }
  }
  for(const d of dummies){
    if(d===skip||d.dead)continue;
    const dx=p.x-d.x,dz=p.z-d.z,l=Math.hypot(dx,dz),m=r+.7;
    if(l<m&&l>1e-5){p.x=d.x+dx/l*m;p.z=d.z+dz/l*m;}
  }
  const l=Math.hypot(p.x,p.z),mx=ARENA_R-r;
  if(l>mx){p.x*=mx/l;p.z*=mx/l;}
}

// ---------- player ----------
const P={x:0,z:6,vx:0,vz:0,face:Math.PI,state:'free',t:0,step:0,comboT:0,hitDone:false,hitT:0,dashT:0,dashCd:0,dx:0,dz:0,ph:0,lunged:0};
const player=new THREE.Group();world.add(player);
const model=new THREE.Group();player.add(model);
const body=cyl(.38,.46,.8,0xc0283c,null,16);body.position.y=.75;model.add(body);
const belt=cyl(.47,.47,.12,0xe0b04a,{outline:false},16);belt.position.y=.62;model.add(belt);
const head=sph(.34,0xf2cfa8);head.position.y=1.5;model.add(head);
const hair=sph(.37,0xf2f2ff);hair.scale.set(1,.7,1);hair.position.set(0,1.64,-.05);model.add(hair);
const eyeM=new THREE.MeshBasicMaterial({color:0x1a0a20});
[-.12,.12].forEach(x=>{const e=new THREE.Mesh(new THREE.SphereGeometry(.05,8,6),eyeM);e.position.set(x,1.5,.31);model.add(e);});
const scarf=box(.9,.12,.12,0x2a2a6a);scarf.position.set(0,1.2,0);scarf.scale.z=3;model.add(scarf);
const feet=[-1,1].map(s=>{const f=sph(.15,0x2a1a30);f.scale.set(1,.7,1.4);f.position.set(s*.2,.12,0);model.add(f);return f;});
const pivot=new THREE.Group();pivot.position.set(.35,.85,0);model.add(pivot);
const inner=new THREE.Group();pivot.add(inner);
const blade=box(.1,.05,1.3,0xe8f4ff);blade.position.z=1.0;
const guard=box(.4,.08,.1,0xe0b04a);guard.position.z=.35;
const hilt=box(.08,.08,.3,0x6a2a2a);hilt.position.z=.18;
inner.add(blade,guard,hilt);
function sector(a0,a1,r0,r1,color){
  const g=new THREE.RingGeometry(r0,r1,32,1,a0-Math.PI/2,a1-a0);
  const m=new THREE.Mesh(g,new THREE.MeshBasicMaterial({color,transparent:true,opacity:0,side:THREE.DoubleSide,depthWrite:false}));
  m.rotation.x=-Math.PI/2;m.position.y=.9;m.visible=false;player.add(m);return m;
}
const trailSmall=sector(-1.0,1.0,.7,2.3,0xbfe6ff);
const trailBig=sector(-Math.PI,Math.PI,.8,3.1,0xffcf6b);
// player lives in a facing group
const STEPS=[
  {dur:.30,hitAt:.38,arc:2.1,range:2.5,dmg:1,lunge:1,from:1.35,to:-1.35,trail:trailSmall},
  {dur:.30,hitAt:.38,arc:2.1,range:2.5,dmg:1,lunge:1,from:-1.35,to:1.35,trail:trailSmall},
  {dur:.52,hitAt:.50,arc:3.6,range:3.1,dmg:2,lunge:1.6,from:0,to:0,trail:trailBig}
];

// ---------- dummies ----------
const dummies=[];
[[4.5,-1],[-4.5,1.5],[1,-7],[-5,-5],[8,3]].forEach(([x,z])=>{
  const mats=[];
  const own=c=>{const m=toon(c,true);mats.push(m);return m;};
  const g=new THREE.Group();
  const add=(mesh)=>{g.add(mesh);return mesh;};
  add(cyl(.7,.8,.3,0x6a5a7a,{mat:own(0x6a5a7a)})).position.y=.15;
  add(cyl(.12,.12,1.4,0x7a5a3a,{mat:own(0x7a5a3a)})).position.y=.9;
  add(cyl(.45,.45,1.0,0xd8b878,{mat:own(0xd8b878)})).position.y=1.4;
  add(cyl(.47,.47,.16,0xd8344a,{mat:own(0xd8344a),outline:false})).position.y=1.45;
  add(box(1.1,.14,.14,0x7a5a3a,{mat:own(0x7a5a3a)})).position.y=1.7;
  add(sph(.32,0xe8c888,{mat:own(0xe8c888)})).position.y=2.2;
  g.position.set(x,0,z);world.add(g);
  dummies.push({g,mats,x,z,hx:x,hz:z,kx:0,kz:0,hp:100,flash:0,rx:0,rz:0,rxv:0,rzv:0,dead:false,t:0,pop:1});
});

// ---------- fx ----------
const parts=[];
const pgeo=new THREE.BoxGeometry(.16,.16,.16);
for(let i=0;i<50;i++){const m=new THREE.Mesh(pgeo,new THREE.MeshBasicMaterial({color:0xffffff}));m.visible=false;scene.add(m);parts.push({m,v:new THREE.Vector3(),life:0});}
let pi_=0;
function burst(x,y,z,color,n,spd){
  for(let i=0;i<n;i++){
    const p=parts[pi_++%parts.length];
    p.m.visible=true;p.m.material.color.setHex(color);p.m.position.set(x,y,z);
    const a=Math.random()*6.283;p.v.set(Math.cos(a)*spd*Math.random(),2+Math.random()*spd,Math.sin(a)*spd*Math.random());
    p.life=.45+Math.random()*.2;p.m.scale.setScalar(1);
  }
}
const tmpV=new THREE.Vector3();
function dmgText(x,y,z,txt,big){
  tmpV.set(x,y,z).project(camera);
  const e=document.createElement('div');e.className='dmg'+(big?' big':'');e.textContent=txt;
  e.style.left=((tmpV.x+1)/2*innerWidth)+'px';e.style.top=((1-tmpV.y)/2*innerHeight)+'px';
  document.body.appendChild(e);setTimeout(()=>e.remove(),700);
}
let hitStop=0,shake=0;

// ---------- input ----------
const inp={x:0,y:0,atk:0,t:0,dash:false};
let clk=0;
const keys={};
addEventListener('keydown',e=>{
  if(e.repeat)return;
  const k=e.key.toLowerCase();keys[k]=true;
  if(k==='j'||k==='z'||k==='enter'){inp.atk=.2;inp.t=clk;}
  if(k===' '||k==='k'||k==='shift'){inp.dash=true;e.preventDefault();}
});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
const zone=$('zone'),joy=$('joy'),knob=$('knob');
let joyId=null,jox=0,joy0=0;
const JR=55;
zone.addEventListener('pointerdown',e=>{
  if(joyId!==null)return;joyId=e.pointerId;zone.setPointerCapture(joyId);
  jox=e.clientX;joy0=e.clientY;joy.style.left=jox+'px';joy.style.top=joy0+'px';joy.style.display='block';knob.style.transform='';
  joyMove(e);
});
function joyMove(e){
  let dx=e.clientX-jox,dy=e.clientY-joy0;const l=Math.hypot(dx,dy);
  if(l>JR){dx*=JR/l;dy*=JR/l;}
  knob.style.transform=`translate(${dx}px,${dy}px)`;
  const m=Math.hypot(dx,dy)/JR;
  if(m<.12){joyVec.x=joyVec.y=0;}else{joyVec.x=dx/JR;joyVec.y=dy/JR;}
}
const joyVec={x:0,y:0};
zone.addEventListener('pointermove',e=>{if(e.pointerId===joyId)joyMove(e);});
const joyEnd=e=>{if(e.pointerId!==joyId)return;joyId=null;joyVec.x=joyVec.y=0;joy.style.display='none';};
zone.addEventListener('pointerup',joyEnd);zone.addEventListener('pointercancel',joyEnd);
function bindBtn(el,fn){
  el.addEventListener('pointerdown',e=>{e.preventDefault();el.classList.add('down');fn();});
  const up=()=>el.classList.remove('down');
  el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);el.addEventListener('pointerleave',up);
}
bindBtn($('bAtk'),()=>{inp.atk=.2;inp.t=clk;});
bindBtn($('bDash'),()=>{inp.dash=true;});
addEventListener('contextmenu',e=>e.preventDefault());

// ---------- settings UI ----------
const panel=$('panel');
const fmt=(k,v)=>k==='hitStop'?v.toFixed(0):(+v).toFixed(k==='outline'?3:2).replace(/\.?0+$/,'')||'0';
CFG.forEach(([title,items],gi)=>{
  const d=document.createElement('details');if(gi===0)d.open=true;
  d.innerHTML='<summary>'+title+'</summary>';
  items.forEach(([k,label,mn,mx,st])=>{
    const l=document.createElement('label');l.innerHTML=label+'<b id="v_'+k+'"></b>';
    const r=document.createElement('input');r.type='range';r.min=mn;r.max=mx;r.step=st;r.id='s_'+k;
    r.addEventListener('input',()=>{S[k]=parseFloat(r.value);$('v_'+k).textContent=fmt(k,S[k]);save();applyLook();});
    d.append(l,r);
  });
  panel.appendChild(d);
});
const rb=document.createElement('button');rb.textContent='Reset to defaults';
rb.onclick=()=>{Object.assign(S,DEF);syncUI();save();applyLook();};
panel.appendChild(rb);
function syncUI(){for(const k in DEF){const r=$('s_'+k);if(r){r.value=S[k];$('v_'+k).textContent=fmt(k,S[k]);}}}
syncUI();
$('gear').onclick=()=>panel.classList.toggle('open');
function applyLook(){
  thickU.value=S.outline;sun.intensity=S.light*.65;hemi.intensity=S.light*.45;rimU.value=S.light;
}
applyLook();

// ---------- camera ----------
const YAW=Math.PI/4;
const camT={x:P.x,z:P.z};
let camShake=new THREE.Vector3();
function updateCamera(dt){
  const k=lerp(30,2.5,S.follow);
  const f=1-Math.exp(-k*dt);
  camT.x+=(P.x-camT.x)*f;camT.z+=(P.z-camT.z)*f;
  const el=S.angle*Math.PI/180,D=40;
  const aspect=innerWidth/innerHeight;
  const hh=Math.max(S.zoom,S.zoom*1.1/aspect*.7),hw=hh*aspect;
  camera.left=-hw;camera.right=hw;camera.top=hh;camera.bottom=-hh;camera.updateProjectionMatrix();
  camera.position.set(camT.x+Math.sin(YAW)*Math.cos(el)*D,Math.sin(el)*D,camT.z+Math.cos(YAW)*Math.cos(el)*D);
  camera.lookAt(camT.x,0,camT.z);
  if(shake>.001){
    camera.position.x+=(Math.random()-.5)*shake;camera.position.y+=(Math.random()-.5)*shake;camera.position.z+=(Math.random()-.5)*shake;
  }
  shake*=Math.exp(-14*dt);
  camera.updateMatrixWorld();
  sun.position.set(P.x+9,16,P.z+6);sun.target.position.set(P.x,0,P.z);
}
function resize(){renderer.setSize(innerWidth,innerHeight,false);}
addEventListener('resize',resize);resize();

// ---------- gameplay ----------
const FX=-Math.sin(YAW),FZ=-Math.cos(YAW),RX=Math.cos(YAW),RZ=-Math.sin(YAW);
function readMove(){
  let x=joyVec.x,y=joyVec.y;
  const kx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0);
  const ky=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);
  if(kx||ky){const l=Math.hypot(kx,ky);x=kx/l;y=ky/l;}
  return {wx:RX*x+FX*-y,wz:RZ*x+FZ*-y,m:Math.min(1,Math.hypot(x,y))};
}
function startAttack(step,mv){
  P.state='attack';P.step=step;P.t=0;P.hitDone=false;P.lunged=0;
  if(mv.m>.2)P.face=Math.atan2(mv.wx,mv.wz);
  else{
    let best=null,bd=4;
    for(const d of dummies){if(d.dead)continue;const l=Math.hypot(d.x-P.x,d.z-P.z);if(l<bd){bd=l;best=d;}}
    if(best)P.face=Math.atan2(best.x-P.x,best.z-P.z);
  }
}
function doHit(st,stepIdx){
  const fx=Math.sin(P.face),fz=Math.cos(P.face);let hit=false;
  for(const d of dummies){
    if(d.dead)continue;
    const dx=d.x-P.x,dz=d.z-P.z,l=Math.hypot(dx,dz);
    if(l>st.range+.6)continue;
    const a=Math.abs(angDiff(P.face,Math.atan2(dx,dz)));
    if(l>1.2&&a>st.arc/2)continue;
    hit=true;
    const big=stepIdx===2,dmg=Math.round(S.damage*st.dmg);
    d.hp-=dmg;d.flash=.14;
    const nx=l>1e-4?dx/l:fx,nz=l>1e-4?dz/l:fz,kn=S.knock*(big?1.6:1);
    d.kx+=nx*kn;d.kz+=nz*kn;
    d.rxv+=nz*(big?14:8);d.rzv+=-nx*(big?14:8);
    burst(d.x,1.5,d.z,big?0xffcf6b:0xffffff,big?14:7,big?6:4);
    dmgText(d.x,2.8,d.z,dmg,big);
    if(d.hp<=0){d.dead=true;d.t=0;burst(d.x,1.2,d.z,0xd8b878,18,6);}
  }
  if(hit){
    const big=stepIdx===2;
    hitStop=Math.max(hitStop,S.hitStop/1000*(big?1.6:1));
    shake=Math.max(shake,S.shake*(big?.7:.3));
  }
}
// a press chains only if it lands between the previous hit and hit + comboWindow
function chainStep(){
  return P.lastStep!==undefined&&inp.t>=P.hitT&&inp.t-P.hitT<=S.comboWindow?P.lastStep+1:0;
}
function updatePlayer(dt){
  const mv=readMove();
  clk+=dt;inp.atk=Math.max(0,inp.atk-dt);
  P.dashCd=Math.max(0,P.dashCd-dt);
  const canDash=P.dashCd<=0&&inp.dash&&(P.state==='free'||(P.state==='attack'&&P.t/STEPS[P.step].dur>STEPS[P.step].hitAt));
  if(canDash){
    P.state='dash';P.dashT=0;P.step=0;P.comboT=0;P.dashCd=S.dashCd;
    let dx=mv.wx,dz=mv.wz;if(mv.m<.2){dx=Math.sin(P.face);dz=Math.cos(P.face);}
    const l=Math.hypot(dx,dz)||1;P.dx=dx/l;P.dz=dz/l;P.face=Math.atan2(P.dx,P.dz);
    P.vx=P.vz=0;burst(P.x,.3,P.z,0xbfe6ff,8,3);
  }
  inp.dash=false;

  if(P.state==='free'){
    const tx=mv.wx*S.moveSpeed*mv.m,tz=mv.wz*S.moveSpeed*mv.m;
    const dvx=tx-P.vx,dvz=tz-P.vz,dl=Math.hypot(dvx,dvz),mx=S.accel*dt;
    if(dl<=mx){P.vx=tx;P.vz=tz;}else{P.vx+=dvx/dl*mx;P.vz+=dvz/dl*mx;}
    if(mv.m>.1)P.face+=angDiff(P.face,Math.atan2(mv.wx,mv.wz))*Math.min(1,dt*18);
    if(P.lastStep!==undefined){P.comboT=P.hitT+S.comboWindow-clk;if(P.comboT<=0){P.lastStep=undefined;P.step=0;}}
    if(inp.atk>0){
      inp.atk=0;startAttack(chainStep(),mv);
    }
  }else if(P.state==='attack'){
    const st=STEPS[P.step];P.t+=dt;const p=P.t/st.dur;
    // lunge during first 40%
    const target=S.lunge*st.lunge,want=target*clamp(p/.4,0,1);
    const ds=want-P.lunged;
    if(ds>0){P.x+=Math.sin(P.face)*ds;P.z+=Math.cos(P.face)*ds;P.lunged=want;}
    P.vx=P.vz=0;
    if(!P.hitDone&&p>=st.hitAt){P.hitDone=true;P.hitT=clk;inp.atk=0;doHit(st,P.step);}
    if(P.t>=st.dur){
      P.lastStep=P.step;P.state='free';
      if(P.step>=2){P.comboT=0;P.step=0;P.lastStep=undefined;}
      else P.comboT=P.hitT+S.comboWindow-clk;
      if(inp.atk>0){
        inp.atk=0;startAttack(chainStep(),mv);
      }
    }
  }else if(P.state==='dash'){
    const DT=.2;P.dashT+=dt;
    const sp=S.dashDist/DT;
    P.vx=P.dx*sp;P.vz=P.dz*sp;
    if(Math.random()<.5)burst(P.x,.4,P.z,0x8fc8ff,1,1);
    if(P.dashT>=DT){P.state='free';P.vx*=.3;P.vz*=.3;P.lastStep=undefined;P.step=0;P.comboT=0;}
  }
  P.x+=P.vx*dt;P.z+=P.vz*dt;
  resolve(P,.45);
  P.speed=Math.hypot(P.vx,P.vz);
}
function animatePlayer(dt){
  player.position.set(P.x,0,P.z);
  model.rotation.y=P.face;
  const sp=P.speed/Math.max(S.moveSpeed,1);
  P.ph+=dt*(8+sp*8)*(sp>.05?1:0);
  const sw=Math.sin(P.ph)*sp;
  feet[0].position.z=sw*.35;feet[1].position.z=-sw*.35;
  const idle=Math.sin(performance.now()/300)*.02;
  let lean=sp*.15,bob=Math.abs(Math.sin(P.ph))*.07*sp+idle;
  let sy=0,sx=.5;
  pivot.rotation.y=-.55;inner.rotation.x=.9;pivot.rotation.x=0;
  trailSmall.visible=trailBig.visible=false;
  if(P.state==='attack'){
    const st=STEPS[P.step],p=P.t/st.dur;
    const sp1=clamp(p/(st.hitAt+.12),0,1),e=1-Math.pow(1-sp1,3);
    const ret=clamp((p-.72)/.28,0,1);
    let yaw,pitch;
    if(P.step<2){yaw=lerp(st.from,st.to,e);pitch=.15;}
    else{yaw=0;pitch=lerp(-1.6,.95,e);}
    pivot.rotation.y=lerp(yaw,-.55,ret);inner.rotation.x=lerp(P.step<2?pitch:0,.9,ret);
    if(P.step>=2){pivot.rotation.x=lerp(pitch,0,ret);inner.rotation.x=lerp(0,.9,ret);}
    lean+=(P.step===2?.45:.25)*Math.sin(Math.min(1,p*1.6)*Math.PI);
    // swing trail
    const ta=clamp(1-(p-.15)/.45,0,1)*(p>.15?1:0);
    if(ta>0){const t=st.trail;t.visible=true;t.material.opacity=ta*.75;t.rotation.z=P.face;t.scale.setScalar(1+(1-ta)*.1);}
  }else if(P.state==='dash'){
    lean=.6;
  }
  model.rotation.x=0;
  body.rotation.x=lean;head.rotation.x=lean*.6;
  model.position.y=bob;
  scarf.rotation.y=Math.sin(performance.now()/120)*.2*(.3+sp);
  for(let i=0;i<3;i++)$('hud').children[i].className=(P.state==='attack'&&P.step>=i)||(P.state==='free'&&P.comboT>0&&P.lastStep!==undefined&&P.lastStep>=i)?'on':'';
  $('bDash').classList.toggle('cd',P.dashCd>0);
}
function updateDummies(dt){
  for(const d of dummies){
    d.flash=Math.max(0,d.flash-dt);
    const f=d.flash/.14;
    for(const m of d.mats)m.emissive.setRGB(f,f,f);
    if(d.dead){
      d.t+=dt;
      d.rx+=d.rxv*dt;d.rz+=d.rzv*dt;d.rxv*=.9;d.rzv*=.9;
      d.g.scale.setScalar(Math.max(0,1-Math.max(0,d.t-.25)/.35));
      d.g.rotation.x=d.rx;d.g.rotation.z=d.rz;
      d.x+=d.kx*dt;d.z+=d.kz*dt;d.kx*=Math.exp(-6*dt);d.kz*=Math.exp(-6*dt);
      d.g.position.set(d.x,0,d.z);
      if(d.t>2){d.dead=false;d.hp=100;d.x=d.hx;d.z=d.hz;d.kx=d.kz=0;d.rx=d.rz=d.rxv=d.rzv=0;d.pop=0;burst(d.x,.5,d.z,0xffffff,8,3);}
      continue;
    }
    if(d.pop<1){d.pop=Math.min(1,d.pop+dt*4);const s=d.pop,o=1.70158;d.g.scale.setScalar(1+(o+1)*Math.pow(s-1,3)+o*Math.pow(s-1,2));}
    d.x+=d.kx*dt;d.z+=d.kz*dt;const dec=Math.exp(-6*dt);d.kx*=dec;d.kz*=dec;
    const pp={x:d.x,z:d.z};resolve(pp,.7,d);
    // don't let dummies be shoved into the player
    const pdx=pp.x-P.x,pdz=pp.z-P.z,pl=Math.hypot(pdx,pdz);if(pl<1.15&&pl>1e-5){pp.x=P.x+pdx/pl*1.15;pp.z=P.z+pdz/pl*1.15;}
    d.x=pp.x;d.z=pp.z;
    d.rxv+=(-70*d.rx-7*d.rxv)*dt;d.rzv+=(-70*d.rz-7*d.rzv)*dt;
    d.rx+=d.rxv*dt;d.rz+=d.rzv*dt;
    d.g.rotation.x=d.rx;d.g.rotation.z=d.rz;
    d.g.position.set(d.x,0,d.z);
  }
}
function updateParts(dt){
  for(const p of parts){
    if(p.life<=0)continue;
    p.life-=dt;if(p.life<=0){p.m.visible=false;continue;}
    p.v.y-=18*dt;p.m.position.addScaledVector(p.v,dt);
    if(p.m.position.y<0){p.m.position.y=0;p.v.y*=-.3;}
    p.m.scale.setScalar(Math.min(1,p.life*3));p.m.rotation.x+=dt*8;p.m.rotation.y+=dt*6;
  }
}

// ---------- loop ----------
let last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  let dt=Math.min((now-last)/1000,.05);last=now;const rdt=Math.max(dt,.001);
  if(hitStop>0){hitStop-=dt;dt=0;}
  if(dt>0){
    updatePlayer(dt);updateDummies(dt);updateParts(dt);
    for(const r of rocks)r.position.y=r.userData.y0+Math.sin(now/1000+r.userData.ph)*.5;
    animatePlayer(dt);
  }
  updateCamera(rdt);
  renderer.render(scene,camera);
}
requestAnimationFrame(frame);
})();
</script>
