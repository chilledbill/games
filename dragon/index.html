<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#8fc6e8">
<title>Dragon Runner</title>
<style>
  :root{
    --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
    --gold:#ffd34d; --ink:#1b1410; --panel:rgba(20,14,10,.78);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  html,body{position:fixed;inset:0;overflow:hidden;background:#0d0f14;touch-action:none;overscroll-behavior:none;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#fff}
  .hidden{display:none!important}

  /* Portrait play area. On a phone it fills the screen; on desktop it's a phone-shaped column. */
  #app{position:absolute;top:0;left:50%;transform:translateX(-50%);height:100%;overflow:hidden;background:#8fc6e8}
  #app canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  #zone{position:absolute;inset:0;touch-action:none}

  /* ---------- HUD ---------- */
  #hud{position:absolute;inset:0;pointer-events:none}
  #topbar{position:absolute;left:12px;right:12px;top:calc(10px + var(--st));display:flex;align-items:center;gap:10px}
  #hearts{display:flex;gap:4px;font-size:24px;line-height:1;filter:drop-shadow(0 2px 0 rgba(0,0,0,.5))}
  #hearts .h.lost{opacity:.22;filter:grayscale(1)}
  #hearts .shield{font-size:22px}
  #progress{flex:1;height:10px;border-radius:6px;background:rgba(0,0,0,.35);overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,.5)}
  #progress i{display:block;height:100%;width:0%;background:linear-gradient(90deg,#ffb347,#ff5e3a);border-radius:6px}
  #coins{min-width:62px;text-align:right;font-weight:800;font-size:20px;color:var(--gold);text-shadow:0 2px 0 rgba(0,0,0,.6)}
  #coins.pop{animation:pop .18s ease-out}
  @keyframes pop{50%{transform:scale(1.3)}}

  #flash{position:absolute;inset:0;opacity:0;transition:opacity .25s ease-out;pointer-events:none}

  /* Rage button: bottom center, conic fill shows charge */
  #rageBtn{position:absolute;left:50%;bottom:calc(22px + var(--sb));width:92px;height:92px;margin-left:-46px;border-radius:50%;
    pointer-events:auto;touch-action:none;display:flex;align-items:center;justify-content:center;
    background:conic-gradient(#ff7a1a calc(var(--p,0)*1%), rgba(0,0,0,.45) 0);box-shadow:0 4px 12px rgba(0,0,0,.4)}
  #rageBtn::before{content:"";position:absolute;inset:7px;border-radius:50%;background:#2a1a12}
  #rageBtn span{position:relative;font-weight:900;font-size:15px;letter-spacing:.08em;color:#c9a88f}
  #rageBtn.ready{animation:pulse .7s ease-in-out infinite alternate}
  #rageBtn.ready::before{background:radial-gradient(circle,#ffcf5a,#ff5a1a 70%)}
  #rageBtn.ready span{color:#3b1300;font-size:18px}
  #rageBtn.active::before{background:radial-gradient(circle,#fff3b0,#ff8a1f 70%)}
  #rageBtn.active span{color:#3b1300}
  @keyframes pulse{from{transform:scale(1);box-shadow:0 0 10px 2px rgba(255,140,30,.6)}to{transform:scale(1.1);box-shadow:0 0 28px 10px rgba(255,140,30,.9)}}

  /* ---------- Screens ---------- */
  .screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
    background:linear-gradient(180deg,rgba(10,6,4,.35),rgba(10,6,4,.75));text-align:center;padding:24px}
  .screen h1{font-size:44px;line-height:1;font-weight:900;letter-spacing:.02em;color:var(--gold);text-shadow:0 4px 0 #7a2b0a,0 8px 18px rgba(0,0,0,.5)}
  .screen p{color:#f3e6d8;font-size:16px;max-width:300px;line-height:1.45}
  .screen .how{background:var(--panel);border-radius:14px;padding:12px 16px;font-size:15px;line-height:1.6;text-align:left}
  .btn{pointer-events:auto;border:0;border-radius:14px;padding:16px 34px;font-size:20px;font-weight:900;letter-spacing:.04em;color:#3b1300;
    background:linear-gradient(180deg,#ffd75e,#ff9a2e);box-shadow:0 5px 0 #a4480f,0 10px 20px rgba(0,0,0,.35);cursor:pointer}
  .btn:active{transform:translateY(3px);box-shadow:0 2px 0 #a4480f}
  #stars{font-size:52px;letter-spacing:6px}
  #stars .off{opacity:.2;filter:grayscale(1)}
  #resCoins{font-size:22px;font-weight:800;color:var(--gold)}

  /* ---------- Debug panel (?debug=1) ---------- */
  #debug{position:absolute;right:6px;top:calc(40px + var(--st));width:190px;max-height:70%;overflow:auto;background:rgba(0,0,0,.72);
    border-radius:10px;padding:8px 10px;font-size:12px;pointer-events:auto;line-height:1.5}
  #debug h4{font-size:12px;color:var(--gold);margin:4px 0}
  #debug label{display:flex;justify-content:space-between;align-items:center;gap:6px}
  #debug input[type=number]{width:62px;background:#222;color:#fff;border:1px solid #555;border-radius:4px;padding:1px 4px}
  #debug button{margin-top:6px;width:100%;padding:5px;border-radius:6px;border:0;background:#444;color:#fff}
  #fps{position:absolute;left:12px;top:calc(40px + var(--st));font:12px monospace;color:#fff;text-shadow:0 1px 2px #000}
</style>
</head>
<body>
<div id="app">
  <div id="zone"></div>

  <div id="hud" class="hidden">
    <div id="topbar">
      <div id="hearts"></div>
      <div id="progress"><i></i></div>
      <div id="coins">0</div>
    </div>
    <div id="rageBtn" class="hidden"><span>RAGE</span></div>
  </div>
  <div id="flash"></div>

  <div id="start" class="screen">
    <h1>DRAGON<br>RUNNER</h1>
    <div class="how">
      👆 Swipe left / right to change lanes<br>
      🔥 Your dragon breathes fire automatically<br>
      💥 Burn wood &amp; enemies, dodge grey stone
    </div>
    <button class="btn" id="playBtn">FLY!</button>
  </div>

  <div id="results" class="screen hidden">
    <h1 id="resTitle">GATE DESTROYED!</h1>
    <div id="stars"></div>
    <div id="resCoins"></div>
    <button class="btn" id="retryBtn">FLY AGAIN</button>
  </div>

  <div id="debug" class="hidden"></div>
  <div id="fps" class="hidden"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="js/config.js"></script>
<script src="js/input.js"></script>
<script src="js/world.js"></script>
<script src="js/player.js"></script>
<script src="js/entities.js"></script>
<script src="js/combat.js"></script>
<script src="js/level.js"></script>
<script src="js/hud.js"></script>
<script src="js/main.js"></script>
</body>
</html>
